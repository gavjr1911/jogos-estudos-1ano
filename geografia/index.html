/* ============================================================
   PLAYER DE ÁUDIO (clipes em sequência) — um único <audio>
   destravado no 1º toque (compatível com iPhone/iPad).
   ============================================================ */
const AUDIO_DIR='audio/', AUDIO_EXT='.mp3';
const player=new Audio();
player.preload='auto';
let playToken=0, audioOn=true;
function stopAudio(){ playToken++; try{player.pause();}catch(e){} setPlayingBadge(false); }
function playKeys(keys){
  if(!audioOn) return;
  stopAudio();
  const list=[].concat(...keys.map(k=>Array.isArray(k)?k:[k])).filter(Boolean);
  if(!list.length) return;
  const my=playToken; let i=0;
  setPlayingBadge(true);
  const next=()=>{
    if(my!==playToken) return;
    if(i>=list.length){ setPlayingBadge(false); return; }
    const key=list[i++];
    player.src=AUDIO_DIR+key+AUDIO_EXT;
    player.onended=next;
    player.onerror=()=>{ setTimeout(next,10); };
    const p=player.play();
    if(p&&p.catch) p.catch(()=>setTimeout(next,10));
  };
  next();
}
function setPlayingBadge(on){
  const b=document.getElementById('qspeak'); if(b) b.classList.toggle('playing',on);
}
function unlockAudio(){
  try{ player.muted=true; player.src=AUDIO_DIR+'greet'+AUDIO_EXT;
       const p=player.play();
       if(p&&p.then) p.then(()=>{player.pause();player.currentTime=0;player.muted=false;})
                      .catch(()=>{player.muted=false;});
       else {player.pause();player.muted=false;}
  }catch(e){ player.muted=false; }
}

/* ===== SONS DE EFEITO (Web Audio) ===== */
let actx=null;
function initAudio(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }
function tone(freq,start,dur,type='sine',vol=0.2){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
  const t=actx.currentTime+start;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.start(t); o.stop(t+dur);
}
function sndClick(){ initAudio(); tone(540,0,0.07,'triangle',0.14); }
function sndRight(){ initAudio(); [523,659,784,1047].forEach((f,i)=>tone(f,i*0.09,0.25,'triangle',0.18)); }
function sndWrong(){ initAudio(); tone(300,0,0.18,'sine',0.13); tone(220,0.12,0.25,'sine',0.13); }
function sndWin(){ initAudio(); [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*0.12,0.3,'triangle',0.2)); }

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rint(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}

function burst(){
  const cols=['#ff6b9d','#ffd93d','#6bcB77','#4d96ff','#a06cd5','#ff924c'];
  for(let i=0;i<70;i++){confs.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-0.5)*14,vy:Math.random()*-12-3,c:pick(cols),s:rint(7,14),r:Math.random()*6,vr:(Math.random()-.5)*.4});}
}
function loopConf(){
  cx.clearRect(0,0,cv.width,cv.height);
  confs.forEach(p=>{p.vy+=0.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s);cx.restore();});
  confs=confs.filter(p=>p.y<cv.height+30);
  requestAnimationFrame(loopConf);
}
loopConf();

/* ===== MOTOR DE RODADAS ===== */
let current=null, locked=false;
function startGame(id){
  const rounds=BUILDERS[id]();
  current={id, title:GAMES.find(g=>g.id===id).nome, rounds, idx:0};
  renderRound();
}
function gameFrame(c,r,bodyHtml){
  shell(`
    <div class="game">
      <h2 class="game-title">${GAMES.find(g=>g.id===c.id).ico} ${c.title}</h2>
      <div class="progress">Pergunta ${c.idx+1} de ${c.rounds.length}</div>
      <div class="question">
        <button class="speak-btn" id="qspeak" onclick="sndClick();speakRound()">🔊</button>
        <span>${r.q}</span>
      </div>
      <div class="stage">${r.stage||''}</div>
      ${bodyHtml}
      <div style="font-size:14px;color:#aaa;margin-top:6px;">👆 Toque para responder. Toque no 🔊 para ouvir de novo.</div>
      <div class="feedback" id="fb"></div>
    </div>
  `);
}
function renderRound(){
  locked=false;
  const c=current, r=c.rounds[c.idx];
  gameFrame(c,r,`<div class="options ${r.colorOpts?'opt-colors':''}" id="opts"></div>`);
  const shown=shuffle(r.options);
  const opts=document.getElementById('opts');
  shown.forEach(o=>{
    const b=document.createElement('button');
    b.className='opt'+(o.big?' big':'');
    b.innerHTML=o.label;
    b.onclick=()=>answer(b,o);
    opts.appendChild(b);
  });
  window._roundKeys=[].concat(r.audio||[], ['choose'], shown.map(o=>o.aud));
  setTimeout(()=>speakRound(),400);
}
function speakRound(){ playKeys(window._roundKeys||[]); }

function showNextButton(){
  document.querySelectorAll('.opt').forEach(b=>b.onclick=null);
  const nb=document.createElement('button');
  nb.className='next-btn';
  const last=current.idx>=current.rounds.length-1;
  nb.textContent=last?'🏆 Terminar':'Próxima ➡';
  nb.onclick=()=>{sndClick();locked=false;if(last){winScreen();}else{current.idx++;renderRound();}};
  document.querySelector('.game').appendChild(nb);
}
function correctFlow(extraAudio){
  locked=true; sndRight(); burst(); addStar(1);
  const fb=document.getElementById('fb'); if(fb){fb.className='feedback good'; fb.textContent='⭐ Muito bem!';}
  playKeys(extraAudio.filter(Boolean));
  showNextButton();
}
function answer(btn,opt){
  if(locked) return;
  if(opt.correct){
    btn.classList.add('ok');
    document.querySelectorAll('.opt').forEach(b=>{if(b!==btn)b.classList.add('no');});
    correctFlow([opt.aud, pick(OK_KEYS), opt.expAud]);
  }else{
    btn.classList.add('no'); btn.onclick=null;
    sndWrong();
    const fb=document.getElementById('fb'); fb.className='feedback bad'; fb.textContent='🤔 Tenta de novo!';
    playKeys([opt.aud, pick(NO_KEYS)].filter(Boolean));
  }
}

function winScreen(){
  sndWin(); burst(); setTimeout(burst,400); setTimeout(burst,800);
  const c=current;
  shell(`

/* helper para montar opções a partir de um mapa de rótulos */
function mkOpts(correct, all, lblMap, extra){
  return shuffle(all).map(k=>{
    const o={label:lblMap[k], aud:k, correct:k===correct};
    if(extra) Object.assign(o, extra(k));
    return o;
  });
}

        options:mkOpts('en_tradicoes',['en_tradicoes','en_nada','en_videogame'],{
          en_tradicoes:'📖<span class="cap">Tradições e histórias</span>', en_nada:'🙅<span class="cap">Nada</span>', en_videogame:'🎮<span class="cap">Jogar videogame</span>'}) },
      { q:'O vovô mostra uma <b>imagem antiga</b> da família. Que fonte histórica é? 📷', audio:['q_fonte_foto'], stage:emo('👴🖼️👧',72), colorOpts:false,
        options:mkOpts('fh_foto',['fh_foto','fh_carta','fh_livro'],FH_LBL) },
      { q:'Um papel <b>escrito à mão</b> que chegava pelo correio. O que é? ✉️', audio:['q_fonte_carta'], stage:emo('✉️📮',80), colorOpts:false,
        options:mkOpts('fh_carta',['fh_carta','fh_foto','fh_roupa'],FH_LBL) },
      { q:'Na música: "o meu pai era paulista, meu <b>AVÔ</b>..." 🎵', audio:['q_mus_avo'], stage:emo('🎵👴',80)+'<div class="quote">"O meu pai era paulista, meu avô..."</div>', colorOpts:true,
        options:mkOpts('mu_pernambucano',['mu_pernambucano','mu_mineiro','mu_baiano'],MU_LBL) },
      { q:'Na música: "o meu <b>BISAVÔ</b>..." 🎵', audio:['q_mus_bisavo'], stage:emo('🎵🧓',80)+'<div class="quote">"O meu bisavô..."</div>', colorOpts:true,
        options:mkOpts('mu_mineiro',['mu_pernambucano','mu_mineiro','mu_baiano'],MU_LBL) },
      { q:'Na música: "o meu <b>TATARAVÔ</b>..." 🎵', audio:['q_mus_tataravo'], stage:emo('🎵👴🏽',80)+'<div class="quote">"Meu tataravô..."</div>', colorOpts:true,
        options:mkOpts('mu_baiano',['mu_pernambucano','mu_mineiro','mu_baiano'],MU_LBL) },
    ]);
  },

  /* 5. NOMES E SOBRENOMES */
  nomes(){
    return [
      { q:'Qual é o <b>SOBRENOME</b> da família de Pedro? ✍️', audio:['n_familia','q_sobrenome'], stage:FAM_PEDRO, colorOpts:true,
        options:mkOpts('n_silva',['n_silva','n_pedro','n_henrique'],{
          n_silva:'<span class="cap" style="font-size:24px">Silva</span>', n_pedro:'<span class="cap" style="font-size:24px">Pedro</span>', n_henrique:'<span class="cap" style="font-size:24px">Henrique</span>'}) },
      { q:'O que há em <b>comum</b> nos nomes dessa família? 🤔', audio:['q_comum'], stage:FAM_PEDRO, colorOpts:true,
        options:mkOpts('co_sobrenome',['co_sobrenome','co_altura','co_idade'],{
          co_sobrenome:'✍️<span class="cap">O mesmo sobrenome</span>', co_altura:'📏<span class="cap">A mesma altura</span>', co_idade:'🎂<span class="cap">A mesma idade</span>'}) },
      { q:'Quem é o <b>PAI</b> de Pedro? 👨', audio:['q_pai_pedro'], stage:FAM_PEDRO, colorOpts:false,
        options:mkOpts('pf_fabio',['pf_fabio','pf_ana','pf_fernanda'],PF_LBL) },
      { q:'Quem é a <b>MÃE</b> de Pedro? 👩', audio:['q_mae_pedro'], stage:FAM_PEDRO, colorOpts:false,
        options:mkOpts('pf_ana',['pf_fabio','pf_ana','pf_fernanda'],PF_LBL) },
      { q:'Quem é a <b>IRMÃ</b> de Pedro? 👧', audio:['q_irma_pedro'], stage:FAM_PEDRO, colorOpts:false,
        options:mkOpts('pf_fernanda',['pf_fabio','pf_ana','pf_fernanda'],PF_LBL) },
    ];
  },

  /* 6. BONS VIZINHOS */
  convivencia(){
    return shuffle(CONVIV).slice(0,7).map(it=>{
      const correct=it.ok?'v_op_ajuda':'v_op_atrapalha';
      const opts=mkOpts(correct, ['v_op_ajuda','v_op_atrapalha'], CV_LBL,
        k=>({expAud: k===correct?(it.ok?'v_ajuda':'v_atrapalha'):null}));
      return { q:'Isso <b>AJUDA</b> ou <b>ATRAPALHA</b> a convivência? 🤔', audio:['q_conv',it.s], stage:emo(it.e,80)+'<div class="cardtxt">'+it.txt+'</div>', colorOpts:false, options:opts };
    });
  },

  /* 7. QUEM FAZ O QUÊ? */
  responsa(){
    return shuffle(RESP).slice(0,7).map(it=>{
      const opts=mkOpts(it.who, ['re_adulto','re_crianca'], RE_LBL,
        k=>({expAud: k===it.who?(it.who==='re_adulto'?'x_adulto':'x_crianca'):null}));
      return { q:'Quem deve fazer isso em casa? 🏠', audio:['q_resp',it.r], stage:emo(it.e,80)+'<div class="cardtxt">'+it.txt+'</div>', colorOpts:false, options:opts };
    });
  },

  /* 8. MAPA DA ROTINA */
  rotina(){
    const rounds=[];
    const mkTrio=()=>shuffle(LUGARES).slice(0,3);
    /* esquerda (2) e direita (2) do lugar do meio */
    for(let i=0;i<2;i++){
      const t=mkTrio();
      rounds.push({ q:'Qual lugar está à <b>ESQUERDA</b> de '+t[1].nome+'? 👈', audio:['q_rot_esq',t[1].k],
        stage:mapStage(t), colorOpts:false, options:mkOpts(t[0].k, t.map(l=>l.k), PL_LBL) });
    }
    for(let i=0;i<2;i++){
      const t=mkTrio();
      rounds.push({ q:'Qual lugar está à <b>DIREITA</b> de '+t[1].nome+'? 👉', audio:['q_rot_dir',t[1].k],
        stage:mapStage(t), colorOpts:false, options:mkOpts(t[2].k, t.map(l=>l.k), PL_LBL) });
    }
    { const t=mkTrio();
      rounds.push({ q:'Qual lugar está <b>NO MEIO</b>? 🎯', audio:['q_rot_meio'],
        stage:mapStage(t), colorOpts:false, options:mkOpts(t[1].k, t.map(l=>l.k), PL_LBL) }); }
    /* para que serve cada lugar */
    const uso=[
      {qa:'q_estudar', c:'pl_escola',  q:'Para qual lugar vamos para <b>ESTUDAR</b>? 📚', e:'📚'},
      {qa:'q_pao',     c:'pl_padaria', q:'Onde compramos o <b>PÃOZINHO</b>? 🥖',          e:'🥖'},
      {qa:'q_nadar',   c:'pl_clube',   q:'Onde podemos <b>NADAR</b> na piscina? 🏊',      e:'🏊'},
    ];
    uso.forEach(u=>{
      const others=shuffle(LUGARES.filter(l=>l.k!==u.c)).slice(0,2).map(l=>l.k);
      rounds.push({ q:u.q, audio:[u.qa], stage:emo(u.e,80), colorOpts:false, options:mkOpts(u.c,[u.c,...others],PL_LBL) });
    });
    return shuffle(rounds).slice(0,7);
  },
};

/* ===== SPLASH -> INÍCIO ===== */
function enterApp(){
  initAudio();
  unlockAudio();
  document.getElementById('splash').style.display='none';
  goHome(true);
  setTimeout(()=>playKeys(['greet']),350);
}
document.getElementById('startBtn').addEventListener('click',enterApp);
document.getElementById('splash').addEventListener('click',e=>{ if(e.target.id!=='startBtn'){ enterApp(); } });
</script>
