<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Art Fun! — Art &amp; English</title>
<style>
  :root{
    --rosa:#ff6b9d; --roxo:#7c49b0; --azul:#4d96ff; --verde:#6bcB77;
    --amarelo:#ffd93d; --laranja:#ff924c; --vermelho:#ff5e5e; --ceu:#b8e3ff;
    --deep:#2a1052; --gold:#e8a838; --night:#0f0f3d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;
    background:linear-gradient(160deg,#e8d5f5 0%,#fce4ec 50%,#fff3e0 100%);
    color:#3a3a55; overflow-x:hidden; user-select:none;
    min-height:100%; touch-action:manipulation;
  }
  #app{max-width:760px; margin:0 auto; padding:14px; min-height:100vh;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; border-radius:22px; padding:8px 14px; margin-bottom:14px;
    box-shadow:0 6px 0 rgba(0,0,0,.08);
  }
  .topbar .nav{display:flex; align-items:center; gap:8px;}
  .topbar .back-btn,.topbar .home-btn{
    color:#fff; border:none; border-radius:16px;
    font-size:18px; padding:8px 14px; font-weight:bold; cursor:pointer;
    text-decoration:none; display:inline-flex; align-items:center; gap:4px;
  }
  .topbar .back-btn{background:var(--roxo); box-shadow:0 4px 0 #5c2e90;}
  .topbar .home-btn{background:var(--azul); box-shadow:0 4px 0 #2f6fd0;}
  .topbar .back-btn:active,.topbar .home-btn:active{transform:translateY(3px); box-shadow:none;}
  .stars{font-size:20px; font-weight:bold; color:var(--laranja); display:flex; align-items:center; gap:6px;}
  .stars .num{background:var(--amarelo); border-radius:14px; padding:2px 12px; box-shadow:0 3px 0 #d9a800;}

  .hero{
    text-align:center; background:#fff; border-radius:30px; padding:22px 18px;
    box-shadow:0 8px 0 rgba(0,0,0,.08); margin-bottom:18px;
  }
  .hero h1{font-size:30px; margin:6px 0; color:var(--roxo); line-height:1.2;}
  .hero p{font-size:17px; margin:4px 0; color:#666;}

  .mascote-wrap{width:120px; height:120px; margin:0 auto 8px; animation:flutua 2.5s ease-in-out infinite;}
  @keyframes flutua{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-12px) rotate(2deg);}}

  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
  .card{
    border:none; border-radius:22px; padding:14px 10px; cursor:pointer;
    color:#fff; font-size:17px; font-weight:bold; text-align:center;
    box-shadow:0 6px 0 rgba(0,0,0,.18); transition:transform .08s;
    display:flex; flex-direction:column; align-items:center; gap:8px; line-height:1.15;
  }
  .card:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.18);}
  .card .card-icon{width:64px; height:64px;}
  .card .sub{font-size:12px; font-weight:normal; opacity:.9;}
  .c1{background:linear-gradient(135deg,#e84393,#fd79a8);} .c2{background:linear-gradient(135deg,#0984e3,#74b9ff);}
  .c3{background:linear-gradient(135deg,#00b894,#55efc4);} .c4{background:linear-gradient(135deg,#2d3436,#636e72);}
  .c5{background:linear-gradient(135deg,#e17055,#fab1a0);} .c6{background:linear-gradient(135deg,#6c5ce7,#a29bfe);}
  .c7{background:linear-gradient(135deg,#fdcb6e,#f39c12);} .c8{background:linear-gradient(135deg,#00cec9,#81ecec);}

  .game{
    background:#fff; border-radius:30px; padding:18px; box-shadow:0 8px 0 rgba(0,0,0,.08);
    text-align:center;
  }
  .game-title{font-size:22px; color:var(--roxo); margin:0 0 4px; display:flex; align-items:center; justify-content:center; gap:8px;}
  .game-title .title-icon{width:32px; height:32px;}
  .progress{font-size:15px; color:#999; margin-bottom:10px;}
  .question{
    font-size:20px; font-weight:bold; color:#3a3a55; margin:6px 0 14px; line-height:1.35;
    display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
  }
  .speak-btn{
    background:var(--amarelo); border:none; border-radius:50%; width:48px; height:48px;
    font-size:24px; cursor:pointer; box-shadow:0 4px 0 #d9a800; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
  }
  .speak-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #d9a800;}
  .speak-btn.playing{animation:pulse .7s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}

  .stage{
    min-height:140px; display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:12px; margin:10px auto 18px; padding:16px;
    background:linear-gradient(160deg,#f8f4ff,#fff5f8); border-radius:22px; border:3px solid #e8d5f5;
    flex-direction:column; position:relative; overflow:hidden;
  }
  .stage .illust{max-width:320px; width:100%; height:auto;}
  .stage .illust-sm{max-width:160px; width:100%; height:auto;}
  .stage .label-txt{font-size:20px; font-weight:bold; color:var(--roxo); margin-top:6px; line-height:1.3;}
  .stage .desc-txt{font-size:16px; color:#555; margin-top:4px; line-height:1.5; max-width:440px; text-align:left;}
  .stage .clue-box{background:#fef9e7; border:2px solid #f0d78c; border-radius:14px; padding:14px 16px; margin:8px 0; max-width:440px; text-align:left; font-size:16px; line-height:1.55; color:#5a4000;}

  .options{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));}
  .opt{
    border:none; border-radius:22px; padding:14px 10px; font-size:20px; font-weight:bold;
    cursor:pointer; background:var(--azul); color:#fff; box-shadow:0 6px 0 #2f6fd0;
    min-height:72px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    word-break:break-word; line-height:1.15;
  }
  .opt .opt-icon{width:56px; height:56px; margin-bottom:2px;}
  .opt .opt-label{font-size:15px; font-weight:normal; opacity:.95;}
  .opt:active{transform:translateY(3px); box-shadow:0 3px 0 #2f6fd0;}
  .opt.ok{background:var(--verde)!important; box-shadow:0 6px 0 #3f9c4f!important; animation:tada .5s;}
  .opt.no{background:#cfcfe0!important; box-shadow:0 6px 0 #a0a0c0!important; opacity:.7;}
  @keyframes tada{0%{transform:scale(1);}30%{transform:scale(1.18) rotate(-4deg);}60%{transform:scale(1.1) rotate(4deg);}100%{transform:scale(1);};}

  .feedback{font-size:24px; font-weight:bold; min-height:36px; margin-top:12px;}
  .feedback.good{color:var(--verde);} .feedback.bad{color:var(--laranja);}
  .hint{font-size:13px; color:#bbb; margin:6px 0 0;}

  .next-btn{
    margin-top:14px; background:var(--verde); color:#fff; border:none; border-radius:22px;
    font-size:22px; font-weight:bold; padding:14px 34px; cursor:pointer; box-shadow:0 6px 0 #3f9c4f;
  }
  .next-btn:active{transform:translateY(3px); box-shadow:0 3px 0 #3f9c4f;}

  #splash{
    position:fixed; inset:0; background:linear-gradient(160deg,#6c5ce7,#e84393);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; z-index:50; cursor:pointer; padding:20px;
  }
  #splash h1{font-size:32px; margin:10px;}
  #splash .big{width:130px; height:130px; animation:flutua 2.5s infinite;}
  #splash .play{
    margin-top:24px; background:var(--amarelo); color:#5a4500; border:none; border-radius:30px;
    font-size:28px; font-weight:bold; padding:18px 44px; box-shadow:0 8px 0 #d9a800; cursor:pointer;
  }

  #confetti{position:fixed; inset:0; pointer-events:none; z-index:40;}
  .win{text-align:center; padding:20px;}
  .win .trophy-wrap{width:100px; height:100px; margin:0 auto 10px; animation:tada 1s;}

  @media(max-width:480px){
    .hero h1{font-size:24px;} .question{font-size:18px;} .card{font-size:15px;}
    .stage .illust{max-width:280px;} .stage .desc-txt{font-size:15px;}
  }
</style>
</head>
<body>

<div id="splash">
  <div class="big" id="splashIcon"></div>
  <h1>Art Fun!<br><span style="font-size:20px;font-weight:normal">Art &amp; English Adventures</span></h1>
  <p style="font-size:18px;max-width:340px;">Explore famous paintings and learn English through art!</p>
  <button class="play" id="startBtn">START</button>
</div>

<canvas id="confetti"></canvas>
<div id="app"></div>

let audioCtx,audioQueue=[],audioPlaying=false;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function unlockAudio(){if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}
function stopAudio(){audioQueue=[];audioPlaying=false;document.querySelectorAll('audio').forEach(a=>{a.pause();a.currentTime=0;});}
function playKeys(keys){
  keys=keys.filter(Boolean);if(!keys.length)return;
  audioQueue.push(...keys);if(!audioPlaying)playNext();
}
function playNext(){
  if(!audioQueue.length){audioPlaying=false;return;}
  audioPlaying=true;const k=audioQueue.shift();
  const a=new Audio('audio/'+k+'.mp3');
  a.onended=()=>setTimeout(playNext,150);
  a.onerror=()=>setTimeout(playNext,50);
  a.play().catch(()=>setTimeout(playNext,50));
}
function sndClick(){try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(audioCtx.currentTime+.06);}catch(e){}}
function sndRight(){try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='triangle';o.frequency.value=660;g.gain.value=.1;o.start();o.stop(audioCtx.currentTime+.15);}catch(e){}}
function sndWrong(){try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='sawtooth';o.frequency.value=180;g.gain.value=.07;o.start();o.stop(audioCtx.currentTime+.2);}catch(e){}}
function sndWin(){try{[523,659,784,1047].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='triangle';o.frequency.value=f;g.gain.value=.08;o.start(audioCtx.currentTime+i*.12);o.stop(audioCtx.currentTime+i*.12+.2);});}catch(e){}}

const OK_KEYS=['ok1','ok2','ok3','ok4','ok5','ok6'];
const NO_KEYS=['no1','no2','no3'];
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function pickN(a,n){return shuffle(a).slice(0,n);}

const CC=document.getElementById('confetti'),cx=CC.getContext('2d');
function resizeCC(){CC.width=window.innerWidth;CC.height=window.innerHeight;}
window.addEventListener('resize',resizeCC);resizeCC();
function burst(){const ps=[];for(let i=0;i<40;i++)ps.push({x:CC.width/2,y:CC.height/2,vx:(Math.random()-.5)*14,vy:Math.random()*-12-4,r:Math.random()*6+3,c:`hsl(${Math.random()*360},90%,60%)`,life:1});(function ani(){cx.clearRect(0,0,CC.width,CC.height);let alive=false;ps.forEach(p=>{if(p.life<=0)return;alive=true;p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.life-=.015;cx.globalAlpha=p.life;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fill();});cx.globalAlpha=1;if(alive)requestAnimationFrame(ani);else cx.clearRect(0,0,CC.width,CC.height);})();}

/* ===== GAME ENGINE ===== */
let current=null,locked=false;
function startGame(id){
  const rounds=BUILDERS[id]();
  current={id,title:GAMES.find(g=>g.id===id).nome,rounds,idx:0};
  renderRound();
}
function gameFrame(c,r,bodyHtml){
  const g=GAMES.find(g=>g.id===c.id);
  shell(`
    <div class="game">
      <h2 class="game-title"><div class="title-icon">${SVG[g.svg]()}</div> ${c.title}</h2>
      <div class="progress">Question ${c.idx+1} of ${c.rounds.length}</div>
      <div class="question">
        <button class="speak-btn" id="qspeak" onclick="sndClick();speakRound()">${SVG.speaker()}</button>
        <span>${r.q}</span>
      </div>
      <div class="stage">${r.stage||''}</div>
      ${bodyHtml}
      <p class="hint">Tap to answer. Tap the speaker to hear again.</p>
      <div class="feedback" id="fb"></div>
    </div>
  `);
}
function renderRound(){
  locked=false;
  const c=current,r=c.rounds[c.idx];
  gameFrame(c,r,`<div class="options" id="opts"></div>`);
  const shown=shuffle(r.options);
  const opts=document.getElementById('opts');
  shown.forEach(o=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML=(o.svg?svgOpt(o.svg):'')+`<span class="opt-label">${o.label}</span>`;
    b.onclick=()=>answer(b,o);
    opts.appendChild(b);
  });
  window._roundKeys=[].concat(r.audio||[],['choose'],shown.map(o=>o.aud).filter(Boolean));
  setTimeout(()=>speakRound(),400);
}
function speakRound(){playKeys(window._roundKeys||[]);}

function showNextButton(){
  document.querySelectorAll('.opt').forEach(b=>b.onclick=null);
  const nb=document.createElement('button');nb.className='next-btn';
  const last=current.idx>=current.rounds.length-1;
  nb.textContent=last?'Finish!':'Next';
  nb.onclick=()=>{sndClick();locked=false;if(last)winScreen();else{current.idx++;renderRound();}};
  document.querySelector('.game').appendChild(nb);
}
function correctFlow(ea){
  locked=true;sndRight();burst();addStar(1);
  const fb=document.getElementById('fb');if(fb){fb.className='feedback good';fb.textContent='Great job!';}
  playKeys(ea.filter(Boolean));showNextButton();
}
function answer(btn,opt){
  if(locked)return;
  if(opt.correct){
    btn.classList.add('ok');
    document.querySelectorAll('.opt').forEach(b=>{if(b!==btn)b.classList.add('no');});
    correctFlow([opt.aud,pick(OK_KEYS),opt.expAud]);
  }else{
    btn.classList.add('no');btn.onclick=null;sndWrong();
    const fb=document.getElementById('fb');fb.className='feedback bad';fb.textContent='Try again!';
    playKeys([opt.aud,pick(NO_KEYS)].filter(Boolean));
  }
}

    {q:'The artist wants to <b>draw a picture</b> on paper. Which supply does he need?',audio:['use_draw'],correct:'pencil',wrongs:['scissors','glue','paint']},
    {q:'The artist wants to <b>paint a picture</b> with colors on a canvas. What does she need?',audio:['use_paint'],correct:'brush',wrongs:['scissors','pencil','paper']},
    {q:'The artist needs to <b>cut out shapes</b> from paper. What tool does he use?',audio:['use_cut'],correct:'scissors',wrongs:['brush','crayon','palette']},
    {q:'The artist wants to <b>stick pieces of paper</b> together for a collage. What does she need?',audio:['use_glue'],correct:'glue',wrongs:['pencil','scissors','canvas']},
    {q:'The artist will <b>mix different colors</b> of paint together. Where does he do that?',audio:['use_mix'],correct:'palette',wrongs:['paper','glue','scissors']},
    {q:'The artist wants to <b>color a drawing</b> with bright, waxy colors. Which supply?',audio:['use_color'],correct:'crayon',wrongs:['scissors','glue','canvas']},
  ];
  return shuffle(tasks).slice(0,6).map(t=>{
    const c=SUPPLIES.find(s=>s.k===t.correct);
    const ws=t.wrongs.map(w=>SUPPLIES.find(s=>s.k===w));
    return {
      q:t.q,audio:t.audio,
      stage:`<div class="clue-box">Think carefully: which art supply solves this problem?</div>`,
      options:[
        {label:`<b>${c.en}</b><br><span class="opt-label">${c.cap}</span>`,svg:c.svg,aud:c.aud,correct:true},
        ...ws.map(w=>({label:`<b>${w.en}</b><br><span class="opt-label">${w.cap}</span>`,svg:w.svg,aud:w.aud}))
      ]
    };
  });
};

/* 3. NATURE WORDS — identify nature elements */
BUILDERS.nature=()=>{
  const items=shuffle(NATURE).slice(0,6);
  return items.map(it=>{
    const wrongs=pickN(NATURE.filter(x=>x.k!==it.k),3);
    return {
      q:'Look at this element of nature. What is it called in English?',
      audio:['q_nature_word'],
      stage:svgStage(it.svg,140)+`<div class="label-txt">${it.cap}</div>`,
      options:[
        {label:`<b>${it.en}</b>`,aud:it.aud,correct:true},
        ...wrongs.map(w=>({label:`<b>${w.en}</b>`,aud:w.aud}))
      ]
    };
  });
};

/* 4. DAY OR NIGHT — observe visual clues and reason */
BUILDERS.daynight=()=>{
  const rounds=[
    {q:'Look at this scene. The sun is shining brightly in a blue sky with clouds. Is it day or night?',
     stage:svgStage('scene_day',280),correct:'DAY',wrong:'NIGHT',caud:'en_day',waud:'en_night'},
    {q:'Look at this scene. Stars are twinkling and a crescent moon glows. The houses have lit windows. Is it day or night?',
     stage:svgStage('scene_night',280),correct:'NIGHT',wrong:'DAY',caud:'en_night',waud:'en_day'},
    {q:'In <i>The Starry Night</i>, Van Gogh painted swirling stars in a dark sky. Is this painting showing day or night?',
     stage:svgStage('starry_night',280),correct:'NIGHT',wrong:'DAY',caud:'en_night',waud:'en_day'},
    {q:'In <i>Wheat Field with Cypresses</i>, the sky is bright blue with white clouds and sunshine. Is it day or night?',
     stage:svgStage('wheat_field',280),correct:'DAY',wrong:'NIGHT',caud:'en_day',waud:'en_night'},
    {q:'When you see the moon and stars in the sky, in English we say it is...',
     stage:svgStage('moon_shape',120),correct:'NIGHTTIME',wrong:'DAYTIME',caud:'en_nighttime',waud:'en_daytime'},
    {q:'When the sun is high and the sky is bright and clear, in English we say it is...',
     stage:svgStage('sun_shape',120),correct:'DAYTIME',wrong:'NIGHTTIME',caud:'en_daytime',waud:'en_nighttime'},
  ];
  return shuffle(rounds).slice(0,6).map(r=>({
    q:r.q,audio:['q_daynight'],stage:r.stage,
    options:[
      {label:`<b>${r.correct}</b>`,aud:r.caud,correct:true},
      {label:`<b>${r.wrong}</b>`,aud:r.waud},
    ]
  }));
};

/* 5. FAMOUS ART — read the description, identify the painting */
BUILDERS.paintings=()=>{
  const items=shuffle(PAINTINGS).slice(0,5);
  return items.map(it=>{
    const wrongs=pickN(PAINTINGS.filter(x=>x.k!==it.k),3);
    return {
      q:'Look at this painting carefully. Read the description. What is its name?',
      audio:['q_painting_id'],
      stage:svgStage(it.svg,300)+`<div class="desc-txt">${it.desc}</div>`,
      options:[
        {label:`<b>${it.en}</b>`,aud:it.aud,correct:true},
        ...wrongs.map(w=>({label:`<b>${w.en}</b>`,aud:w.aud}))
      ]
    };
  });
};

/* 6. ART DETECTIVE — read clues WITHOUT seeing the image, then deduce */
BUILDERS.detective=()=>{
  const clues=[
    {q:`This painting shows a <b>dark sky full of stars</b> that seem to be swirling and moving. There is a <b>tall, dark cypress tree</b> on the left side, and a <b>small sleeping village</b> at the bottom. A <b>bright crescent moon</b> shines in the corner. Which painting is this?`,
     correct:'starry_night',wrongs:['wheat_field','sunflowers','bedroom']},
    {q:`In this painting, you see a <b>golden wheat field</b> stretching across the bottom. On the right side stands a <b>tall, dark green tree</b> called a cypress. The sky above is <b>bright blue with fluffy white clouds</b>. Mountains can be seen far away. Which painting is this?`,
     correct:'wheat_field',wrongs:['starry_night','sunflowers','self_portrait']},
    {q:`A simple <b>clay vase</b> sits on a table. Inside the vase are several <b>big yellow flowers</b> with dark brown centers. Some flowers look fresh, but others are starting to <b>droop and turn brown</b>. The background is a warm, plain color. Which painting is this?`,
     correct:'sunflowers',wrongs:['starry_night','bedroom','wheat_field']},
    {q:`This painting shows a <b>small room</b> with a <b>red bed</b> and white pillows. There are <b>two wooden chairs</b>, a little table, and pictures on the wall. The <b>walls are blue</b>. It is the room where the artist <b>slept</b> when he lived in Arles, France. Which painting is this?`,
     correct:'bedroom',wrongs:['self_portrait','sunflowers','starry_night']},
    {q:`The artist painted <b>his own face</b>! He has a <b>red-orange beard</b> and <b>blue eyes</b>. He wears a dark coat and a hat. The background has <b>swirling blue patterns</b>. He painted more than 30 pictures like this. Which painting is this?`,
     correct:'self_portrait',wrongs:['bedroom','sunflowers','wheat_field']},
  ];
  return shuffle(clues).slice(0,5).map(c=>{
    const right=PAINTINGS.find(p=>p.k===c.correct);
    const ws=c.wrongs.map(w=>PAINTINGS.find(p=>p.k===w));
    return {
      q:'Read the clues carefully. Which painting is being described?',
      audio:['q_painting_describe'],
      stage:`<div class="clue-box">${c.q}</div>`,
      options:[
        {label:`<b>${right.en}</b>`,aud:right.aud,correct:true},
        ...ws.map(w=>({label:`<b>${w.en}</b>`,aud:w.aud}))
      ]
    };
  });
};

BUILDERS.starry=()=>{
  const qs=[
    {q:'In <i>The Starry Night</i>, what shines brightly in the dark sky?',
     correct:{label:'<b>STARS</b><br>bright points of light',aud:'en_stars'},
     wrongs:[{label:'<b>SUN</b><br>gives us daylight',aud:'en_sun'},{label:'<b>CLOUDS</b><br>white shapes in sky',aud:'en_cloud'},{label:'<b>FLOWERS</b><br>colorful plants',aud:'en_flower'}]},
    {q:'There is a tall, dark tree on the left side of <i>The Starry Night</i>. What kind of tree is it?',
     correct:{label:'<b>CYPRESS</b><br>tall evergreen tree',aud:'en_cypress'},
     wrongs:[{label:'<b>WHEAT</b><br>golden grain',aud:'en_wheat'},{label:'<b>FLOWER</b><br>colorful plant',aud:'en_flower'},{label:'<b>MOUNTAIN</b><br>very tall land',aud:'en_mountain'}]},
    {q:'Besides the stars, there is a glowing <b>crescent shape</b> in the sky. What is it?',
     correct:{label:'<b>MOON</b><br>lights up the night',aud:'en_moon'},
     wrongs:[{label:'<b>SUN</b><br>lights up the day',aud:'en_sun'},{label:'<b>STAR</b><br>twinkles at night',aud:'en_star'},{label:'<b>CLOUD</b><br>white and fluffy',aud:'en_cloud'}]},
    {q:'Below the swirling sky, there is a group of small houses. In English, a small group of houses is called a...',
     correct:{label:'<b>VILLAGE</b><br>small group of houses',aud:'en_village'},
     wrongs:[{label:'<b>FIELD</b><br>open area of land',aud:'en_field'},{label:'<b>MOUNTAIN</b><br>very tall land',aud:'en_mountain'},{label:'<b>TREE</b><br>tall plant',aud:'en_tree'}]},
    {q:'<i>The Starry Night</i> is a famous painting. What do we call a picture made with paint?',
     correct:{label:'<b>PAINTING</b><br>art made with paint',aud:'en_painting'},
     wrongs:[{label:'<b>PAPER</b><br>writing surface',aud:'en_paper'},{label:'<b>PENCIL</b><br>drawing tool',aud:'en_pencil'},{label:'<b>BRUSH</b><br>painting tool',aud:'en_brush'}]},
    {q:'Who is the famous artist who painted <i>The Starry Night</i> in 1889?',
     correct:{label:'<b>VINCENT VAN GOGH</b>',aud:'en_vangogh'},
     wrongs:[{label:'<b>PABLO PICASSO</b>',aud:null},{label:'<b>LEONARDO DA VINCI</b>',aud:null},{label:'<b>CLAUDE MONET</b>',aud:null}]},
  ];
  return shuffle(qs).slice(0,6).map(q=>({
    q:q.q,audio:['q_starry_detail'],

    options:[{...q.correct,correct:true},...q.wrongs]
  }));
};

/* 8. VAN GOGH — facts about the artist that require reading and thinking */
BUILDERS.vangogh=()=>{
  const facts=[
    {q:'Vincent Van Gogh was born in a country in Europe. In English, that country is called...',
     correct:{label:'<b>THE NETHERLANDS</b><br>Holland',aud:'en_netherlands'},
     wrongs:[{label:'<b>FRANCE</b>',aud:'en_france'},{label:'<b>BRAZIL</b>',aud:null},{label:'<b>ENGLAND</b>',aud:null}]},
    {q:'Van Gogh moved to the city of Arles to paint. Arles is in which country?',
     correct:{label:'<b>FRANCE</b>',aud:'en_france'},
     wrongs:[{label:'<b>THE NETHERLANDS</b>',aud:'en_netherlands'},{label:'<b>BRAZIL</b>',aud:null},{label:'<b>ITALY</b>',aud:null}]},
    {q:'Van Gogh painted pictures of <b>his own face</b> many times. In English, a painting of your own face is called a...',
     correct:{label:'<b>SELF PORTRAIT</b>',aud:'en_self_portrait'},
     wrongs:[{label:'<b>LANDSCAPE</b><br>painting of nature',aud:null},{label:'<b>SUNFLOWERS</b>',aud:'en_sunflowers'},{label:'<b>THE BEDROOM</b>',aud:'en_bedroom'}]},
    {q:'Van Gogh loved painting these big, bright, yellow flowers. What are they called in English?',
     stage:svgStage('sunflowers',260),
     correct:{label:'<b>SUNFLOWERS</b>',aud:'en_sunflowers'},
     wrongs:[{label:'<b>ROSES</b>',aud:null},{label:'<b>STARS</b>',aud:'en_stars'},{label:'<b>TREES</b>',aud:'en_tree'}]},
    {q:'Van Gogh used very bold, bright colors in his paintings. A person who creates art is called an...',
     correct:{label:'<b>ARTIST</b>',aud:'en_artist'},
     wrongs:[{label:'<b>PAINTING</b>',aud:'en_painting'},{label:'<b>BRUSH</b>',aud:'en_brush'},{label:'<b>CANVAS</b>',aud:'en_canvas'}]},
    {q:'Van Gogh painted the room where he slept in Arles. What is the name of this famous painting?',
     stage:svgStage('bedroom',260),
     correct:{label:'<b>THE BEDROOM</b>',aud:'en_bedroom'},
     wrongs:[{label:'<b>THE STARRY NIGHT</b>',aud:'en_starry_night'},{label:'<b>SUNFLOWERS</b>',aud:'en_sunflowers'},{label:'<b>SELF PORTRAIT</b>',aud:'en_self_portrait'}]},

  return shuffle(facts).slice(0,6).map(f=>({
