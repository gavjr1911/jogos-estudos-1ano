<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Art Fun! — Arte em Inglês</title>
<style>
  :root{
    --rosa:#ff6b9d; --roxo:#7c49b0; --azul:#4d96ff; --verde:#6bcB77;
    --amarelo:#ffd93d; --laranja:#ff924c; --vermelho:#ff5e5e; --ceu:#b8e3ff;
    --deep:#2a1052; --gold:#e8a838; --night:#1a1a4e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;
    background:linear-gradient(160deg,#e8d5f5 0%,#fce4ec 50%,#fff3e0 100%);
    color:#3a3a55; overflow-x:hidden; user-select:none;
    min-height:100%; touch-action:manipulation;
  }
  #app{max-width:760px; margin:0 auto; padding:14px; min-height:100vh;}

  /* ===== TOPBAR ===== */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; border-radius:22px; padding:8px 14px; margin-bottom:14px;
    box-shadow:0 6px 0 rgba(0,0,0,.08);
  }
  .topbar .nav{display:flex; align-items:center; gap:8px;}
  .topbar .back-btn,.topbar .home-btn{
    color:#fff; border:none; border-radius:16px;
    font-size:18px; padding:8px 14px; font-weight:bold; cursor:pointer;
    text-decoration:none; display:inline-flex; align-items:center; gap:4px;
  }
  .topbar .back-btn{background:var(--roxo); box-shadow:0 4px 0 #5c2e90;}
  .topbar .home-btn{background:var(--azul); box-shadow:0 4px 0 #2f6fd0;}
  .topbar .back-btn:active,.topbar .home-btn:active{transform:translateY(3px); box-shadow:none;}
  .stars{font-size:20px; font-weight:bold; color:var(--laranja); display:flex; align-items:center; gap:6px;}
  .stars .num{background:var(--amarelo); border-radius:14px; padding:2px 12px; box-shadow:0 3px 0 #d9a800;}

  /* ===== HERO ===== */
  .hero{
    text-align:center; background:#fff; border-radius:30px; padding:22px 18px;
    box-shadow:0 8px 0 rgba(0,0,0,.08); margin-bottom:18px;
  }
  .hero h1{font-size:30px; margin:6px 0; color:var(--roxo); line-height:1.2;}
  .hero p{font-size:17px; margin:4px 0; color:#666;}

  /* ===== MASCOTE SVG ===== */
  .mascote-wrap{width:120px; height:120px; margin:0 auto 8px; animation:flutua 2.5s ease-in-out infinite;}
  @keyframes flutua{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-12px) rotate(2deg);}}

  /* ===== GRID DE JOGOS ===== */
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
  .card{
    border:none; border-radius:22px; padding:14px 10px; cursor:pointer;
    color:#fff; font-size:17px; font-weight:bold; text-align:center;
    box-shadow:0 6px 0 rgba(0,0,0,.18); transition:transform .08s;
    display:flex; flex-direction:column; align-items:center; gap:8px; line-height:1.15;
  }
  .card:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.18);}
  .card .card-icon{width:64px; height:64px;}
  .card .sub{font-size:12px; font-weight:normal; opacity:.9;}
  .c1{background:linear-gradient(135deg,#e84393,#fd79a8);} .c2{background:linear-gradient(135deg,#0984e3,#74b9ff);}
  .c3{background:linear-gradient(135deg,#00b894,#55efc4);} .c4{background:linear-gradient(135deg,#2d3436,#636e72);}
  .c5{background:linear-gradient(135deg,#e17055,#fab1a0);} .c6{background:linear-gradient(135deg,#6c5ce7,#a29bfe);}
  .c7{background:linear-gradient(135deg,#fdcb6e,#f39c12);} .c8{background:linear-gradient(135deg,#00cec9,#81ecec);}

  /* ===== GAME AREA ===== */
  .game{
    background:#fff; border-radius:30px; padding:18px; box-shadow:0 8px 0 rgba(0,0,0,.08);
    text-align:center;
  }
  .game-title{font-size:22px; color:var(--roxo); margin:0 0 4px; display:flex; align-items:center; justify-content:center; gap:8px;}
  .game-title .title-icon{width:32px; height:32px;}
  .progress{font-size:15px; color:#999; margin-bottom:10px;}
  .question{
    font-size:20px; font-weight:bold; color:#3a3a55; margin:6px 0 14px; line-height:1.35;
    display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
  }
  .speak-btn{
    background:var(--amarelo); border:none; border-radius:50%; width:48px; height:48px;
    font-size:24px; cursor:pointer; box-shadow:0 4px 0 #d9a800; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
  }
  .speak-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #d9a800;}
  .speak-btn.playing{animation:pulse .7s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}

  /* ===== STAGE (ilustração principal) ===== */
  .stage{
    min-height:140px; display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:12px; margin:10px auto 18px; padding:16px;
    background:linear-gradient(160deg,#f8f4ff,#fff5f8); border-radius:22px; border:3px solid #e8d5f5;
    flex-direction:column; position:relative; overflow:hidden;
  }
  .stage .illust{max-width:280px; width:100%; height:auto;}
  .stage .illust-sm{max-width:160px; width:100%; height:auto;}
  .stage .label-txt{font-size:20px; font-weight:bold; color:var(--roxo); margin-top:6px; line-height:1.3;}
  .stage .desc-txt{font-size:16px; color:#666; margin-top:4px; line-height:1.4; max-width:400px;}
  .stage .en-word{font-size:32px; font-weight:900; color:var(--deep); letter-spacing:1px; margin:4px 0;}
  .stage .row{display:flex; gap:14px; align-items:center; justify-content:center; flex-wrap:wrap;}

  /* ===== OPTIONS ===== */
  .options{display:grid; gap:12px; grid-template-columns:repeat(2,1fr);}
  .opt{
    border:none; border-radius:20px; padding:14px 10px; font-size:18px; font-weight:bold;
    cursor:pointer; background:#f0ecff; color:var(--deep); box-shadow:0 5px 0 #d5c8f0;
    min-height:70px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    word-break:break-word; line-height:1.15; transition:transform .08s;
  }
  .opt .opt-icon{width:48px; height:48px;}
  .opt .opt-label{font-size:15px;}
  .opt:active{transform:translateY(3px); box-shadow:0 2px 0 #d5c8f0;}
  .opt.ok{background:#d4edda!important; color:#155724!important; box-shadow:0 5px 0 #a3d9a5!important; animation:tada .5s;}
  .opt.no{background:#e9e9f0!important; color:#888!important; box-shadow:0 5px 0 #ccc!important; opacity:.6;}
  @keyframes tada{0%{transform:scale(1);}30%{transform:scale(1.12) rotate(-3deg);}60%{transform:scale(1.08) rotate(3deg);}100%{transform:scale(1);}}\

  .feedback{font-size:22px; font-weight:bold; min-height:36px; margin-top:12px;}
  .feedback.good{color:var(--verde);} .feedback.bad{color:var(--laranja);}

  .next-btn{
    margin-top:14px; background:var(--verde); color:#fff; border:none; border-radius:22px;
    font-size:22px; font-weight:bold; padding:14px 34px; cursor:pointer; box-shadow:0 6px 0 #3f9c4f;
  }
  .next-btn:active{transform:translateY(3px); box-shadow:0 3px 0 #3f9c4f;}

  .hint{font-size:14px; color:#aaa; margin-top:8px;}

  /* ===== SPLASH ===== */
  #splash{
    position:fixed; inset:0; background:linear-gradient(160deg,var(--roxo),var(--deep));
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; z-index:50; cursor:pointer; padding:20px;
  }
  #splash h1{font-size:32px; margin:14px 0 6px;}
  #splash p{font-size:18px; max-width:340px; line-height:1.4;}
  #splash .splash-art{width:140px; height:140px; margin-bottom:10px; animation:flutua 2.5s infinite;}
  #splash .play{
    margin-top:24px; background:var(--amarelo); color:#5a4500; border:none; border-radius:30px;
    font-size:28px; font-weight:bold; padding:16px 40px; box-shadow:0 8px 0 #d9a800; cursor:pointer;
  }

  #confetti{position:fixed; inset:0; pointer-events:none; z-index:40;}
  .win{text-align:center; padding:20px;}
  .win .trophy-wrap{width:100px; height:100px; margin:0 auto 12px; animation:tada 1s;}

  @media(max-width:480px){
    .hero h1{font-size:24px;} .question{font-size:18px;} .card{font-size:15px;}
    .stage .en-word{font-size:26px;} .opt{font-size:16px; min-height:60px;}
  }
</style>
</head>
<body>

<div id="splash">
  <svg class="splash-art" viewBox="0 0 140 140"><rect rx="20" width="140" height="140" fill="#fff2"/><g transform="translate(20,15)"><rect x="15" y="10" width="70" height="90" rx="4" fill="#f5e6c8" stroke="#c9a96e" stroke-width="2"/><rect x="20" y="15" width="60" height="50" rx="2" fill="#1a1a4e"/><circle cx="35" cy="30" r="6" fill="#ffd93d" opacity=".9"/><circle cx="55" cy="25" r="4" fill="#fff" opacity=".7"/><circle cx="65" cy="35" r="3" fill="#fff" opacity=".5"/><path d="M20 55 Q35 40 50 50 Q65 42 80 55 L80 65 L20 65Z" fill="#2d5016"/><circle cx="72" cy="38" r="5" fill="#ffd93d" opacity=".6"/><rect x="75" y="20" width="4" height="80" rx="2" fill="#8B4513"/><circle cx="77" cy="18" r="8" fill="#e17055"/><circle cx="77" cy="12" r="6" fill="#fab1a0"/></g></svg>
  <h1>Art Fun!<br><span style="font-size:20px;font-weight:normal">Arte em Inglês</span></h1>
  <p>Explore o mundo de Van Gogh, descubra obras famosas e aprenda vocabulário de arte em inglês!</p>
  <button class="play" id="startBtn">COMEÇAR</button>
</div>

<canvas id="confetti"></canvas>
<div id="app"></div>

<script>
/* ============================================================
   ART FUN! v2 — Inglês + Arte, 1º ano (Bernoulli)
   Módulo 9. Ilustrações SVG inline (sem emojis).
   Atividades com raciocínio: dedução, composição, comparação.
   ============================================================ */
const App=document.getElementById('app');
let stars=parseInt(localStorage.getItem('vitor_art2_stars')||'0',10);

/* ============================================================
   BANCO DE ILUSTRAÇÕES SVG
   Cada função retorna uma string SVG inline.
   ============================================================ */
const SVG={
  /* Materiais de arte */
  brush:()=>`<svg viewBox="0 0 100 100"><rect x="42" y="45" width="16" height="48" rx="3" fill="#8B6914"/><path d="M45 10 Q50 5 55 10 L58 45 H42 L45 10Z" fill="#e74c3c"/><path d="M46 12 Q50 8 54 12 L56 40 H44 L46 12Z" fill="#c0392b"/><rect x="40" y="43" width="20" height="6" rx="2" fill="#B8860B"/></svg>`,
  paint:()=>`<svg viewBox="0 0 100 100"><rect x="20" y="30" width="60" height="50" rx="6" fill="#e0e0e0" stroke="#bbb" stroke-width="2"/><rect x="24" y="25" width="52" height="10" rx="3" fill="#ccc"/><rect x="28" y="38" width="18" height="14" rx="2" fill="#e74c3c"/><rect x="52" y="38" width="18" height="14" rx="2" fill="#3498db"/><rect x="28" y="58" width="18" height="14" rx="2" fill="#f1c40f"/><rect x="52" y="58" width="18" height="14" rx="2" fill="#27ae60"/></svg>`,
  canvas:()=>`<svg viewBox="0 0 100 100"><rect x="15" y="12" width="70" height="55" rx="2" fill="#f5e6c8" stroke="#c9a96e" stroke-width="2"/><line x1="50" y1="68" x2="30" y2="92" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/><line x1="50" y1="68" x2="70" y2="92" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/><line x1="35" y1="82" x2="65" y2="82" stroke="#8B4513" stroke-width="2.5"/></svg>`,
  palette:()=>`<svg viewBox="0 0 100 100"><ellipse cx="50" cy="52" rx="38" ry="32" fill="#D2691E"/><ellipse cx="50" cy="50" rx="36" ry="30" fill="#DEB887"/><circle cx="35" cy="40" r="6" fill="#e74c3c"/><circle cx="50" cy="35" r="5" fill="#3498db"/><circle cx="62" cy="42" r="5" fill="#f1c40f"/><circle cx="58" cy="55" r="4" fill="#27ae60"/><circle cx="40" cy="58" r="4" fill="#9b59b6"/><ellipse cx="50" cy="50" rx="8" ry="6" fill="#c9a96e"/></svg>`,
  pencil:()=>`<svg viewBox="0 0 100 100"><rect x="35" y="15" width="16" height="60" rx="2" fill="#f1c40f"/><polygon points="43,75 35,75 38,90 43,95 48,90 51,75" fill="#f5cba7"/><polygon points="41,90 43,98 45,90" fill="#2c3e50"/><rect x="35" y="15" width="16" height="8" rx="2" fill="#e74c3c"/><line x1="43" y1="23" x2="43" y2="75" stroke="#e67e22" stroke-width="1" opacity=".3"/></svg>`,
  crayon:()=>`<svg viewBox="0 0 100 100"><rect x="37" y="25" width="14" height="50" rx="4" fill="#e74c3c"/><polygon points="44,25 37,25 40,12 44,8 48,12 51,25" fill="#c0392b"/><rect x="37" y="70" width="14" height="8" rx="2" fill="#2c3e50"/><text x="44" y="55" text-anchor="middle" fill="#fff" font-size="7" font-weight="bold">RED</text></svg>`,
  scissors:()=>`<svg viewBox="0 0 100 100"><ellipse cx="35" cy="72" rx="10" ry="12" fill="none" stroke="#666" stroke-width="3"/><ellipse cx="65" cy="72" rx="10" ry="12" fill="none" stroke="#666" stroke-width="3"/><line x1="38" y1="62" x2="58" y2="25" stroke="#999" stroke-width="4" stroke-linecap="round"/><line x1="62" y1="62" x2="42" y2="25" stroke="#999" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="45" r="3" fill="#999"/></svg>`,
  paper:()=>`<svg viewBox="0 0 100 100"><rect x="22" y="12" width="56" height="72" rx="3" fill="#fff" stroke="#ddd" stroke-width="2"/><line x1="30" y1="28" x2="70" y2="28" stroke="#ccc" stroke-width="1.5"/><line x1="30" y1="38" x2="65" y2="38" stroke="#ccc" stroke-width="1.5"/><line x1="30" y1="48" x2="68" y2="48" stroke="#ccc" stroke-width="1.5"/><line x1="30" y1="58" x2="55" y2="58" stroke="#ccc" stroke-width="1.5"/><polygon points="62,12 78,12 78,28 62,12" fill="#eee" stroke="#ddd" stroke-width="1"/></svg>`,
  glue:()=>`<svg viewBox="0 0 100 100"><rect x="32" y="35" width="24" height="45" rx="4" fill="#fff" stroke="#f39c12" stroke-width="2"/><rect x="36" y="20" width="16" height="18" rx="3" fill="#f39c12"/><circle cx="44" cy="16" r="4" fill="#f39c12"/><text x="44" y="62" text-anchor="middle" fill="#f39c12" font-size="10" font-weight="bold">GLUE</text></svg>`,

  /* Elementos da natureza */
  star_shape:()=>`<svg viewBox="0 0 100 100"><polygon points="50,8 61,38 94,38 67,58 78,90 50,70 22,90 33,58 6,38 39,38" fill="#ffd93d" stroke="#e8a838" stroke-width="2"/></svg>`,
  moon_shape:()=>`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="#ffeaa7"/><circle cx="62" cy="42" r="24" fill="#1a1a4e"/></svg>`,
  sun_shape:()=>`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="18" fill="#f39c12"/><g stroke="#f39c12" stroke-width="3" stroke-linecap="round"><line x1="50" y1="14" x2="50" y2="24"/><line x1="50" y1="76" x2="50" y2="86"/><line x1="14" y1="50" x2="24" y2="50"/><line x1="76" y1="50" x2="86" y2="50"/><line x1="24" y1="24" x2="31" y2="31"/><line x1="69" y1="69" x2="76" y2="76"/><line x1="76" y1="24" x2="69" y2="31"/><line x1="31" y1="69" x2="24" y2="76"/></g></svg>`,
  tree_shape:()=>`<svg viewBox="0 0 100 100"><rect x="44" y="60" width="12" height="30" rx="2" fill="#8B4513"/><ellipse cx="50" cy="42" rx="28" ry="30" fill="#27ae60"/><ellipse cx="38" cy="48" rx="18" ry="22" fill="#2ecc71"/><ellipse cx="60" cy="46" rx="16" ry="20" fill="#27ae60"/></svg>`,
  flower_shape:()=>`<svg viewBox="0 0 100 100"><rect x="47" y="55" width="6" height="35" rx="2" fill="#27ae60"/><ellipse cx="36" cy="64" rx="12" ry="5" fill="#27ae60" transform="rotate(-30,36,64)"/><circle cx="50" cy="42" r="10" fill="#f1c40f"/><circle cx="50" cy="28" r="10" fill="#e74c3c"/><circle cx="62" cy="35" r="10" fill="#e74c3c"/><circle cx="62" cy="49" r="10" fill="#e74c3c"/><circle cx="50" cy="56" r="10" fill="#e74c3c"/><circle cx="38" cy="49" r="10" fill="#e74c3c"/><circle cx="38" cy="35" r="10" fill="#e74c3c"/></svg>`,
  cloud_shape:()=>`<svg viewBox="0 0 100 100"><ellipse cx="50" cy="55" rx="30" ry="16" fill="#ecf0f1"/><ellipse cx="35" cy="50" rx="20" ry="15" fill="#ecf0f1"/><ellipse cx="62" cy="48" rx="18" ry="14" fill="#ecf0f1"/><ellipse cx="48" cy="42" rx="16" ry="12" fill="#f5f5f5"/></svg>`,
  mountain_shape:()=>`<svg viewBox="0 0 100 100"><polygon points="10,85 40,25 70,85" fill="#7f8c8d"/><polygon points="40,25 48,40 32,40" fill="#ecf0f1"/><polygon points="35,85 65,35 95,85" fill="#95a5a6"/><polygon points="65,35 72,48 58,48" fill="#ecf0f1"/></svg>`,
  cypress_shape:()=>`<svg viewBox="0 0 100 100"><rect x="46" y="60" width="8" height="30" rx="2" fill="#5D4037"/><ellipse cx="50" cy="40" rx="12" ry="35" fill="#1B5E20"/><ellipse cx="50" cy="38" rx="9" ry="30" fill="#2E7D32"/></svg>`,
  wheat_shape:()=>`<svg viewBox="0 0 100 100"><line x1="50" y1="90" x2="50" y2="30" stroke="#8B6914" stroke-width="2"/><ellipse cx="50" cy="28" rx="4" ry="10" fill="#DAA520"/><ellipse cx="44" cy="36" rx="3" ry="8" fill="#DAA520" transform="rotate(-20,44,36)"/><ellipse cx="56" cy="36" rx="3" ry="8" fill="#DAA520" transform="rotate(20,56,36)"/><ellipse cx="42" cy="48" rx="3" ry="7" fill="#DAA520" transform="rotate(-25,42,48)"/><ellipse cx="58" cy="48" rx="3" ry="7" fill="#DAA520" transform="rotate(25,58,48)"/></svg>`,

  /* Pinturas famosas (simplificadas) */

/* ============================================================
   PLAYER DE ÁUDIO
   ============================================================ */
const AUDIO_DIR='audio/', AUDIO_EXT='.mp3';
const player=new Audio(); player.preload='auto';
let playToken=0,audioOn=true;
function stopAudio(){playToken++;try{player.pause();}catch(e){}setPlayingBadge(false);}
function playKeys(keys){
  if(!audioOn)return; stopAudio();
  const list=[].concat(...keys.map(k=>Array.isArray(k)?k:[k])).filter(Boolean);
  if(!list.length)return;
  const my=playToken;let i=0;setPlayingBadge(true);
  const next=()=>{
    if(my!==playToken)return;
    if(i>=list.length){setPlayingBadge(false);return;}
    const key=list[i++];
    player.src=AUDIO_DIR+key+AUDIO_EXT;
    player.onended=next;
    player.onerror=()=>setTimeout(next,10);
    const p=player.play();if(p&&p.catch)p.catch(()=>setTimeout(next,10));
  };next();
}
function setPlayingBadge(on){const b=document.getElementById('qspeak');if(b)b.classList.toggle('playing',on);}
function unlockAudio(){
  try{player.muted=true;player.src=AUDIO_DIR+'greet'+AUDIO_EXT;
  const p=player.play();
  if(p&&p.then)p.then(()=>{player.pause();player.currentTime=0;player.muted=false;}).catch(()=>{player.muted=false;});
  else{player.pause();player.muted=false;}}catch(e){player.muted=false;}
}

/* ===== SONS ===== */
let actx=null;
function initAudio(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}}
function tone(f,s,d,t='sine',v=.2){if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.value=f;o.connect(g);g.connect(actx.destination);const tt=actx.currentTime+s;g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(v,tt+.02);g.gain.exponentialRampToValueAtTime(.001,tt+d);o.start(tt);o.stop(tt+d);}
function sndClick(){initAudio();tone(540,0,.07,'triangle',.14);}
function sndRight(){initAudio();[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.25,'triangle',.18));}
function sndWrong(){initAudio();tone(300,0,.18,'sine',.13);tone(220,.12,.25,'sine',.13);}
function sndWin(){initAudio();[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.12,.3,'triangle',.2));}

/* ===== UTILS ===== */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function pickN(a,n,ex){return shuffle(a.filter(x=>!ex||ex.indexOf(x)<0)).slice(0,n);}
const OK_KEYS=['ok1','ok2','ok3','ok4','ok5','ok6'],NO_KEYS=['no1','no2','no3'];
function updateStars(){const el=document.getElementById('starNum');if(el)el.textContent=stars;localStorage.setItem('vitor_art2_stars',stars);}
function addStar(n=1){stars+=n;updateStars();}

/* ===== CONFETE ===== */
const cv=document.getElementById('confetti'),cx=cv.getContext('2d');let confs=[];
function resizeCv(){cv.width=innerWidth;cv.height=innerHeight;}addEventListener('resize',resizeCv);resizeCv();
function burst(){const cols=['#ff6b9d','#ffd93d','#6bcB77','#4d96ff','#a06cd5','#ff924c'];for(let i=0;i<70;i++){confs.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-3,c:pick(cols),s:Math.floor(Math.random()*8)+7,r:Math.random()*6,vr:(Math.random()-.5)*.4});}}
function loopConf(){cx.clearRect(0,0,cv.width,cv.height);confs.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s);cx.restore();});confs=confs.filter(p=>p.y<cv.height+30);requestAnimationFrame(loopConf);}loopConf();

let current=null,locked=false;
function startGame(id){
  const rounds=BUILDERS[id]();
  current={id,title:GAMES.find(g=>g.id===id).nome,rounds,idx:0};
  renderRound();
}
function gameFrame(c,r,bodyHtml){
  const g=GAMES.find(g=>g.id===c.id);
  shell(`
    <div class="game">
      <h2 class="game-title"><div class="title-icon">${SVG[g.svg]()}</div> ${c.title}</h2>
      <div class="progress">Pergunta ${c.idx+1} de ${c.rounds.length}</div>
      <div class="question">
        <button class="speak-btn" id="qspeak" onclick="sndClick();speakRound()">${SVG.speaker()}</button>
        <span>${r.q}</span>
      </div>
      <div class="stage">${r.stage||''}</div>
      ${bodyHtml}
      <p class="hint">Toque para responder. Toque no alto-falante para ouvir de novo.</p>
      <div class="feedback" id="fb"></div>
    </div>
  `);
}
function renderRound(){
  locked=false;
  const c=current,r=c.rounds[c.idx];
  gameFrame(c,r,`<div class="options" id="opts"></div>`);
  const shown=shuffle(r.options);
  const opts=document.getElementById('opts');
  shown.forEach(o=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML=(o.svg?svgOpt(o.svg):'')+`<span class="opt-label">${o.label}</span>`;
    b.onclick=()=>answer(b,o);
    opts.appendChild(b);
  });
  window._roundKeys=[].concat(r.audio||[],['choose'],shown.map(o=>o.aud).filter(Boolean));
  setTimeout(()=>speakRound(),400);
}
function speakRound(){playKeys(window._roundKeys||[]);}

function showNextButton(){
  document.querySelectorAll('.opt').forEach(b=>b.onclick=null);
  const nb=document.createElement('button');nb.className='next-btn';
  const last=current.idx>=current.rounds.length-1;
  nb.textContent=last?'Terminar!':'Próxima';
  nb.onclick=()=>{sndClick();locked=false;if(last)winScreen();else{current.idx++;renderRound();}};
  document.querySelector('.game').appendChild(nb);
}
function correctFlow(ea){
  locked=true;sndRight();burst();addStar(1);
  const fb=document.getElementById('fb');if(fb){fb.className='feedback good';fb.textContent='Muito bem! Great!';}
  playKeys(ea.filter(Boolean));showNextButton();
}
function answer(btn,opt){
  if(locked)return;
  if(opt.correct){
    btn.classList.add('ok');
    document.querySelectorAll('.opt').forEach(b=>{if(b!==btn)b.classList.add('no');});
    correctFlow([opt.aud,pick(OK_KEYS),opt.expAud]);
  }else{
    btn.classList.add('no');btn.onclick=null;sndWrong();
    const fb=document.getElementById('fb');fb.className='feedback bad';fb.textContent='Tenta de novo!';
    playKeys([opt.aud,pick(NO_KEYS)].filter(Boolean));
  }
}

/* ============================================================
   BUILDERS — Atividades com raciocínio
   ============================================================ */
const BUILDERS={};

/* 1. ART SUPPLIES — Identifique o material pela ilustração */
BUILDERS.supplies=()=>{
  const items=shuffle(SUPPLIES).slice(0,6);
  return items.map(it=>{
    const wrongs=pickN(SUPPLIES.filter(x=>x.k!==it.k),3);
    return {
      q:'Olhe a ilustração. Qual é o nome deste material de arte em inglês?',
      audio:['q_supply_name'],
      stage:svgStage(it.svg,180)+`<div class="label-txt">${it.cap}</div>`,
      options:[
        {label:`<b>${it.en}</b>`,aud:it.aud,correct:true},
        ...wrongs.map(w=>({label:`<b>${w.en}</b>`,aud:w.aud}))
      ]
    };
  });
};

/* 2. ART STUDIO — Que material usar? (requer raciocínio) */
BUILDERS.studio=()=>{
  const tasks=[
    {q:'O artista quer fazer um desenho no papel. Qual material ele precisa?',audio:['use_draw'],correct:'pencil',wrongs:['scissors','glue','paint']},
    {q:'O artista quer pintar um quadro com cores numa tela. O que ele precisa?',audio:['use_paint'],correct:'brush',wrongs:['scissors','pencil','paper']},
    {q:'O artista precisa recortar figuras de papel. O que ele usa?',audio:['use_cut'],correct:'scissors',wrongs:['brush','crayon','palette']},
    {q:'O artista quer colar pedaços de papel numa colagem. O que ele precisa?',audio:['use_glue'],correct:'glue',wrongs:['pencil','scissors','canvas']},
    {q:'O artista vai misturar várias cores de tinta. Onde ele faz isso?',audio:['use_mix'],correct:'palette',wrongs:['paper','glue','scissors']},
    {q:'O artista quer colorir o desenho com cores vivas. Qual material usar?',audio:['q_supply_use'],correct:'crayon',wrongs:['scissors','glue','canvas']},
  ];
  return shuffle(tasks).slice(0,6).map(t=>{
    const c=SUPPLIES.find(s=>s.k===t.correct);
    const ws=t.wrongs.map(w=>SUPPLIES.find(s=>s.k===w));
    return {
      q:t.q,audio:t.audio,
      stage:`<div class="desc-txt" style="font-size:18px;color:var(--deep);">Pense: qual material de arte resolve isso?</div>`,
      options:[
        {label:`<b>${c.en}</b><br><span class="opt-label">${c.cap}</span>`,svg:c.svg,aud:c.aud,correct:true},
        ...ws.map(w=>({label:`<b>${w.en}</b><br><span class="opt-label">${w.cap}</span>`,svg:w.svg,aud:w.aud}))
      ]
    };
  });
};

/* 6. ART DETECTIVE — Leia as pistas e descubra (raciocínio!) */
BUILDERS.detective=()=>{
  const clues=[
    {q:'Pista: Esta pintura mostra um céu escuro cheio de estrelas que parecem girar. Tem um cipreste alto no canto e um vilarejo pequeno embaixo. Qual é a obra?',
     correct:'starry_night',wrongs:['wheat_field','sunflowers','bedroom']},
    {q:'Pista: Nesta pintura, vemos um campo amarelo dourado de trigo. À direita tem uma árvore escura e alta chamada cipreste. O céu é azul com nuvens. Qual é a obra?',
     correct:'wheat_field',wrongs:['starry_night','sunflowers','self_portrait']},
    {q:'Pista: Um vaso com flores amarelas grandes, cada uma com um centro escuro. Algumas flores estão murchas. É uma pintura simples mas muito famosa. Qual é?',
     correct:'sunflowers',wrongs:['starry_night','bedroom','wheat_field']},

     correct:'bedroom',wrongs:['self_portrait','sunflowers','starry_night']},
    {q:'Pista: O artista pintou o próprio rosto! Ele tem barba ruiva e olhos claros. Pintou mais de 30 quadros assim. Qual é?',
     correct:'self_portrait',wrongs:['bedroom','sunflowers','wheat_field']},
  ];
  return shuffle(clues).slice(0,5).map(c=>{
    const right=PAINTINGS.find(p=>p.k===c.correct);
    const ws=c.wrongs.map(w=>PAINTINGS.find(p=>p.k===w));
    return {
      q:'Leia as pistas com atenção e descubra qual pintura é esta!',
      audio:['q_painting_describe'],
      stage:`<div class="desc-txt" style="font-size:17px;line-height:1.5;">${c.q}</div>`,
      options:[

        ...ws.map(w=>({label:`<b>${w.en}</b><br><span class="opt-label">${w.cap}</span>`,aud:w.aud}))
      ]

  });
};
