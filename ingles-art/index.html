/* ============================================================
   PLAYER DE ÁUDIO (clipes em sequência)
   ============================================================ */
const AUDIO_DIR='audio/', AUDIO_EXT='.mp3';
const player=new Audio();
player.preload='auto';
let playToken=0, audioOn=true;
function stopAudio(){ playToken++; try{player.pause();}catch(e){} setPlayingBadge(false); }
function playKeys(keys){
  if(!audioOn) return;
  stopAudio();
  const list=[].concat(...keys.map(k=>Array.isArray(k)?k:[k])).filter(Boolean);
  if(!list.length) return;
  const my=playToken; let i=0;
  setPlayingBadge(true);
  const next=()=>{
    if(my!==playToken) return;
    if(i>=list.length){ setPlayingBadge(false); return; }
    const key=list[i++];
    player.src=AUDIO_DIR+key+AUDIO_EXT;
    player.onended=next;
    player.onerror=()=>{ setTimeout(next,10); };
    const p=player.play();
    if(p&&p.catch) p.catch(()=>setTimeout(next,10));
  };
  next();
}
function setPlayingBadge(on){
  const b=document.getElementById('qspeak'); if(b) b.classList.toggle('playing',on);
}
function unlockAudio(depois){
  const pronto=()=>{ player.muted=false; if(depois){ const f=depois; depois=null; f(); } };
  try{ player.muted=true; player.src=AUDIO_DIR+'greet'+AUDIO_EXT;
       const p=player.play();
       if(p&&p.then) p.then(()=>{player.pause();player.currentTime=0;pronto();}).catch(pronto);
       else { player.pause(); pronto(); }
       setTimeout(pronto,1200);
  }catch(e){ pronto(); }
}

/* ===== SONS DE EFEITO (Web Audio) ===== */
let actx=null;
function initAudio(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }
function tone(freq,start,dur,type='sine',vol=0.2){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
  const t=actx.currentTime+start;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.start(t); o.stop(t+dur);
}
function sndClick(){ initAudio(); tone(540,0,0.07,'triangle',0.14); }
function sndRight(){ initAudio(); [523,659,784,1047].forEach((f,i)=>tone(f,i*0.09,0.25,'triangle',0.18)); }
function sndWrong(){ initAudio(); tone(300,0,0.18,'sine',0.13); tone(220,0.12,0.25,'sine',0.13); }
function sndWin(){ initAudio(); [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*0.12,0.3,'triangle',0.2)); }

/* ===== UTILIDADES ===== */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rint(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
const OK_KEYS=['ok1','ok2','ok3','ok4','ok5','ok6'], NO_KEYS=['no1','no2','no3'];

function updateStars(){ const el=document.getElementById('starNum'); if(el) el.textContent=stars; localStorage.setItem('vitor_art_stars',stars); }
function addStar(n=1){ stars+=n; updateStars(); }

/* ---------------- CONFETE ---------------- */
const cv=document.getElementById('confetti'), cx=cv.getContext('2d');
let confs=[];
function resizeCv(){cv.width=innerWidth;cv.height=innerHeight;}
addEventListener('resize',resizeCv); resizeCv();
function burst(){
  const cols=['#ff6b9d','#ffd93d','#6bcB77','#4d96ff','#a06cd5','#ff924c'];
  for(let i=0;i<70;i++){confs.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-0.5)*14,vy:Math.random()*-12-3,c:pick(cols),s:rint(7,14),r:Math.random()*6,vr:(Math.random()-.5)*.4});}
}
function loopConf(){
  cx.clearRect(0,0,cv.width,cv.height);
  confs.forEach(p=>{p.vy+=0.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s);cx.restore();});
  confs=confs.filter(p=>p.y<cv.height+30);
  requestAnimationFrame(loopConf);
}
loopConf();

/* ===== SHELL ===== */

}

/* ===== MOTOR DE RODADAS ===== */
let current=null, locked=false;
function startGame(id){
  const rounds=BUILDERS[id]();
  current={id, title:GAMES.find(g=>g.id===id).nome, rounds, idx:0};
  renderRound();
}
function gameFrame(c,r,bodyHtml){
  shell(`
    <div class="game">
      <h2 class="game-title">${GAMES.find(g=>g.id===c.id).ico} ${c.title}</h2>
      <div class="progress">Rodada ${c.idx+1} de ${c.rounds.length}</div>
      <div class="question">
        <button class="speak-btn" id="qspeak" onclick="sndClick();speakRound()">🔊</button>
        <span>${r.q}</span>
      </div>
      <div class="stage">${r.stage||''}</div>
      ${bodyHtml}
      <div style="font-size:14px;color:#aaa;margin-top:6px;">👆 Toque nas figuras para ouvir em inglês. Toque no 🔊 para ouvir de novo.</div>
      <div class="feedback" id="fb"></div>
    </div>
  `);
}
function renderRound(){
  locked=false;
  const c=current, r=c.rounds[c.idx];
  if(window.MODOS && MODOS[r.mode]) return MODOS[r.mode](c,r);
  gameFrame(c,r,`<div class="options" id="opts"></div>`);
  const shown=shuffle(r.options);
  const opts=document.getElementById('opts');
  shown.forEach(o=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML=o.label;
    b.onclick=()=>answer(b,o);
    opts.appendChild(b);
  });
  window._roundKeys=[].concat(r.audio||[], ['choose'], shown.map(o=>o.aud));
  setTimeout(()=>speakRound(),400);
}
function speakRound(){ playKeys(window._roundKeys||[]); }

function showNextButton(){
  document.querySelectorAll('.opt').forEach(b=>b.onclick=null);
  const nb=document.createElement('button');
  nb.className='next-btn';
  const last=current.idx>=current.rounds.length-1;
  nb.textContent=last?'🏆 Terminar':'Próxima ➡';
  nb.onclick=()=>{
    nb.onclick=null;
    sndClick();
    if(last){ winScreen(); return; }
    current.idx++; renderRound();
    locked=true; setTimeout(()=>{locked=false;},350);
  };
  document.querySelector('.game').appendChild(nb);
}
function correctFlow(extraAudio){
  locked=true; sndRight(); burst(); addStar(1);
  const fb=document.getElementById('fb'); if(fb){fb.className='feedback good'; fb.textContent='⭐ Great job!';}
  playKeys(extraAudio.filter(Boolean));
  showNextButton();
}
function answer(btn,opt){
  if(locked) return;
  if(opt.correct){
    btn.classList.add('ok');
    document.querySelectorAll('.opt').forEach(b=>{if(b!==btn)b.classList.add('no');});
    correctFlow([opt.aud, pick(OK_KEYS), opt.expAud]);
  }else{
    btn.classList.add('no'); btn.onclick=null;
    sndWrong();
    const fb=document.getElementById('fb'); fb.className='feedback bad'; fb.textContent='🤔 Try again!';
    playKeys([opt.aud, pick(NO_KEYS)].filter(Boolean));
  }
}

function winScreen(){
  sndWin(); burst(); setTimeout(burst,400); setTimeout(burst,800);
  const c=current;
  shell(`
    <div class="game win">
      <div class="trophy">🏆</div>
      <h2 class="game-title">Congratulations!</h2>
      <p style="font-size:22px;">Você ganhou <b>${c.rounds.length}</b> estrelas! ⭐</p>
      <p style="font-size:18px;color:#888;">Você está ficando craque em <b>${c.title}</b>!</p>
      <button class="next-btn" onclick="sndClick();startGame('${c.id}')">🔁 Jogar de novo</button>
      <br>
      <button class="next-btn" style="background:var(--azul);box-shadow:0 6px 0 #2f6fd0;margin-top:10px;" onclick="sndClick();goHome()">🏠 Escolher outro</button>
    </div>
  `);
  setTimeout(()=>playKeys(['win']),250);
}

/* ============================================================
   CONTEÚDO
   ============================================================ */
const SUPPLIES=['brush','paint','canvas','palette','pencil','crayon','scissors','paper','glue'];
const NATURE=['star','moon','sun','tree','flower','cloud','mountain','cypress','wheat'];

/* Qual material para cada tarefa (os distratores são os da versão anterior,
   escolhidos para não haver duas respostas possíveis). */
const TASKS=[
  {k:'draw', frase:'draw a picture',      tool:'pencil',   wrongs:['scissors','glue','paint']},
  {k:'paint', frase:'paint a picture',     tool:'brush',    wrongs:['scissors','pencil','paper']},
  {k:'cut', frase:'cut out shapes',      tool:'scissors', wrongs:['brush','crayon','palette']},
  {k:'glue', frase:'stick paper together',tool:'glue',     wrongs:['pencil','scissors','canvas']},
  {k:'mix', frase:'mix colors',          tool:'palette',  wrongs:['paper','glue','scissors']},
  {k:'color', frase:'color a drawing',     tool:'crayon',   wrongs:['scissors','glue','canvas']},
];

/* Os cinco quadros: nome em inglês, explicação e a pista do detetive. */
const QUADROS={
  'starry-night': {aud:'en_starry_night', exp:'qe_starry',     pista:'st_village', pAud:'dd_village', pExp:'de_starry'},
  'wheat-field':  {aud:'en_wheat_field',  exp:'qe_wheat',      pista:'st_wheat',   pAud:'dd_wheat',   pExp:'de_wheat'},
  'sunflowers':   {aud:'en_sunflowers',   exp:'qe_sunflowers', pista:'st_vase',    pAud:'dd_vase',    pExp:'de_sunflowers'},
  'bedroom':      {aud:'en_bedroom',      exp:'qe_bedroom',    pista:'st_bed',     pAud:'dd_bed',     pExp:'de_bedroom'},
  'self-portrait':{aud:'en_self_portrait',exp:'qe_self',       pista:'st_beard',   pAud:'dd_beard',   pExp:'de_self'},
};

const sticker = k => ({img:'st_'+k, aud:'en_'+k});
const ensina = k => ['en_'+k, 'pm_'+k];   // "Brush" + "quer dizer pincel."

/* Cena da Noite Estrelada: céu em cima, chão embaixo (x, y, w em % do cenário 3:2).
   w=22 dá ~74 px no celular. */
const CEU=[{x:3,y:5},{x:39,y:3},{x:75,y:6}];
const CHAO=[{x:2,y:60},{x:26,y:64},{x:51,y:59},{x:76,y:63}];
function montarCena(ceu, chao){
  const pos=(lista,vagas)=>shuffle(vagas).slice(0,lista.length).map((v,i)=>({...lista[i], x:v.x, y:v.y, w:22}));
  return [...pos(shuffle(ceu),CEU), ...pos(shuffle(chao),CHAO)];
}
const obj = (k, certo) => ({img:'st_'+k, aud:'en_'+k, certo:!!certo});

/* ============================================================
   CONSTRUTORES DE RODADAS — 3 rodadas por jogo, ficando mais difíceis.
   ============================================================ */
const BUILDERS={
  /* 1. Ouvir e agir (TPR): a coruja pede em inglês, a criança entrega. 1, 2 e 3 pedidos. */
  supplies(){
    const ordem=shuffle(SUPPLIES); let p=0;
    return [1,2,3].map(n=>{
      const pedidos=ordem.slice(p,p+n); p+=n;
      const outros=shuffle(SUPPLIES.filter(k=>!pedidos.includes(k))).slice(0,3);
      return {mode:'mascote',
        q:'Give me '+pedidos.map(k=>`the <b>${k}</b>`).join(' and ')+'!',
        audio:['ms_q', ...pedidos.map(k=>'give_'+k)],
        expAud:pedidos.flatMap(ensina),
        mascote:'st_owl',
        itens:[...pedidos.map(k=>({...sticker(k), certo:true})), ...outros.map(k=>({...sticker(k), certo:false}))]};
    });
  },

  /* 2. Qual material para a tarefa? Estoura o balão do material certo. */
  studio(){
    return shuffle(TASKS).slice(0,3).map((t,i)=>({mode:'baloes',
      q:`I want to <b>${t.frase}</b>! Pop the right one.`,
      audio:['tk_'+t.k, 'bt_'+t.k],
      expAud:['tk_'+t.k, 'en_'+t.tool, 'be_'+t.k],
      meta:[3,4,5][i],
      itens:[{...sticker(t.tool), certo:true}, ...t.wrongs.slice(0, i===0?2:3).map(w=>({...sticker(w), certo:false}))]}));
  },

  /* 3. Memória: cada carta virada fala a palavra em inglês. 3, 4 e 5 pares. */
  nature(){
    return [3,4,5].map(n=>{
      const ks=shuffle(NATURE).slice(0,n);
      return {mode:'memoria', q:'Find the pairs! Listen to the English words.', audio:['mm_q'],
        expAud:ks.flatMap(ensina), pares:ks.map(sticker)};
    });
  },

  /* 4. Dia ou noite: arrastar para o grupo. Depois os quadros; por fim daytime/nighttime. */
  daynight(){
    const DIA={id:'day', img:'scene-day', aud:'en_day'}, NOITE={id:'night', img:'scene-night', aud:'en_night'};
    const it=(img,aud,grupo)=>({img,aud,grupo});
    return [
      {mode:'classificar', q:'<b>Day</b> or <b>night</b>?', audio:['dn_q1'],
       expAud:['en_day','dn_dia','en_night','dn_noite'], grupos:[DIA,NOITE],
       itens:[it('st_sun','en_sun','day'), it('st_cloud','en_cloud','day'), it('st_moon','en_moon','night'), it('st_star','en_star','night')]},
      {mode:'classificar', q:'Is the painting <b>day</b> or <b>night</b>?', audio:['dn_q2'],
       expAud:['en_starry_night','dn_starry','en_wheat_field','dn_wheat'], grupos:[DIA,NOITE],
       itens:[it('starry-night','en_starry_night','night'), it('wheat-field','en_wheat_field','day'), it('st_cloud','en_cloud','day'), it('st_star','en_star','night')]},
      {mode:'classificar', q:'<b>Daytime</b> or <b>nighttime</b>?', audio:['dn_q3'],
       expAud:['en_daytime','dn_daytime','en_nighttime','dn_nighttime'],
       grupos:[{...DIA, aud:'en_daytime'}, {...NOITE, aud:'en_nighttime'}],
       itens:[it('st_sun','en_sun','day'), it('st_cloud','en_cloud','day'), it('wheat-field','en_wheat_field','day'),
              it('st_moon','en_moon','night'), it('st_star','en_star','night'), it('starry-night','en_starry_night','night')]},
    ];
  },

  /* 5. Quebra-cabeça dos quadros famosos: 2x2, depois 3x3, por fim a Noite Estrelada. */
  paintings(){
    const r=(img,grade,extra)=>({mode:'quebra', q:'Make the famous painting!', audio:['qb_q','en_called',QUADROS[img].aud],
      expAud:[QUADROS[img].aud, QUADROS[img].exp, ...(extra||[])], img, grade});
    return [
      r(pick(['sunflowers','self-portrait']), 2, ['en_painting','pm_painting']),
      r(pick(['bedroom','wheat-field']), 3),
      r('starry-night', 3),
    ];
  },

  /* 6. Detetive: ligar cada quadro ao detalhe que aparece nele. 3, 4 e 5 pares. */
  detective(){
    return [3,4,5].map(n=>{
      const qs=shuffle(Object.keys(QUADROS)).slice(0,n);
      return {mode:'ligar', q:'Match each painting to its clue!', audio:['dt_q'],
        expAud:qs.flatMap(k=>[QUADROS[k].aud, QUADROS[k].pExp]),
        pares:qs.map(k=>({a:{img:k, aud:QUADROS[k].aud}, b:{img:QUADROS[k].pista, aud:QUADROS[k].pAud}}))};
    });
  },

  /* 7. Procurar na Noite Estrelada o que a voz pede em inglês. */
  starry(){
    return [
      {mode:'cena', q:'Find the <b>moon</b>!', audio:['sn_q','fd_moon'], expAud:['en_moon','pm_moon','sx_moon'], fundo:'cn_starry',
       objetos:montarCena([obj('moon',1), obj('sun'), obj('cloud')], [obj('flower')])},
      {mode:'cena', q:'Find the <b>stars</b>!', audio:['sn_q','fd_stars'], expAud:['en_stars','sx_stars'], fundo:'cn_starry',
       objetos:montarCena([obj('star',1), obj('star',1), obj('sun')], [obj('cypress'), obj('flower')])},
      {mode:'cena', q:'Find the <b>cypress tree</b> and the <b>village</b>!', audio:['sn_q','fd_cv'],
       expAud:['en_cypress','pm_cypress','en_village','sx_village'], fundo:'cn_starry',
       objetos:montarCena([obj('moon'), obj('star'), obj('sun')], [obj('cypress',1), obj('village',1), obj('flower')])},
    ];
  },

  /* 8. A vida de Van Gogh: ouvir a história e pôr os quadros na ordem. */
  vangogh(){
    const nasceu={img:'st_holanda', aud:'vi_born'}, arles={img:'st_arles', aud:'vi_arles'};
    const q=k=>({img:k, aud:QUADROS[k].aud});
    return [
      {mode:'ordenar', q:'Van Gogh\'s life: put it in order!', audio:['vg_q1'],
       expAud:['en_netherlands','vx_holanda','en_france','vx_franca'],
       itens:[nasceu, arles, q('sunflowers')]},
      {mode:'ordenar', q:'Van Gogh\'s life: put it in order!', audio:['vg_q2'],
       expAud:['en_vangogh','en_artist','vx_artist'],
       itens:[nasceu, arles, q('sunflowers'), q('starry-night')]},
      {mode:'ordenar', q:'Van Gogh\'s life: put it in order!', audio:['vg_q3'],
       expAud:['en_bedroom','qe_bedroom','en_wheat_field','qe_wheat'],
       itens:[nasceu, arles, q('bedroom'), q('wheat-field')]},
    ];
  },
};

document.getElementById('startBtn').addEventListener('click',()=>{
  initAudio();
  unlockAudio(()=>goHome());
  document.getElementById('splash').style.display='none';
