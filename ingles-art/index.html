<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎨 Art Fun! — Arte em Inglês 🎨</title>
<style>
  :root{
    --rosa:#ff6b9d; --roxo:#a06cd5; --azul:#4d96ff; --verde:#6bcB77;
    --amarelo:#ffd93d; --laranja:#ff924c; --vermelho:#ff5e5e; --ceu:#b8e3ff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    font-family:'Comic Sans MS','Baloo',"Trebuchet MS",sans-serif;
    background:linear-gradient(160deg,#e8d5f5 0%,#fce4ec 50%,#fff3e0 100%);
    color:#3a3a55; overflow-x:hidden; user-select:none;
    min-height:100%; touch-action:manipulation;
  }
  #app{max-width:760px; margin:0 auto; padding:14px; min-height:100vh;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; border-radius:22px; padding:8px 14px; margin-bottom:14px;
    box-shadow:0 6px 0 rgba(0,0,0,.08);
  }
  .topbar .home-btn{
    background:var(--azul); color:#fff; border:none; border-radius:16px;
    font-size:22px; padding:8px 14px; font-weight:bold; cursor:pointer; box-shadow:0 4px 0 #2f6fd0;
  }
  .topbar .home-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #2f6fd0;}
  .topbar .nav{display:flex; align-items:center; gap:8px;}
  .topbar .back-btn{
    background:var(--roxo); color:#fff; border:none; border-radius:16px;
    font-size:22px; padding:8px 14px; font-weight:bold; cursor:pointer;
    box-shadow:0 4px 0 #7d49b0; text-decoration:none; display:inline-block; line-height:1;
  }
  .topbar .back-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #7d49b0;}
  .stars{font-size:24px; font-weight:bold; color:var(--laranja); display:flex; align-items:center; gap:6px;}
  .stars .num{background:var(--amarelo); border-radius:14px; padding:2px 12px; box-shadow:0 3px 0 #d9a800;}

  .hero{
    text-align:center; background:#fff; border-radius:30px; padding:22px 18px;
    box-shadow:0 8px 0 rgba(0,0,0,.08); margin-bottom:18px;
  }
  .hero h1{font-size:32px; margin:6px 0; color:var(--roxo); line-height:1.2;}
  .hero p{font-size:18px; margin:4px 0; color:#666;}
  .mascote{font-size:78px; display:inline-block; animation:flutua 2.5s ease-in-out infinite;}
  @keyframes flutua{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-14px) rotate(3deg);}}

  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
  .card{
    border:none; border-radius:26px; padding:16px 10px; cursor:pointer;
    color:#fff; font-size:19px; font-weight:bold; text-align:center;
    box-shadow:0 7px 0 rgba(0,0,0,.18); transition:transform .08s;
    display:flex; flex-direction:column; align-items:center; gap:6px; line-height:1.15;
  }
  .card:active{transform:translateY(4px); box-shadow:0 3px 0 rgba(0,0,0,.18);}
  .card .ico{font-size:46px;}
  .c1{background:var(--rosa);} .c2{background:var(--azul);} .c3{background:var(--verde);}
  .c4{background:var(--laranja);} .c5{background:var(--roxo);} .c6{background:var(--vermelho);}
  .c7{background:#19c3b1;} .c8{background:#f76eb0;} .c9{background:#7c83ff;}

  .game{
    background:#fff; border-radius:30px; padding:18px; box-shadow:0 8px 0 rgba(0,0,0,.08);
    text-align:center;
  }
  .game-title{font-size:24px; color:var(--roxo); margin:0 0 4px;}
  .progress{font-size:16px; color:#999; margin-bottom:10px;}
  .question{
    font-size:23px; font-weight:bold; color:#3a3a55; margin:6px 0 14px; line-height:1.3;
    display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
  }
  .speak-btn{
    background:var(--amarelo); border:none; border-radius:50%; width:54px; height:54px;
    font-size:28px; cursor:pointer; box-shadow:0 4px 0 #d9a800; flex:0 0 auto;
  }
  .speak-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #d9a800;}
  .speak-btn.playing{animation:pulse .7s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}

  .stage{
    min-height:120px; display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:10px; margin:10px auto 18px; padding:16px;
    background:linear-gradient(160deg,#f3eaff,#fff0f6); border-radius:22px; border:4px dashed #d9c0ff;
    flex-direction:column;
  }
  .obj{font-size:80px; animation:pop .35s ease; line-height:1;}
  @keyframes pop{0%{transform:scale(0);}70%{transform:scale(1.25);}100%{transform:scale(1);}}
  .stage .cardtxt{font-size:22px; font-weight:bold; color:#7c49b0; margin-top:4px; line-height:1.3;}
  .stage .quote{font-size:30px; font-weight:bold; color:#a06cd5; letter-spacing:.5px; max-width:460px; line-height:1.2;}
  .stage .row{display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; flex-direction:row;}

  .options{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));}
  .opt{
    border:none; border-radius:22px; padding:16px 10px; font-size:23px; font-weight:bold;
    cursor:pointer; background:var(--roxo); color:#fff; box-shadow:0 6px 0 #7c49b0;
    min-height:84px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    word-break:break-word; line-height:1.12;
  }
  .opt b{font-size:24px;}
  .opt .cap{font-size:16px; font-weight:normal; opacity:.95;}
  .opt-colors .opt{font-size:22px;}
  .opt:active{transform:translateY(3px); box-shadow:0 3px 0 #7c49b0;}
  .opt.big{font-size:44px;}
  .opt.ok{background:var(--verde)!important; box-shadow:0 6px 0 #3f9c4f!important; animation:tada .5s;}
  .opt.no{background:#cfcfe0!important; box-shadow:0 6px 0 #a0a0c0!important; opacity:.7;}
  @keyframes tada{0%{transform:scale(1);}30%{transform:scale(1.18) rotate(-4deg);}60%{transform:scale(1.1) rotate(4deg);}100%{transform:scale(1);}}

  .opt-colors .opt:nth-child(1){background:var(--rosa); box-shadow:0 6px 0 #d44d7c;}
  .opt-colors .opt:nth-child(2){background:var(--verde); box-shadow:0 6px 0 #3f9c4f;}
  .opt-colors .opt:nth-child(3){background:var(--laranja); box-shadow:0 6px 0 #d96d2e;}
  .opt-colors .opt:nth-child(4){background:var(--roxo); box-shadow:0 6px 0 #7a4db0;}

  .feedback{font-size:26px; font-weight:bold; min-height:40px; margin-top:12px;}
  .feedback.good{color:var(--verde);} .feedback.bad{color:var(--laranja);}

  .next-btn{
    margin-top:14px; background:var(--verde); color:#fff; border:none; border-radius:22px;
    font-size:24px; font-weight:bold; padding:14px 34px; cursor:pointer; box-shadow:0 6px 0 #3f9c4f;
  }
  .next-btn:active{transform:translateY(3px); box-shadow:0 3px 0 #3f9c4f;}

  #splash{
    position:fixed; inset:0; background:linear-gradient(160deg,#7c49b0,#2a1052);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; z-index:50; cursor:pointer; padding:20px;
  }
  #splash h1{font-size:34px; margin:10px;}
  #splash .big{font-size:100px; animation:flutua 2.5s infinite;}
  #splash .play{
    margin-top:24px; background:var(--amarelo); color:#5a4500; border:none; border-radius:30px;
    font-size:30px; font-weight:bold; padding:18px 44px; box-shadow:0 8px 0 #d9a800; cursor:pointer;
  }

  #confetti{position:fixed; inset:0; pointer-events:none; z-index:40;}
  .win{text-align:center; padding:20px;}
  .win .trophy{font-size:90px; animation:tada 1s;}

  @media(max-width:480px){
    .hero h1{font-size:26px;} .question{font-size:20px;} .card{font-size:17px;}
    .obj{font-size:66px;} .stage .quote{font-size:24px;}
  }
</style>
</head>
<body>

<div id="splash">
  <div class="big">🎨</div>
  <h1>Art Fun!<br><span style="font-size:22px;font-weight:normal">Arte em Inglês</span></h1>
  <p style="font-size:20px;max-width:340px;">Vamos aprender sobre arte em inglês! 🖼️🌟<br>Van Gogh, cores, noite estrelada...</p>
  <button class="play" id="startBtn">▶ START / COMEÇAR</button>
</div>

<canvas id="confetti"></canvas>
<div id="app"></div>

<script>
/* ============================================================
   ART FUN! — Inglês + Arte, 1º ano (Bernoulli)
   Módulo 9 do projeto. Mesmo motor dos outros módulos.
   Conteúdo: Van Gogh, The Starry Night, Wheat Field with
   Cypresses, vocabulário de arte (brush, paint, canvas…),
   elementos da natureza em paisagens, cores na arte, dia/noite.
   ============================================================ */

const App = document.getElementById('app');
let stars = parseInt(localStorage.getItem('vitor_art_stars')||'0',10);

/* ============================================================
   VOZ EM PORTUGUÊS (chave -> texto falado com voz pt-BR).
   ============================================================ */
const VOICE = {
  /* navegação e feedback */
  greet:"Olá! Bem-vindo ao Art Fun! Vamos aprender sobre arte em inglês!",
  test:"Olá! Você está me ouvindo? Vamos descobrir o mundo da arte!",
  win:"Parabéns! Você é um verdadeiro artista! Que orgulho!",
  choose:"As respostas são:",
  ok1:"Muito bem!", ok2:"Isso aí!", ok3:"Você acertou!",
  ok4:"Boa demais!", ok5:"Mandou bem!", ok6:"Perfeito!",
  no1:"Quase! Tenta outra.", no2:"Hmm, tenta de novo.", no3:"Não foi essa, tenta outra.",

  /* perguntas dos jogos */
  q_art_en:"Como se diz isto em inglês?",
  q_art_what:"O que é isto em inglês?",
  q_painting_name:"Qual é o nome deste quadro famoso?",
  q_painting_artist:"Quem pintou este quadro?",
  q_daynight:"Isto é do dia ou da noite?",
  q_color_art:"Qual cor aparece bastante nesta obra?",
  q_nature_en:"Como se chama este elemento da natureza em inglês?",
  q_supply_en:"Qual material de arte é este?",
  q_action_art:"O que o artista está fazendo?",
  q_vangogh:"O que é verdade sobre Van Gogh?",
  q_starry:"O que a gente vê no quadro Noite Estrelada?",
  q_element:"O que tem nesta paisagem?",
};

/* ============================================================
   VOZ EM INGLÊS (chave -> texto falado com voz en-US).
   ============================================================ */
const VOICE_EN = {
  /* materiais de arte */
  en_brush:"Brush.", en_paint:"Paint.", en_canvas:"Canvas.", en_palette:"Palette.",
  en_pencil:"Pencil.", en_crayon:"Crayon.", en_paper:"Paper.", en_scissors:"Scissors.",
  en_glue:"Glue.", en_easel:"Easel.",

  /* ações de arte */
  en_draw:"Draw.", en_paint_v:"Paint.", en_cut:"Cut.", en_glue_v:"Glue.",
  en_color_v:"Color.", en_create:"Create.", en_mix:"Mix.",

  /* elementos da natureza */
  en_star:"Star.", en_stars:"Stars.", en_moon:"Moon.", en_sky:"Sky.", en_sun:"Sun.",
  en_cloud:"Cloud.", en_tree:"Tree.", en_flower:"Flower.", en_field:"Field.",
  en_mountain:"Mountain.", en_river:"River.", en_hill:"Hill.", en_village:"Village.",
  en_cypress:"Cypress.", en_wheat:"Wheat.",

  /* cores */
  en_blue:"Blue.", en_yellow:"Yellow.", en_green:"Green.", en_orange:"Orange.",
  en_red:"Red.", en_white:"White.", en_black:"Black.", en_purple:"Purple.",
  en_brown:"Brown.",

  /* dia e noite */
  en_day:"Day.", en_night:"Night.", en_daytime:"Daytime.", en_nighttime:"Nighttime.",

  /* arte e artista */
  en_painting:"Painting.", en_artist:"Artist.", en_art:"Art.", en_landscape:"Landscape.",
  en_portrait:"Portrait.", en_museum:"Museum.",

  /* Van Gogh / obras */
  en_vangogh:"Vincent Van Gogh.",
  en_starry_night:"The Starry Night.",
  en_sunflowers:"Sunflowers.",
  en_wheat_field:"Wheat Field with Cypresses.",
  en_bedroom:"The Bedroom.",
  en_self_portrait:"Self Portrait.",

  /* países */
  en_netherlands:"The Netherlands.", en_france:"France.", en_brazil:"Brazil.",
};

/* ============================================================
   PLAYER DE ÁUDIO
   ============================================================ */
const AUDIO_DIR='audio/', AUDIO_EXT='.mp3';
const player=new Audio();
player.preload='auto';
let playToken=0, audioOn=true;
function stopAudio(){ playToken++; try{player.pause();}catch(e){} setPlayingBadge(false); }
function playKeys(keys){
  if(!audioOn) return;
  stopAudio();
  const list=[].concat(...keys.map(k=>Array.isArray(k)?k:[k])).filter(Boolean);
  if(!list.length) return;
  const my=playToken; let i=0;
  setPlayingBadge(true);
  const next=()=>{
    if(my!==playToken) return;
    if(i>=list.length){ setPlayingBadge(false); return; }
    const key=list[i++];
    player.src=AUDIO_DIR+key+AUDIO_EXT;
    player.onended=next;
    player.onerror=()=>{ setTimeout(next,10); };
    const p=player.play();
    if(p&&p.catch) p.catch(()=>setTimeout(next,10));
  };
  next();
}
function setPlayingBadge(on){
  const b=document.getElementById('qspeak'); if(b) b.classList.toggle('playing',on);
}
function unlockAudio(){
  try{ player.muted=true; player.src=AUDIO_DIR+'greet'+AUDIO_EXT;
       const p=player.play();
       if(p&&p.then) p.then(()=>{player.pause();player.currentTime=0;player.muted=false;})
                      .catch(()=>{player.muted=false;});
       else {player.pause();player.muted=false;}
  }catch(e){ player.muted=false; }
}

/* ===== SONS DE EFEITO ===== */
let actx=null;
function initAudio(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }
function tone(freq,start,dur,type='sine',vol=0.2){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
  const t=actx.currentTime+start;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.start(t); o.stop(t+dur);
}
function sndClick(){ initAudio(); tone(540,0,0.07,'triangle',0.14); }
function sndRight(){ initAudio(); [523,659,784,1047].forEach((f,i)=>tone(f,i*0.09,0.25,'triangle',0.18)); }
function sndWrong(){ initAudio(); tone(300,0,0.18,'sine',0.13); tone(220,0.12,0.25,'sine',0.13); }
function sndWin(){ initAudio(); [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*0.12,0.3,'triangle',0.2)); }

/* ===== UTILIDADES ===== */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rint(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function pickN(arr,n,exclude){ return shuffle(arr.filter(x=>!exclude||exclude.indexOf(x)<0)).slice(0,n); }
const OK_KEYS=['ok1','ok2','ok3','ok4','ok5','ok6'], NO_KEYS=['no1','no2','no3'];
function emo(e,size){ return '<span class="obj" style="font-size:'+(size||80)+'px">'+e+'</span>'; }

function updateStars(){ const el=document.getElementById('starNum'); if(el) el.textContent=stars; localStorage.setItem('vitor_art_stars',stars); }
function addStar(n=1){ stars+=n; updateStars(); }

/* ===== CONFETE ===== */
const cv=document.getElementById('confetti'), cx=cv.getContext('2d');
let confs=[];
function resizeCv(){cv.width=innerWidth;cv.height=innerHeight;}
addEventListener('resize',resizeCv); resizeCv();
function burst(){
  const cols=['#ff6b9d','#ffd93d','#6bcB77','#4d96ff','#a06cd5','#ff924c'];
  for(let i=0;i<70;i++){confs.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-0.5)*14,vy:Math.random()*-12-3,c:pick(cols),s:rint(7,14),r:Math.random()*6,vr:(Math.random()-.5)*.4});}
}
function loopConf(){
  cx.clearRect(0,0,cv.width,cv.height);
  confs.forEach(p=>{p.vy+=0.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s);cx.restore();});
  confs=confs.filter(p=>p.y<cv.height+30);
  requestAnimationFrame(loopConf);
}
loopConf();

/* ===== SHELL ===== */
function shell(inner){
  App.innerHTML=`
    <div class="topbar">
      <div class="nav"><a class="back-btn" href="../" title="Voltar ao menu de matérias" aria-label="Voltar ao menu de matérias">🏠</a><button class="home-btn" onclick="sndClick();goHome()" title="Escolher outro jogo desta matéria" aria-label="Escolher outro jogo desta matéria">🔄</button></div>
      <div class="stars">⭐ <span class="num" id="starNum">${stars}</span></div>
    </div>
    ${inner}`;
}

/* ===== MENU ===== */
const GAMES=[
  {id:'supplies',  ico:'🖌️', nome:'Art Supplies',    sub:'Materiais de arte',     cls:'c1'},
  {id:'actions',   ico:'✏️', nome:'Art Actions',     sub:'O que o artista faz',   cls:'c2'},
  {id:'nature',    ico:'🌳', nome:'Nature Words',    sub:'Natureza na paisagem',  cls:'c3'},
  {id:'daynight',  ico:'🌙', nome:'Day or Night',    sub:'Dia ou noite?',         cls:'c4'},
  {id:'colors',    ico:'🌈', nome:'Art Colors',      sub:'Cores nas obras',       cls:'c5'},
  {id:'paintings', ico:'🖼️', nome:'Famous Art',      sub:'Quadros famosos',       cls:'c6'},
  {id:'starry',    ico:'⭐', nome:'Starry Night',    sub:'A Noite Estrelada',     cls:'c7'},
  {id:'vangogh',   ico:'👨‍🎨', nome:'Van Gogh',       sub:'O artista holandês',    cls:'c8'},
];
function goHome(silent){
  stopAudio();
  shell(`
    <div class="hero">
      <div class="mascote">🎨</div>
      <h1>Art Fun!</h1>
      <p>Escolha uma brincadeira 👇</p>
      <button onclick="testSound()" style="margin-top:6px;background:var(--amarelo);color:#5a4500;border:none;border-radius:18px;padding:9px 18px;font-size:16px;font-weight:bold;cursor:pointer;box-shadow:0 4px 0 #d9a800;">🔈 Testar som</button>
    </div>
    <div class="grid">
      ${GAMES.map(g=>`<button class="card ${g.cls}" onclick="sndClick();startGame('${g.id}')">
        <span class="ico">${g.ico}</span><span>${g.nome}</span>
        <span style="font-size:13px;font-weight:normal;opacity:.9">${g.sub}</span>
      </button>`).join('')}
    </div>
    <p style="text-align:center;color:#7a8;margin-top:18px;font-size:14px;">Feito com 💜 para o Vitor</p>
  `);
  if(!silent) setTimeout(()=>playKeys(['greet']),250);
}
function testSound(){ initAudio(); sndClick(); playKeys(['test']); }

/* ===== MOTOR DE RODADAS ===== */
let current=null, locked=false;
function startGame(id){
  const rounds=BUILDERS[id]();
  current={id, title:GAMES.find(g=>g.id===id).nome, rounds, idx:0};
  renderRound();
}
function gameFrame(c,r,bodyHtml){
  shell(`
    <div class="game">
      <h2 class="game-title">${GAMES.find(g=>g.id===c.id).ico} ${c.title}</h2>
      <div class="progress">Pergunta ${c.idx+1} de ${c.rounds.length}</div>
      <div class="question">
        <button class="speak-btn" id="qspeak" onclick="sndClick();speakRound()">🔊</button>
        <span>${r.q}</span>
      </div>
      <div class="stage">${r.stage||''}</div>
      ${bodyHtml}
      <div style="font-size:14px;color:#aaa;margin-top:6px;">👆 Toque para responder. Toque no 🔊 para ouvir de novo.</div>
      <div class="feedback" id="fb"></div>
    </div>
  `);
}
function renderRound(){
  locked=false;
  const c=current, r=c.rounds[c.idx];
  gameFrame(c,r,`<div class="options ${r.colorOpts?'opt-colors':''}" id="opts"></div>`);
  const shown=shuffle(r.options);
  const opts=document.getElementById('opts');
  shown.forEach(o=>{
    const b=document.createElement('button');
    b.className='opt'+(o.big?' big':'');
    b.innerHTML=o.label;
    b.onclick=()=>answer(b,o);
    opts.appendChild(b);
  });
  window._roundKeys=[].concat(r.audio||[], ['choose'], shown.map(o=>o.aud));
  setTimeout(()=>speakRound(),400);
}
function speakRound(){ playKeys(window._roundKeys||[]); }

function showNextButton(){
  document.querySelectorAll('.opt').forEach(b=>b.onclick=null);
  const nb=document.createElement('button');
  nb.className='next-btn';
  const last=current.idx>=current.rounds.length-1;
  nb.textContent=last?'🏆 Terminar':'Próxima ➡';
  nb.onclick=()=>{sndClick();locked=false;if(last){winScreen();}else{current.idx++;renderRound();}};
  document.querySelector('.game').appendChild(nb);
}
function correctFlow(extraAudio){
  locked=true; sndRight(); burst(); addStar(1);
  const fb=document.getElementById('fb'); if(fb){fb.className='feedback good'; fb.textContent='⭐ Muito bem! Great!';}
  playKeys(extraAudio.filter(Boolean));
  showNextButton();
}
function answer(btn,opt){
  if(locked) return;
  if(opt.correct){
    btn.classList.add('ok');
    document.querySelectorAll('.opt').forEach(b=>{if(b!==btn)b.classList.add('no');});
    correctFlow([opt.aud, pick(OK_KEYS), opt.expAud]);
  }else{
    btn.classList.add('no'); btn.onclick=null;
    sndWrong();
    const fb=document.getElementById('fb'); fb.className='feedback bad'; fb.textContent='🤔 Tenta de novo!';
    playKeys([opt.aud, pick(NO_KEYS)].filter(Boolean));
  }
}

function winScreen(){
  sndWin(); burst(); setTimeout(burst,400); setTimeout(burst,800);
  const c=current;
  shell(`
    <div class="game win">
      <div class="trophy">🏆</div>
      <h2 class="game-title">Parabéns! Congratulations!</h2>
      <p style="font-size:22px;">Você ganhou <b>${c.rounds.length}</b> estrelas! ⭐</p>
      <p style="font-size:18px;color:#888;">Você está ficando craque em <b>${c.title}</b>!</p>
      <button class="next-btn" onclick="sndClick();startGame('${c.id}')">🔁 Jogar de novo</button>
      <br>
      <button class="next-btn" style="background:var(--roxo);box-shadow:0 6px 0 #7c49b0;margin-top:10px;" onclick="sndClick();goHome()">🏠 Escolher outro</button>
    </div>
  `);
  setTimeout(()=>playKeys(['win']),250);
}

function enOpt(key, correct){
  const w=WORDS[key];
  return {label:'<b>'+w.en+'</b>', aud:['en_'+key], correct:!!correct};
}
function stageEmo(key,size){ const w=WORDS[key]; return emo(w.e,size||90)+'<div class="cardtxt">'+w.en+'</div>'; }

/* ============================================================
   LISTAS DE CONTEÚDO
   ============================================================ */
const SUPPLY_KEYS=['brush','paint','canvas','palette','pencil','crayon','paper','scissors','glue','easel'];
const ACTION_KEYS=['draw','paint_v','cut','glue_v','color_v','create','mix'];
const NATURE_KEYS=['star','moon','sky','sun','cloud','tree','flower','field','mountain','river','hill','village','cypress','wheat'];
const COLOR_KEYS=['blue','yellow','green','orange','red','white','black','purple','brown'];
const PAINTING_KEYS=['starry_night','sunflowers','wheat_field','bedroom','self_portrait'];

/* cenas de dia/noite (emoji + classificação) */
const DAYNIGHT=[
  {e:'☀️🌳🦋', era:'day'}, {e:'🌙⭐🌌', era:'night'},
  {e:'🌅🏖️🐚', era:'day'}, {e:'🌃🏙️💡', era:'night'},
  {e:'☀️🌻🐝', era:'day'}, {e:'🦉🌙🌠', era:'night'},
  {e:'🌤️🌈🦜', era:'day'}, {e:'🌑⭐🦇', era:'night'},
  {e:'☀️🏫📚', era:'day'}, {e:'🌙🛏️💤', era:'night'},
];

/* elementos do Starry Night (quiz) */
const STARRY_HAS=['stars','moon','sky','village','cypress','hill'];
const STARRY_NOT=['sun','flower','river','mountain'];

/* cores predominantes em obras de Van Gogh */
const COLOR_PAINTINGS=[
  {painting:'starry_night', e:'🌌', color:'blue', distr:['red','green']},
  {painting:'sunflowers', e:'🌻', color:'yellow', distr:['purple','black']},
  {painting:'wheat_field', e:'🌾', color:'green', distr:['red','purple']},
  {painting:'bedroom', e:'🛏️', color:'blue', distr:['brown','green']},
];

/* ============================================================
   GERADORES (8 jogos)
   ============================================================ */
const BUILDERS={

  /* 1. ART SUPPLIES — nome do material em inglês */
  supplies(){
    return shuffle(SUPPLY_KEYS).slice(0,7).map(key=>{
      const distr=pickN(SUPPLY_KEYS,2,[key]);
      return { q:'Qual é este material de arte em <b>inglês</b>? 🖌️',
        audio:['q_supply_en'], stage:emo(WORDS[key].e,130), colorOpts:false,
        options:shuffle([enOpt(key,true),enOpt(distr[0]),enOpt(distr[1])]) };
    });
  },

  /* 2. ART ACTIONS — o que o artista faz */
  actions(){
    return shuffle(ACTION_KEYS).slice(0,6).map(key=>{
      const distr=pickN(ACTION_KEYS,2,[key]);
      return { q:'O que o artista está fazendo? Em <b>inglês</b>! ✏️',
        audio:['q_action_art'], stage:emo(WORDS[key].e,130), colorOpts:false,
        options:shuffle([enOpt(key,true),enOpt(distr[0]),enOpt(distr[1])]) };
    });
  },

  /* 3. NATURE WORDS — elementos na paisagem */
  nature(){
    return shuffle(NATURE_KEYS).slice(0,7).map(key=>{
      const distr=pickN(NATURE_KEYS,2,[key]);
      return { q:'Como se chama em <b>inglês</b>? 🌳',
        audio:['q_nature_en'], stage:emo(WORDS[key].e,130), colorOpts:false,
        options:shuffle([enOpt(key,true),enOpt(distr[0]),enOpt(distr[1])]) };
    });
  },

  /* 4. DAY OR NIGHT — classificar cenas */
  daynight(){
    return shuffle(DAYNIGHT).slice(0,7).map(it=>({
      q:'Esta cena é do <b>dia</b> ou da <b>noite</b>? 🌙',
      audio:['q_daynight'], stage:emo(it.e,110), colorOpts:true,
      options:[enOpt('day',it.era==='day'),enOpt('night',it.era==='night')]
    }));
  },

  /* 5. ART COLORS — qual cor predomina na obra */
  colors(){
    const rounds=COLOR_PAINTINGS.map(cp=>{
      return { q:'Qual <b>cor</b> aparece mais nesta obra? 🌈',
        audio:['q_color_art'], stage:emo(cp.e,110)+'<div class="cardtxt">'+WORDS[cp.painting].en+'</div>',
        colorOpts:false,
        options:shuffle([enOpt(cp.color,true),enOpt(cp.distr[0]),enOpt(cp.distr[1])]) };
    });
    /* + perguntas diretas de cor */
    const extras=shuffle(COLOR_KEYS).slice(0,3).map(key=>{
      const distr=pickN(COLOR_KEYS,2,[key]);
      return { q:'Qual é esta <b>cor</b> em inglês? 🎨',
        audio:['q_art_en'], stage:emo(WORDS[key].e,130), colorOpts:false,
        options:shuffle([enOpt(key,true),enOpt(distr[0]),enOpt(distr[1])]) };
    });
    return shuffle([...rounds,...extras]).slice(0,7);
  },

  /* 6. FAMOUS PAINTINGS — nome do quadro + quem pintou */
  paintings(){
    const nameRounds=shuffle(PAINTING_KEYS).slice(0,3).map(key=>{
      const distr=pickN(PAINTING_KEYS,2,[key]);
      return { q:'Qual é o <b>nome</b> deste quadro famoso? 🖼️',
        audio:['q_painting_name'], stage:emo(WORDS[key].e,130), colorOpts:false,
        options:shuffle([enOpt(key,true),enOpt(distr[0]),enOpt(distr[1])]) };
    });
    /* quem pintou? sempre Van Gogh no contexto deste módulo */
    const artistRounds=shuffle(PAINTING_KEYS).slice(0,2).map(key=>{
      return { q:'Quem <b>pintou</b> este quadro? 👨‍🎨',
        audio:['q_painting_artist'], stage:emo(WORDS[key].e,110)+'<div class="cardtxt">'+WORDS[key].en+'</div>',
        colorOpts:true,
        options:shuffle([
          {label:'<b>VAN GOGH</b>',aud:['en_vangogh'],correct:true},
          {label:'<b>PICASSO</b>',aud:['en_vangogh']},
          {label:'<b>DA VINCI</b>',aud:['en_vangogh']},
        ]) };
    });
    return shuffle([...nameRounds,...artistRounds]);
  },

  /* 7. STARRY NIGHT — o que tem no quadro */
  starry(){
    const has=shuffle(STARRY_HAS).slice(0,4).map(key=>({
      q:'O que a gente vê no quadro <b>The Starry Night</b>? ⭐',
      audio:['q_starry'], stage:emo('🌌',130)+'<div class="cardtxt">THE STARRY NIGHT</div>',
      colorOpts:true,
      options:shuffle([enOpt(key,true),...pickN(STARRY_NOT,1).map(k=>enOpt(k))])
    }));
    /* qual NÃO tem */
    const not=shuffle(STARRY_NOT).slice(0,2).map(key=>{
      const right=pick(STARRY_HAS);
      return { q:'Qual destes <b>aparece</b> no quadro <b>The Starry Night</b>?',
        audio:['q_starry'], stage:emo('🌌',130)+'<div class="cardtxt">THE STARRY NIGHT</div>',
        colorOpts:false,
        options:shuffle([enOpt(right,true),enOpt(key),...pickN(STARRY_NOT,1,[key]).map(k=>enOpt(k))]) };
    });
    return shuffle([...has,...not]).slice(0,7);
  },

  /* 8. VAN GOGH — fatos sobre o artista */
  vangogh(){
    const rounds=[
      { q:'De qual <b>país</b> era Van Gogh? 🌍',
        audio:['q_vangogh'], stage:emo('👨‍🎨',130)+'<div class="cardtxt">VINCENT VAN GOGH</div>',
        colorOpts:true,
        options:shuffle([enOpt('netherlands',true),enOpt('france'),enOpt('brazil')]) },
      { q:'Em qual <b>país</b> Van Gogh pintou muitos quadros? 🇫🇷',
        audio:['q_vangogh'], stage:emo('🖌️',110)+'<div class="cardtxt">Where did he paint?</div>',
        colorOpts:true,
        options:shuffle([enOpt('france',true),enOpt('brazil'),enOpt('netherlands')]) },
      { q:'Como se diz <b>ARTISTA</b> em inglês? 👨‍🎨',
        audio:['q_art_en'], stage:emo('👨‍🎨',130),
        colorOpts:false,
        options:shuffle([enOpt('artist',true),enOpt('painting'),enOpt('museum')]) },
      { q:'Como se diz <b>QUADRO</b> em inglês? 🖼️',
        audio:['q_art_en'], stage:emo('🖼️',130),
        colorOpts:false,
        options:shuffle([enOpt('painting',true),enOpt('artist'),enOpt('landscape')]) },
      { q:'Como se diz <b>MUSEU</b> em inglês? 🏛️',
        audio:['q_art_en'], stage:emo('🏛️',130),
        colorOpts:false,
        options:shuffle([enOpt('museum',true),enOpt('painting'),enOpt('art')]) },
      { q:'Como se diz <b>PAISAGEM</b> em inglês? 🏞️',
        audio:['q_art_en'], stage:emo('🏞️',130),
        colorOpts:false,
        options:shuffle([enOpt('landscape',true),enOpt('portrait'),enOpt('museum')]) },
      { q:'Qual é o <b>quadro mais famoso</b> de Van Gogh?',
        audio:['q_painting_name'], stage:emo('👨‍🎨',110)+'<div class="cardtxt">Most famous painting?</div>',
        colorOpts:false,
        options:shuffle([enOpt('starry_night',true),enOpt('bedroom'),enOpt('self_portrait')]) },
    ];
    return shuffle(rounds).slice(0,7);
  },
};

function enterApp(){
  initAudio();
  unlockAudio();
  document.getElementById('splash').style.display='none';
  goHome(true);
  setTimeout(()=>playKeys(['greet']),350);
}
document.getElementById('startBtn').addEventListener('click',enterApp);
document.getElementById('splash').addEventListener('click',e=>{ if(e.target.id!=='startBtn'){ enterApp(); } });
