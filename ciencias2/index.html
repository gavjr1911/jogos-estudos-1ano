<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌍 Ciências 2 🌍</title>
<style>
  :root{
    --rosa:#ff6b9d; --roxo:#a06cd5; --azul:#4d96ff; --verde:#6bcB77;
    --amarelo:#ffd93d; --laranja:#ff924c; --vermelho:#ff5e5e; --ceu:#b8e3ff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    font-family:'Comic Sans MS','Baloo',"Trebuchet MS",sans-serif;
    background:linear-gradient(160deg,#e8fbe9 0%,#dff3ff 50%,#f3ecff 100%);
    color:#3a3a55; overflow-x:hidden; user-select:none;
    min-height:100%; touch-action:manipulation;
  }
  #app{max-width:760px; margin:0 auto; padding:14px; min-height:100vh;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; border-radius:22px; padding:8px 14px; margin-bottom:14px;
    box-shadow:0 6px 0 rgba(0,0,0,.08);
  }
  .topbar .home-btn{
    background:var(--azul); color:#fff; border:none; border-radius:16px;
    font-size:22px; padding:8px 14px; font-weight:bold; cursor:pointer; box-shadow:0 4px 0 #2f6fd0;
  }
  .topbar .home-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #2f6fd0;}
  .stars{font-size:24px; font-weight:bold; color:var(--laranja); display:flex; align-items:center; gap:6px;}
  .stars .num{background:var(--amarelo); border-radius:14px; padding:2px 12px; box-shadow:0 3px 0 #d9a800;}

  .hero{
    text-align:center; background:#fff; border-radius:30px; padding:22px 18px;
    box-shadow:0 8px 0 rgba(0,0,0,.08); margin-bottom:18px;
  }
  .hero h1{font-size:32px; margin:6px 0; color:var(--verde); line-height:1.2;}
  .hero p{font-size:18px; margin:4px 0; color:#666;}
  .mascote{font-size:78px; display:inline-block; animation:flutua 2.5s ease-in-out infinite;}
  @keyframes flutua{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-14px) rotate(3deg);}}

  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
  .card{
    border:none; border-radius:26px; padding:16px 10px; cursor:pointer;
    color:#fff; font-size:19px; font-weight:bold; text-align:center;
    box-shadow:0 7px 0 rgba(0,0,0,.18); transition:transform .08s;
    display:flex; flex-direction:column; align-items:center; gap:6px; line-height:1.15;
  }
  .card:active{transform:translateY(4px); box-shadow:0 3px 0 rgba(0,0,0,.18);}
  .card .ico{font-size:44px;}
  .c1{background:var(--laranja);} .c2{background:var(--azul);} .c3{background:var(--roxo);}
  .c4{background:var(--rosa);} .c5{background:var(--verde);} .c6{background:#19c3b1;}
  .c7{background:#b07d4b;} .c8{background:#3aa7e8;} .c9{background:#7cab3a;}

  .game{
    background:#fff; border-radius:30px; padding:18px; box-shadow:0 8px 0 rgba(0,0,0,.08);
    text-align:center;
  }
  .game-title{font-size:24px; color:var(--verde); margin:0 0 4px;}
  .progress{font-size:16px; color:#999; margin-bottom:10px;}
  .question{
    font-size:22px; font-weight:bold; color:#3a3a55; margin:6px 0 14px; line-height:1.35;
    display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
  }
  .speak-btn{
    background:var(--amarelo); border:none; border-radius:50%; width:54px; height:54px;
    font-size:28px; cursor:pointer; box-shadow:0 4px 0 #d9a800; flex:0 0 auto;
  }
  .speak-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #d9a800;}
  .speak-btn.playing{animation:pulse .7s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}

  .stage{
    min-height:120px; display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:10px; margin:10px auto 18px; padding:16px;
    background:linear-gradient(160deg,#f3fff5,#eef7ff); border-radius:22px; border:4px dashed #bfe6c6;
    flex-direction:column;
  }
  .obj{font-size:74px; animation:pop .35s ease; line-height:1;}
  @keyframes pop{0%{transform:scale(0);}70%{transform:scale(1.25);}100%{transform:scale(1);}}
  .cardtxt{font-size:19px; font-weight:bold; color:#5a7a5f; margin-top:4px; line-height:1.3; max-width:430px;}

  /* fichas de sequência (montar a ordem) */
  .seqslots{display:flex; flex-direction:column; gap:8px; align-items:stretch; max-width:520px; margin:0 auto;}
  .seqslot{
    min-height:52px; border:4px dashed #bfe0c6; border-radius:16px; background:#f7fff9;
    display:flex; align-items:center; gap:10px; padding:8px 12px; font-size:16px; font-weight:bold; color:#8aa593;
  }
  .seqslot .nn{background:var(--verde); color:#fff; border-radius:50%; width:32px; height:32px; flex:0 0 auto;
               display:flex; align-items:center; justify-content:center; font-size:18px;}
  .seqslot.filled{border-style:solid; border-color:var(--verde); background:#eefaf0; color:#2c5c38;}
  .fichas{display:flex; flex-direction:column; gap:10px; margin-top:14px;}
  .ficha{
    border:none; border-radius:18px; padding:13px 14px; font-size:17px; font-weight:bold; text-align:left;
    background:var(--azul); color:#fff; box-shadow:0 5px 0 #2f6fd0; cursor:pointer; line-height:1.25;
  }
  .ficha:active{transform:translateY(3px); box-shadow:0 2px 0 #2f6fd0;}
  .ficha.used{background:#cfcfe0; box-shadow:0 5px 0 #a0a0c0; opacity:.55; cursor:default;}
  .ficha.shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}

  .options{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
  .opt{
    border:none; border-radius:22px; padding:16px 10px; font-size:23px; font-weight:bold;
    cursor:pointer; background:var(--azul); color:#fff; box-shadow:0 6px 0 #2f6fd0;
    min-height:80px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    overflow-wrap:break-word; line-height:1.15;
  }
  .opt .cap{font-size:17px; font-weight:bold;}
  .opt:active{transform:translateY(3px); box-shadow:0 3px 0 #2f6fd0;}
  .opt.big{font-size:40px;}
  .opt.ok{background:var(--verde)!important; box-shadow:0 6px 0 #3f9c4f!important; animation:tada .5s;}
  .opt.no{background:#cfcfe0!important; box-shadow:0 6px 0 #a0a0c0!important; opacity:.7;}
  @keyframes tada{0%{transform:scale(1);}30%{transform:scale(1.18) rotate(-4deg);}60%{transform:scale(1.1) rotate(4deg);}100%{transform:scale(1);}}

  /* nenhuma cor de opção pode ser VERDE: verde é o sinal de "acertou" */
  .opt-colors .opt{font-size:19px;}
  .opt-colors .opt:nth-child(1){background:var(--rosa); box-shadow:0 6px 0 #d44d7c;}
  .opt-colors .opt:nth-child(2){background:var(--azul); box-shadow:0 6px 0 #2f6fd0;}
  .opt-colors .opt:nth-child(3){background:var(--laranja); box-shadow:0 6px 0 #d96d2e;}
  .opt-colors .opt:nth-child(4){background:var(--roxo); box-shadow:0 6px 0 #7a4db0;}

  .feedback{font-size:25px; font-weight:bold; min-height:40px; margin-top:12px;}
  .feedback.good{color:var(--verde);} .feedback.bad{color:var(--laranja);}

  .next-btn{
    margin-top:14px; background:var(--verde); color:#fff; border:none; border-radius:22px;
    font-size:24px; font-weight:bold; padding:14px 34px; cursor:pointer; box-shadow:0 6px 0 #3f9c4f;
  }
  .next-btn:active{transform:translateY(3px); box-shadow:0 3px 0 #3f9c4f;}

  #splash{
    position:fixed; inset:0; background:linear-gradient(160deg,#4fb477,#3aa7e8);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; z-index:50; cursor:pointer; padding:20px;
  }
  #splash h1{font-size:34px; margin:10px;}
  #splash .big{font-size:100px; animation:flutua 2.5s infinite;}
  #splash .play{
    margin-top:24px; background:var(--amarelo); color:#5a4500; border:none; border-radius:30px;
    font-size:30px; font-weight:bold; padding:18px 44px; box-shadow:0 8px 0 #d9a800; cursor:pointer;
  }

  #confetti{position:fixed; inset:0; pointer-events:none; z-index:40;}
  .win{text-align:center; padding:20px;}
  .win .trophy{font-size:90px; animation:tada 1s;}

  @media(max-width:480px){
    .hero h1{font-size:26px;} .question{font-size:19px;} .card{font-size:16px;}
    .obj{font-size:60px;} .cardtxt{font-size:17px;}
    .opt{font-size:20px;} .opt .cap{font-size:15px;} .ficha{font-size:15px;}
  }
</style>
</head>

<div id="splash">

/* ============================================================
   PLAYER DE ÁUDIO (clipes em sequência) — um único <audio>
   destravado no 1º toque (compatível com iPhone/iPad).
   ============================================================ */
const AUDIO_DIR='audio/', AUDIO_EXT='.mp3';
const player=new Audio();
player.preload='auto';
let playToken=0, audioOn=true;
function stopAudio(){ playToken++; try{player.pause();}catch(e){} setPlayingBadge(false); }
function playKeys(keys){
  if(!audioOn) return;
  stopAudio();
  const list=[].concat(...keys.map(k=>Array.isArray(k)?k:[k])).filter(Boolean);
  if(!list.length) return;
  const my=playToken; let i=0;
  setPlayingBadge(true);
  const next=()=>{
    if(my!==playToken) return;
    if(i>=list.length){ setPlayingBadge(false); return; }
    const key=list[i++];
    player.src=AUDIO_DIR+key+AUDIO_EXT;
    player.onended=next;
    player.onerror=()=>{ setTimeout(next,10); };
    const p=player.play();
    if(p&&p.catch) p.catch(()=>setTimeout(next,10));
  };
  next();
}
function setPlayingBadge(on){
  const b=document.getElementById('qspeak'); if(b) b.classList.toggle('playing',on);
}
function unlockAudio(depois){
  const pronto=()=>{ player.muted=false; if(depois){ const f=depois; depois=null; f(); } };
  try{ player.muted=true; player.src=AUDIO_DIR+'greet'+AUDIO_EXT;
       const p=player.play();
       if(p&&p.then) p.then(()=>{player.pause();player.currentTime=0;pronto();}).catch(pronto);
       else { player.pause(); pronto(); }
       setTimeout(pronto,1200);   /* se a promise nunca resolver, a saudação toca assim mesmo */
  }catch(e){ pronto(); }
}

/* ===== SONS DE EFEITO (Web Audio) ===== */
let actx=null;
function initAudio(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }
function tone(freq,start,dur,type='sine',vol=0.2){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
  const t=actx.currentTime+start;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.start(t); o.stop(t+dur);
}

function sndWrong(){ initAudio(); tone(300,0,0.18,'sine',0.13); tone(220,0.12,0.25,'sine',0.13); }
function sndWin(){ initAudio(); [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*0.12,0.3,'triangle',0.2)); }

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rint(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function mix(){ return shuffle([].concat(...arguments)); }

const cv=document.getElementById('confetti'), cx=cv.getContext('2d');
let confs=[];
function resizeCv(){cv.width=innerWidth;cv.height=innerHeight;}
addEventListener('resize',resizeCv); resizeCv();
function burst(){
  const cols=['#ff6b9d','#ffd93d','#6bcB77','#4d96ff','#a06cd5','#ff924c'];
  for(let i=0;i<70;i++){confs.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-0.5)*14,vy:Math.random()*-12-3,c:pick(cols),s:rint(7,14),r:Math.random()*6,vr:(Math.random()-.5)*.4});}
}
function loopConf(){
  cx.clearRect(0,0,cv.width,cv.height);
  confs.forEach(p=>{p.vy+=0.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s);cx.restore();});
  confs=confs.filter(p=>p.y<cv.height+30);
  requestAnimationFrame(loopConf);
}
loopConf();

  locked=true; sndRight(); burst(); addStar(1);
  const fb=document.getElementById('fb'); if(fb){fb.className='feedback good'; fb.textContent='⭐ Muito bem!';}
  playKeys(extraAudio.filter(Boolean));
  showNextButton();
}
function answer(btn,opt){
  if(locked) return;
  if(opt.correct){
    btn.classList.add('ok');
    document.querySelectorAll('.opt').forEach(b=>{if(b!==btn)b.classList.add('no');});
    correctFlow([opt.aud, pick(OK_KEYS), opt.expAud]);
  }else{
    btn.classList.add('no'); btn.onclick=null;
    sndWrong();
    const fb=document.getElementById('fb'); fb.className='feedback bad'; fb.textContent='🤔 Tenta de novo!';
    playKeys([opt.aud, pick(NO_KEYS)].filter(Boolean));
  }
}

/* ---- modo MONTAR A ORDEM ---- */
function renderSeq(c,r){
  seqPos=0;
  const slots=r.itens.map((_,i)=>`<div class="seqslot" id="sl${i}"><span class="nn">${i+1}</span><span class="tx">...</span></div>`).join('');
  gameFrame(c,r,`
    <div class="seqslots">${slots}</div>
    <div class="fichas" id="fichas"></div>
  `);
  const box=document.getElementById('fichas');
  shuffle(r.itens.map((it,i)=>({it,i}))).forEach(t=>{
    const b=document.createElement('button');
    b.className='ficha'; b.textContent=t.it.txt;
    b.onclick=()=>tapFicha(b,t.i,r);
    box.appendChild(b);
  });
  window._roundKeys=[].concat(r.audio||[]);
  setTimeout(()=>speakRound(),400);
}
function tapFicha(btn,idx,r){
  if(locked) return;
  if(idx===seqPos){
    const sl=document.getElementById('sl'+seqPos);
    sl.querySelector('.tx').textContent=r.itens[idx].txt;
    sl.classList.add('filled');
    btn.classList.add('used'); btn.onclick=null;
    sndClick(); playKeys([r.itens[idx].aud]);
    seqPos++;
    if(seqPos>=r.itens.length){
      setTimeout(()=>correctFlow([pick(OK_KEYS), r.expAud]),600);
    }
  }else{
    sndWrong();
    btn.classList.add('shake'); setTimeout(()=>btn.classList.remove('shake'),420);
    const fb=document.getElementById('fb'); fb.className='feedback bad'; fb.textContent='🤔 Esse não é o próximo!';
    playKeys([r.itens[idx].aud, pick(NO_KEYS)]);
  }
}

/* opções a partir de um mapa de rótulos */
function mkOpts(correct, all, lblMap, extra){
  return shuffle(all).map(k=>{
    const o={label:lblMap[k], aud:k, correct:k===correct};
    if(extra) Object.assign(o, extra(k));
    return o;
  });
}
/* marca a resposta certa com uma frase de reforço, falada após o acerto */
function exp(options, expAud){ options.forEach(o=>{ if(o.correct) o.expAud=expAud; }); return options; }
/* rótulo com emoji em cima e legenda embaixo */
function L(e,txt){ return e+'<span class="cap">'+txt+'</span>'; }

  /* 5. VIVO OU NÃO VIVO? */

    /* cada pergunta sorteia o SEU trio: senão a 2ª sai por eliminação da 1ª */
    const trio=()=>[pick(['nv_sol','nv_agua','nv_ar','nv_pedra']),
                    pick(['sv_arvore','sv_borboleta','sv_peixe','sv_cachorro']),

       options:mkOpts('ag_dia_ok',['ag_dia_ok','ag_dia_x','ag_dia_y'],
         {ag_dia_ok:L('☀️','Porque a luz do sol chega naquele lugar'), ag_dia_x:L('💡','Porque alguém acende uma lâmpada'), ag_dia_y:L('🌙','Porque a lua vai embora do céu')})},
      {q:'E por que fica <b>noite</b> em um lugar da Terra? 🌙',
       audio:['ag_q_noite'], stage:cena('🌍🌙'), colorOpts:true,
       options:mkOpts('ag_noite_ok',['ag_noite_ok','ag_noite_x','ag_noite_y'],
         {ag_noite_ok:L('🌙','Porque a luz do sol não chega naquele lugar'), ag_noite_x:L('🛌','Porque todo mundo do lugar foi dormir'), ag_noite_y:L('🔌','Porque o sol se apaga durante a noite')})},
      {q:'A luz do sol aquece o planeta e define o quê? 🍂🌸',
       audio:['ag_q_estacoes'], stage:cena('🍂🌸'), colorOpts:true,
       options:mkOpts('ag_estacoes',['ag_estacoes','ag_estacoes_x','ag_estacoes_y'],
         {ag_estacoes:L('🍂🌸','As estações do ano'), ag_estacoes_x:L('🎂','Os aniversários'), ag_estacoes_y:L('🔢','Os números')})},
      {q:'Para que a <b>planta</b> usa a água e a luz do sol? 🌱',
       audio:['ag_q_planta'], stage:cena('🌱☀️'), colorOpts:true,
       options:mkOpts('ag_planta_ok',['ag_planta_ok','ag_planta_x','ag_planta_y'],
         {ag_planta_ok:L('🌱','Para crescer e fabricar o próprio alimento'), ag_planta_x:L('🎨','Para pintar as folhas de verde'), ag_planta_y:L('🎵','Para fazer música com o vento')})},
      {q:'Para que as <b>tartarugas</b> precisam da luz do sol? 🐢',
       audio:['ag_q_tartaruga'], stage:cena('🐢🥚'), colorOpts:true,
       options:mkOpts('ag_tarta_ok',['ag_tarta_ok','ag_tarta_x','ag_tarta_y'],
         {ag_tarta_ok:L('🐢🥚','Para se aquecer e chocar os ovos'), ag_tarta_x:L('🎨','Para ficar com o casco colorido'), ag_tarta_y:L('🏊','Para aprender a nadar no mar')})},
      {q:'O que as <b>placas solares</b> fazem com a luz do sol? 🔌',
       audio:['ag_q_placas'], stage:cena('☀️🔌'), colorOpts:true,
       options:mkOpts('ag_placa_ok',['ag_placa_ok','ag_placa_x','ag_placa_y'],
         {ag_placa_ok:L('🔌','Transformam a luz do sol em energia elétrica'), ag_placa_x:L('💧','Transformam a luz do sol em água da chuva'), ag_placa_y:L('🍎','Transformam a luz do sol em comida quentinha')})},
    ];
    const ar=[
      {q:'O <b>ar</b> ajuda quais animais a se movimentarem? 🕊️',
       audio:['ag_q_ar_animais'], stage:cena('🕊️🐝'), colorOpts:true,
       options:mkOpts('ag_ar_aves',['ag_ar_aves','ag_ar_peixes','ag_ar_minhocas'],
         {ag_ar_aves:L('🕊️🐝','As aves e os insetos'), ag_ar_peixes:L('🐟🐢','Os peixes e as tartarugas'), ag_ar_minhocas:L('🪱🐌','As minhocas e os caracóis')})},
      {q:'O <b>vento</b> leva o pólen das flores. O que pode se formar depois disso? 🌸',
       audio:['ag_q_polen'], stage:cena('🌸💨'), colorOpts:true,
       options:mkOpts('ag_polen_ok',['ag_polen_ok','ag_polen_x','ag_polen_y'],
         {ag_polen_ok:L('🌰🍎','Sementes e frutos'), ag_polen_x:L('🪨🏖️','Pedras e areia'), ag_polen_y:L('☁️🌧️','Nuvens de chuva')})},
    ];
    const tres={q:'Quais são os <b>três elementos</b> que existem em todo lugar e mantêm a vida? 🌍',
       audio:['ag_q_tres'], stage:cena('💧🟤☀️'), colorOpts:true,
       options:exp(mkOpts('ag_tres',['ag_tres','ag_tres_x','ag_tres_y'],
         {ag_tres:L('💧🟤☀️','A água, o solo e a luz do sol'), ag_tres_x:L('🍫🍬','O chocolate, a bala e o pirulito'), ag_tres_y:L('🚗🏠','O carro, a casa e o celular')}),'exp_tres')};
    return mix([tres], shuffle(agua).slice(0,2), shuffle(solo).slice(0,1),
               shuffle(sol).slice(0,2), shuffle(ar).slice(0,1));
  },

  /* 9. RECURSOS NATURAIS */
  recursos(){
    const fixas=[
      {q:'O que são os <b>recursos naturais</b>? 🌍',
       audio:['rn_q_oque'], stage:cena('🌍🌾'), colorOpts:true,
       options:exp(mkOpts('rn_def',['rn_def','rn_def_x','rn_def_y'],
         {rn_def:L('🌍','O que as pessoas tiram da natureza para viver'), rn_def_x:L('🏭','As coisas feitas só dentro das fábricas'), rn_def_y:L('🎁','Os brinquedos comprados nas lojas grandes')}),'exp_recursos')},
      {q:'Qual destes é um <b>recurso natural</b>? 💧',
       audio:['rn_q_qual'], stage:cena('🤔'), colorOpts:true,
       options:mkOpts('rn_agua',['rn_agua','rn_video','rn_boneco'],
         {rn_agua:L('💧','A água'), rn_video:L('🎮','O videogame'), rn_boneco:L('🧸','O boneco de plástico')})},
      {q:'Qual recurso natural a pessoa tira da <b>colmeia</b>? 🍯',
       audio:['rn_q_mel'], stage:cena('🐝🍯'), colorOpts:true,
       options:mkOpts('rn_mel',['rn_mel','rn_leite','rn_plastico'],
         {rn_mel:L('🍯','O mel das abelhas'), rn_leite:L('🥛','O leite das vacas'), rn_plastico:L('🧴','O plástico da fábrica')})},
      {q:'O <b>pescador</b> tira o alimento dele de onde? 🎣',
       audio:['rn_q_pesca'], stage:cena('🎣🐟'), colorOpts:true,
       options:mkOpts('rn_rio',['rn_rio','rn_supermercado','rn_ceu'],
         {rn_rio:L('🎣','Da água do rio ou do mar'), rn_supermercado:L('🛒','Só do supermercado da esquina'), rn_ceu:L('☁️','Do céu, quando chove')})},
      {q:'O <b>agricultor</b> planta e colhe usando quais recursos da natureza? 🌾',
       audio:['rn_q_planta'], stage:cena('👨‍🌾🌱'), colorOpts:true,
       options:mkOpts('rn_solo_agua_sol',['rn_solo_agua_sol','rn_x','rn_y'],
         {rn_solo_agua_sol:L('🟤💧☀️','O solo, a água e a luz do sol'), rn_x:L('📱','O celular e a televisão'), rn_y:L('🧊','O gelo e a neve do congelador')})},
      {q:'A <b>madeira</b> que vira papel é um recurso tirado de onde? 🪵',
       audio:['rn_q_madeira_rec'], stage:cena('🪵'), colorOpts:true,
       options:mkOpts('rn_mad_arvore',['rn_mad_arvore','rn_mad_fabrica','rn_mad_loja'],
         {rn_mad_arvore:L('🌳','Da árvore'), rn_mad_fabrica:L('🏭','Da fábrica'), rn_mad_loja:L('🏪','Da loja')})},
      {q:'Para quais coisas as pessoas usam a <b>água</b> todo dia? 💧',
       audio:['rn_q_usos'], stage:cena('💧🚰'), colorOpts:true,
       options:mkOpts('rn_usos_ok',['rn_usos_ok','rn_usos_x','rn_usos_y'],
         {rn_usos_ok:L('🍽️🚿','Para beber, cozinhar, plantar e tomar banho'), rn_usos_x:L('🛁','Só para encher a piscina do quintal'), rn_usos_y:L('🚗','Só para lavar o carro da família')})},
      {q:'Como devemos usar a <b>água</b>? 🚿',
       audio:['rn_q_agua_uso'], stage:cena('🚿💧'), colorOpts:true,
       options:mkOpts('rn_cuidado',['rn_cuidado','rn_gastar','rn_sujar'],
         {rn_cuidado:L('🚿','Com cuidado, sem gastar à toa'), rn_gastar:L('💦','Deixando a torneira aberta o tempo todo'), rn_sujar:L('🗑️','Jogando lixo dentro do rio')})},
      {q:'E se não existisse água, luz do sol nem plantas? O que aconteceria? 🌍',
       audio:['rn_q_sem'], stage:cena('🌍❓'), colorOpts:true,
       options:mkOpts('rn_sem_ok',['rn_sem_ok','rn_sem_x','rn_sem_y'],
         {rn_sem_ok:L('🌍','A vida não seria do jeito que a gente conhece'), rn_sem_x:L('😀','Não mudaria nada na vida do planeta'), rn_sem_y:L('🎉','Tudo ficaria bem melhor para todo mundo')})},
      {q:'O que a gente pode fazer para <b>cuidar do ambiente</b> onde vive? 💚',
       audio:['rn_q_cuidar'], stage:cena('💚🌳'), colorOpts:true,
       options:mkOpts('rn_cuidar_ok',['rn_cuidar_ok','rn_cuidar_x','rn_cuidar_y'],
         {rn_cuidar_ok:L('💚','Cuidar da água, do solo e das plantas'), rn_cuidar_x:L('🗑️','Jogar o lixo no chão da rua'), rn_cuidar_y:L('🪓','Cortar todas as árvores do lugar')})},
    ];
    return shuffle(fixas).slice(0,7);
  },
};

/* ===== BOOT ===== */
function enterApp(){
  initAudio();
  document.getElementById('splash').style.display='none';
  goHome(true);
  unlockAudio(()=>playKeys(['greet']));
}
document.getElementById('startBtn').addEventListener('click',enterApp);
document.getElementById('splash').addEventListener('click',e=>{ if(e.target.id!=='startBtn'){ enterApp(); } });
</script>
