<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌟 Estudos Divertidos do Vitor 🌟</title>
<meta name="description" content="Jogos educativos do 1º ano — matemática, português, ciências, inglês, geografia e história.">
<meta name="theme-color" content="#a06cd5">
<style>
  :root{
    --rosa:#ff6b9d; --roxo:#a06cd5; --azul:#4d96ff; --verde:#6bcB77;
    --amarelo:#ffd93d; --laranja:#ff924c; --vermelho:#ff5e5e; --ceu:#b8e3ff;
    --turquesa:#19c3b1; --magenta:#f76eb0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    font-family:'Comic Sans MS','Baloo',"Trebuchet MS",sans-serif;
    background:linear-gradient(160deg,#b8e3ff 0%,#e3d0ff 50%,#ffd6ec 100%);
    color:#3a3a55; overflow-x:hidden; user-select:none;
    min-height:100%; touch-action:manipulation;
  }
  #app{max-width:760px; margin:0 auto; padding:14px; min-height:100vh;}

  .hero{
    text-align:center; background:#fff; border-radius:30px; padding:22px 18px;
    box-shadow:0 8px 0 rgba(0,0,0,.08); margin-bottom:18px;
  }
  .hero h1{font-size:32px; margin:6px 0; color:var(--roxo); line-height:1.2;}
  .hero p{font-size:18px; margin:4px 0; color:#666;}
  .mascote{font-size:78px; display:inline-block; animation:flutua 2.5s ease-in-out infinite;}
  @keyframes flutua{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-14px) rotate(3deg);}}

  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
  /* Telas estreitas: uma coluna, para o alvo de toque ficar bem grande */
  @media (max-width:480px){ .grid{grid-template-columns:1fr;} }

  .card{
    border:none; border-radius:26px; padding:18px 12px; cursor:pointer;
    color:#fff; font-size:19px; font-weight:bold; text-align:center;
    box-shadow:0 7px 0 rgba(0,0,0,.18); transition:transform .08s;
    display:flex; flex-direction:column; align-items:center; gap:6px; line-height:1.15;
    text-decoration:none; min-height:150px; justify-content:center;
  }
  .card:active{transform:translateY(4px); box-shadow:0 3px 0 rgba(0,0,0,.18);}
  .card:focus-visible{outline:4px solid #2b2b40; outline-offset:3px;}
  .card .ico{font-size:50px; line-height:1;}
  .card .sub{font-size:13px; font-weight:normal; opacity:.92;}
  .card .tag{
    font-size:11px; font-weight:bold; letter-spacing:.5px; text-transform:uppercase;
    background:rgba(255,255,255,.88); color:#3a3a55; border-radius:10px; padding:3px 9px;
  }

  .rodape{text-align:center; color:#7a6; margin-top:22px; font-size:14px; padding-bottom:20px;}

  @media (prefers-reduced-motion:reduce){
    .mascote{animation:none;}
    .card{transition:none;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="hero">
    <div class="mascote">🦊</div>
    <h1>Oi, Vitor!</h1>
    <p>Escolha o que você quer estudar 👇</p>
  </div>
  <div class="grid" id="grid"></div>
  <noscript>
    <div class="hero" style="margin-top:16px;">
      <p style="color:var(--vermelho);font-weight:bold;">
        Este app precisa de JavaScript ativado para funcionar.
      </p>
    </div>
  </noscript>
  <p class="rodape">Feito com 💜 para o Vitor</p>
</div>

<script>
/* ============================================================
   MÓDULOS DO MENU

   Para adicionar um conteúdo novo, basta acrescentar uma linha
   aqui embaixo e criar a pasta correspondente. Nada mais.

     pasta : nome da pasta no repositório (vira a URL)
     ico   : emoji grande do card
     nome  : título do card
     sub   : linha pequena embaixo do título
     tag   : etiqueta (matéria ou número do módulo)
     cor   : cor de fundo do card — qualquer cor CSS.
             As prontas: var(--rosa) --azul --verde --laranja
             --roxo --vermelho --turquesa --magenta
   ============================================================ */
const MODULOS = [
  {pasta:'matematica',         ico:'🔢', nome:'Matemática',      sub:'Números, sólidos e figuras',      tag:'Módulo 1', cor:'var(--rosa)'},
  {pasta:'portugues2',         ico:'📚', nome:'Português',       sub:'Letras, sílabas e palavras',      tag:'Módulo 2', cor:'var(--azul)'},
  {pasta:'ciencias',           ico:'🔬', nome:'Ciências',        sub:'Seres vivos e natureza',          tag:'Módulo 3', cor:'var(--verde)'},
  {pasta:'ingles2',            ico:'🦉', nome:'English Fun!',    sub:'Cores, animais e números',        tag:'Módulo 4', cor:'var(--laranja)'},
  {pasta:'geografia',          ico:'🗺️', nome:'Geo e História',  sub:'Casa, escola e tempo',            tag:'Módulo 5', cor:'var(--roxo)'},
  {pasta:'matematica2',        ico:'🎲', nome:'Matemática 2',    sub:'Somar, tirar e comparar',         tag:'Módulo 6', cor:'var(--vermelho)'},
  {pasta:'portugues-setembro', ico:'✏️', nome:'Português 2',     sub:'Sílabas, rimas e frases',         tag:'Módulo 7', cor:'var(--turquesa)'},
  {pasta:'ciencias2',          ico:'🌍', nome:'Ciências 2',      sub:'Corpo, materiais e ambiente',     tag:'Módulo 8', cor:'var(--magenta)'},
];


/* ============================================================
   NARRAÇÃO
   Mesmo padrão dos módulos: cada chave vira audio/<chave>.mp3
   gerado por `gerar-audios.py` (edge-tts). A chave de cada
   matéria é "m_" + o nome da pasta.
   ============================================================ */
const VOICE = {
  greet: "Oi, Vitor! Escolha o que você quer estudar.",
  m_matematica: "Matemática",
  m_portugues2: "Português",
  m_ciencias: "Ciências",
  m_ingles2: "Inglês",
  m_geografia: "Geografia e História",
  m_matematica2: "Matemática dois",
  m_portugues_setembro: "Português dois",
  m_ciencias2: "Ciências dois"
};

/* ---- som de toque (gerado no navegador, sem arquivo de áudio) ---- */
let actx=null;
function initAudio(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
  }catch(e){}
}
function tone(freq,start,dur,type='sine',vol=0.2){
  if(!actx) return;
  try{
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq;
    o.connect(g); g.connect(actx.destination);
    const t=actx.currentTime+start;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t); o.stop(t+dur+0.05);
  }catch(e){}
}
function sndClick(){ initAudio(); tone(440,0,0.08,'triangle',0.15); }


/* ---- narração por MP3 (igual aos módulos) ---- */
const player = new Audio();
function audioKey(pasta){ return 'm_' + pasta.replace(/-/g,'_'); }
function say(key){
  try{
    player.pause();
    player.src = 'audio/' + key + '.mp3';
    return player.play().catch(()=>{});
  }catch(e){ return Promise.resolve(); }
}
/* O primeiro toque libera o áudio (regra dos navegadores) e dispara o greet. */
let audioLiberado = false;
function liberarAudio(){
  if(audioLiberado) return;
  audioLiberado = true;
  initAudio();
  say('greet');
}
document.addEventListener('pointerdown', liberarAudio, {once:true});

/* ---- monta o menu ---- */
const grid = document.getElementById('grid');
grid.innerHTML = MODULOS.map(m=>`
  <a class="card" style="background:${m.cor}" href="${m.pasta}/" aria-label="${m.nome} — ${m.sub}">
    <span class="ico" aria-hidden="true">${m.ico}</span>
    <span class="tag">${m.tag}</span>
    <span>${m.nome}</span>
    <span class="sub">${m.sub}</span>
  </a>
`).join('');

// Ao tocar: som de clique + nome da matéria falado, e só então navega.
// Se o áudio falhar por qualquer motivo, o setTimeout garante que navega igual —
// a criança nunca fica presa esperando um som que não veio.
grid.addEventListener('click', (ev)=>{
  const card = ev.target.closest('a.card');
  if(!card) return;
  ev.preventDefault();
  sndClick();
  const destino = card.getAttribute('href');
  const pasta = destino.replace(/\/$/,'');
  say(audioKey(pasta));
  setTimeout(()=>{ location.href = destino; }, 650);
});
</script>
</body>
</html>
