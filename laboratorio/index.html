<style>

    --rosa:#ff6b9d; --roxo:#a06cd5; --azul:#4d96ff; --verde:#6bcB77;

  }

  body{
    font-family:'Comic Sans MS','Baloo',"Trebuchet MS",sans-serif;

  }
  .topbar .home-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #2f6fd0;}
  .topbar .nav{display:flex; align-items:center; gap:8px;}
  .topbar .back-btn{
    background:var(--roxo); color:#fff; border:none; border-radius:16px;
    font-size:22px; padding:8px 14px; font-weight:bold; cursor:pointer;
    box-shadow:0 4px 0 #7d49b0; text-decoration:none; display:inline-block; line-height:1;
  }
  .topbar .back-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #7d49b0;}
  .stars{font-size:24px; font-weight:bold; color:var(--laranja); display:flex; align-items:center; gap:6px;}
  .stars .num{background:var(--amarelo); border-radius:14px; padding:2px 12px; box-shadow:0 3px 0 #d9a800;}

  .hero{
    text-align:center; background:#fff; border-radius:30px; padding:22px 18px;
    box-shadow:0 8px 0 rgba(0,0,0,.08); margin-bottom:18px;
  }
  .hero h1{font-size:32px; margin:6px 0; color:var(--verde); line-height:1.2;}

  .mascote{font-size:78px; display:inline-block; animation:flutua 2.5s ease-in-out infinite;}
  @keyframes flutua{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-14px) rotate(3deg);}}

  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
  .card{
    border:none; border-radius:26px; padding:16px 10px; cursor:pointer;
    color:#fff; font-size:19px; font-weight:bold; text-align:center;
    box-shadow:0 7px 0 rgba(0,0,0,.18); transition:transform .08s;

  .c7{background:#b07d4b;} .c8{background:#3aa7e8;}

  .progress{font-size:16px; color:#999; margin-bottom:10px;}

/* ============================================================
   PLAYER DE ÁUDIO (clipes em sequência)
   ============================================================ */
const AUDIO_DIR='audio/', AUDIO_EXT='.mp3';
const player=new Audio();
player.preload='auto';
let playToken=0, audioOn=true;
function stopAudio(){ playToken++; try{player.pause();}catch(e){} setPlayingBadge(false); }
function playKeys(keys){
  if(!audioOn) return;
  stopAudio();
  const list=[].concat(...keys.map(k=>Array.isArray(k)?k:[k])).filter(Boolean);
  if(!list.length) return;
  const my=playToken; let i=0;
  setPlayingBadge(true);
  const next=()=>{
    if(my!==playToken) return;
    if(i>=list.length){ setPlayingBadge(false); return; }
    const key=list[i++];
    player.src=AUDIO_DIR+key+AUDIO_EXT;
    player.onended=next;
    player.onerror=()=>{ setTimeout(next,10); };
    const p=player.play();
    if(p&&p.catch) p.catch(()=>setTimeout(next,10));
  };
  next();
}
function setPlayingBadge(on){
  const b=document.getElementById('qspeak'); if(b) b.classList.toggle('playing',on);
}
function unlockAudio(depois){
  const pronto=()=>{ player.muted=false; if(depois){ const f=depois; depois=null; f(); } };
  try{ player.muted=true; player.src=AUDIO_DIR+'greet'+AUDIO_EXT;
       const p=player.play();
       if(p&&p.then) p.then(()=>{player.pause();player.currentTime=0;pronto();}).catch(pronto);
       else { player.pause(); pronto(); }
       setTimeout(pronto,1200);
  }catch(e){ pronto(); }
}

/* ===== SONS DE EFEITO (Web Audio) ===== */
let actx=null;
function initAudio(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }
function tone(freq,start,dur,type='sine',vol=0.2){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
  const t=actx.currentTime+start;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.start(t); o.stop(t+dur);
}
function sndClick(){ initAudio(); tone(540,0,0.07,'triangle',0.14); }
function sndRight(){ initAudio(); [523,659,784,1047].forEach((f,i)=>tone(f,i*0.09,0.25,'triangle',0.18)); }
function sndWrong(){ initAudio(); tone(300,0,0.18,'sine',0.13); tone(220,0.12,0.25,'sine',0.13); }
function sndWin(){ initAudio(); [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*0.12,0.3,'triangle',0.2)); }

/* ===== UTILIDADES ===== */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rint(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function mix(){ return shuffle([].concat(...arguments)); }
const OK_KEYS=['ok1','ok2','ok3','ok4','ok5','ok6'], NO_KEYS=['no1','no2','no3'];
function emo(e,size){ return '<span class="obj" style="font-size:'+(size||74)+'px">'+e+'</span>'; }
function cena(e,txt,size){ return emo(e,size||88)+(txt?'<div class="cardtxt">'+txt+'</div>':''); }

function updateStars(){ const el=document.getElementById('starNum'); if(el) el.textContent=stars; localStorage.setItem('vitor_lab_stars',stars); }
function addStar(n=1){ stars+=n; updateStars(); }

/* ---------------- CONFETE ---------------- */
const cv=document.getElementById('confetti'), cx=cv.getContext('2d');
let confs=[];
function resizeCv(){cv.width=innerWidth;cv.height=innerHeight;}
addEventListener('resize',resizeCv); resizeCv();
function burst(){
  const cols=['#ff6b9d','#ffd93d','#6bcB77','#4d96ff','#a06cd5','#ff924c'];
  for(let i=0;i<70;i++){confs.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-0.5)*14,vy:Math.random()*-12-3,c:pick(cols),s:rint(7,14),r:Math.random()*6,vr:(Math.random()-.5)*.4});}
}
function loopConf(){
  cx.clearRect(0,0,cv.width,cv.height);
  confs.forEach(p=>{p.vy+=0.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s);cx.restore();});
  confs=confs.filter(p=>p.y<cv.height+30);
  requestAnimationFrame(loopConf);
}
loopConf();

/* ===== MOTOR DE RODADAS ===== */
let current=null, locked=false, seqPos=0;
function startGame(id){
  const rounds=BUILDERS[id]();
  current={id, title:GAMES.find(g=>g.id===id).nome, rounds, idx:0};
  renderRound();
}
function gameFrame(c,r,bodyHtml){
  shell(`
    <div class="game">
      <h2 class="game-title">${GAMES.find(g=>g.id===c.id).ico} ${c.title}</h2>
      <div class="progress">Pergunta ${c.idx+1} de ${c.rounds.length}</div>
      <div class="question">
        <button class="speak-btn" id="qspeak" onclick="sndClick();speakRound()">🔊</button>
        <span>${r.q}</span>
      </div>
      <div class="stage">${r.stage||''}</div>
      ${bodyHtml}
      <div style="font-size:14px;color:#aaa;margin-top:6px;">👆 Toque para responder. Toque no 🔊 para ouvir de novo.</div>
      <div class="feedback" id="fb"></div>
    </div>
  `);
}
function renderRound(){
  locked=false;
  const c=current, r=c.rounds[c.idx];
  if(window.MODOS && MODOS[r.mode]) return MODOS[r.mode](c,r);
  if(r.mode==='seq'){ return renderSeq(c,r); }
  gameFrame(c,r,`<div class="options ${r.colorOpts?'opt-colors':''}" id="opts"></div>`);
  const shown=shuffle(r.options);
  const opts=document.getElementById('opts');
  shown.forEach(o=>{
    const b=document.createElement('button');
    b.className='opt'+(o.big?' big':'');
    b.innerHTML=o.label;
    b.onclick=()=>answer(b,o);
    opts.appendChild(b);
  });
  window._roundKeys=[].concat(r.audio||[], ['choose'], shown.map(o=>o.aud));
  setTimeout(()=>speakRound(),400);
}
function speakRound(){ playKeys(window._roundKeys||[]); }

function showNextButton(){
  document.querySelectorAll('.opt').forEach(b=>b.onclick=null);
  document.querySelectorAll('.ficha').forEach(b=>b.onclick=null);
  const nb=document.createElement('button');
  nb.className='next-btn';
  const last=current.idx>=current.rounds.length-1;
  nb.textContent=last?'🏆 Terminar':'Próxima ➡';
  nb.onclick=()=>{
    nb.onclick=null;
    sndClick();
    if(last){ winScreen(); return; }
    current.idx++; renderRound();
    locked=true; setTimeout(()=>{locked=false;},350);
  };
  document.querySelector('.game').appendChild(nb);
}
function correctFlow(extraAudio){
  locked=true; sndRight(); burst(); addStar(1);
  const fb=document.getElementById('fb'); if(fb){fb.className='feedback good'; fb.textContent='⭐ Muito bem!';}
  playKeys(extraAudio.filter(Boolean));
  showNextButton();
}
function answer(btn,opt){
  if(locked) return;
  if(opt.correct){
    btn.classList.add('ok');
    document.querySelectorAll('.opt').forEach(b=>{if(b!==btn)b.classList.add('no');});
    correctFlow([opt.aud, pick(OK_KEYS), opt.expAud]);
  }else{
    btn.classList.add('no'); btn.onclick=null;
    sndWrong();
    const fb=document.getElementById('fb'); fb.className='feedback bad'; fb.textContent='🤔 Tenta de novo!';
    playKeys([opt.aud, pick(NO_KEYS)].filter(Boolean));
  }
}

/* ---- modo MONTAR A ORDEM ---- */
function renderSeq(c,r){
  seqPos=0;
  const slots=r.itens.map((_,i)=>`<div class="seqslot" id="sl${i}"><span class="nn">${i+1}</span><span class="tx">...</span></div>`).join('');
  gameFrame(c,r,`
    <div class="seqslots">${slots}</div>
    <div class="fichas" id="fichas"></div>
  `);
  const box=document.getElementById('fichas');
  shuffle(r.itens.map((it,i)=>({it,i}))).forEach(t=>{
    const b=document.createElement('button');
    b.className='ficha'; b.textContent=t.it.txt;
    b.onclick=()=>tapFicha(b,t.i,r);
    box.appendChild(b);
  });
  window._roundKeys=[].concat(r.audio||[]);
  setTimeout(()=>speakRound(),400);
}
function tapFicha(btn,idx,r){
  if(locked) return;
  if(idx===seqPos){
    const sl=document.getElementById('sl'+seqPos);
    sl.querySelector('.tx').textContent=r.itens[idx].txt;
    sl.classList.add('filled');
    btn.classList.add('used'); btn.onclick=null;
    sndClick(); playKeys([r.itens[idx].aud]);
    seqPos++;
    if(seqPos>=r.itens.length){
      setTimeout(()=>correctFlow([pick(OK_KEYS), r.expAud]),600);
    }
  }else{
    sndWrong();
    btn.classList.add('shake'); setTimeout(()=>btn.classList.remove('shake'),420);
    const fb=document.getElementById('fb'); fb.className='feedback bad'; fb.textContent='🤔 Esse não é o próximo!';
    playKeys([r.itens[idx].aud, pick(NO_KEYS)]);
  }
}

function winScreen(){
  sndWin(); burst(); setTimeout(burst,400); setTimeout(burst,800);
  const c=current;
  shell(`
    <div class="game win">
      <div class="trophy">🏆</div>
      <h2 class="game-title">Parabéns!</h2>
      <p style="font-size:22px;">Você ganhou <b>${c.rounds.length}</b> estrelas! ⭐</p>
      <p style="font-size:18px;color:#888;">Você está ficando craque em <b>${c.title}</b>!</p>
      <button class="next-btn" onclick="sndClick();startGame('${c.id}')">🔁 Jogar de novo</button>
      <br>
      <button class="next-btn" style="background:var(--azul);box-shadow:0 6px 0 #2f6fd0;margin-top:10px;" onclick="sndClick();goHome()">🏠 Escolher outro</button>
    </div>
  `);
  setTimeout(()=>playKeys(['win']),250);
}

/* opções a partir de um mapa de rótulos */
function mkOpts(correct, all, lblMap, extra){
  return shuffle(all).map(k=>{
    const o={label:lblMap[k], aud:k, correct:k===correct};
    if(extra) Object.assign(o, extra(k));
    return o;
  });
}
function exp(options, expAud){ options.forEach(o=>{ if(o.correct) o.expAud=expAud; }); return options; }
function L(e,txt){ return e+'<span class="cap">'+txt+'</span>'; }

const BUILDERS={
  classificar(){ return [

     grupos:[{id:'pub', img:'g_publico', aud:'cl_pub'}, {id:'pri', img:'g_privado', aud:'cl_pri'}],
     itens:[

       {img:'mercado', aud:'l_mercado', grupo:'pub'}, {img:'shopping', aud:'l_shopping', grupo:'pri'},
       {img:'cinema', aud:'l_cinema', grupo:'pri'}, {img:'quarto', aud:'l_quarto', grupo:'pri'},
     ]},
    {mode:'classificar', q:'Antigamente ou hoje em dia?', audio:['cl_q2'], expAud:'cl_exp2',
     grupos:[{id:'antes', img:'g_antes', aud:'cl_antes'}, {id:'hoje', img:'g_hoje', aud:'cl_hoje'}],
     itens:[
       {img:'lousa', aud:'m_lousa', grupo:'antes'}, {img:'cartilha', aud:'m_cartilha', grupo:'antes'},
       {img:'goma', aud:'m_goma', grupo:'antes'}, {img:'tablet', aud:'m_tablet', grupo:'hoje'},
       {img:'computador', aud:'m_computador', grupo:'hoje'}, {img:'celular', aud:'m_celular', grupo:'hoje'},
     ]},

  ligar(){

      {mode:'ligar', q:'Ligue cada pessoa ao que ela faz', audio:['lg_q'], expAud:'lg_exp', pares:[P.diretora, P.professor, P.porteiro]},
    ];
  },
  memoria(){ return [
    {mode:'memoria', q:'Encontre os pares!', audio:['mm_q'], expAud:'mm_exp',
     pares:[{img:'carro',aud:'t_carro'}, {img:'onibus',aud:'t_onibus'}, {img:'bicicleta',aud:'t_bicicleta'}]},
    {mode:'memoria', q:'Encontre os pares!', audio:['mm_q'], expAud:'mm_exp',
     pares:[{img:'barco',aud:'t_barco'}, {img:'ape',aud:'t_ape'}, {img:'onibus',aud:'t_onibus'}, {img:'bicicleta',aud:'t_bicicleta'}]},
  ];},
  baloes(){ return [
    {mode:'baloes', q:'Estoure só o que <b>não polui</b>!', audio:['bl_q1'], expAud:'bl_exp1', meta:5,
     itens:[{img:'bicicleta',aud:'t_bicicleta',certo:true}, {img:'ape',aud:'t_ape',certo:true}, {img:'carro',aud:'t_carro',certo:false}]},
    {mode:'baloes', q:'Estoure só os materiais de <b>antigamente</b>!', audio:['bl_q2'], expAud:'bl_exp2', meta:5,
     itens:[{img:'lousa',aud:'m_lousa',certo:true}, {img:'cartilha',aud:'m_cartilha',certo:true}, {img:'goma',aud:'m_goma',certo:true},
            {img:'tablet',aud:'m_tablet',certo:false}, {img:'celular',aud:'m_celular',certo:false}, {img:'computador',aud:'m_computador',certo:false}]},
  ];},
  cena(){
    const lugares=[
      {img:'loja', aud:'r_loja', tipo:'com'}, {img:'casa', aud:'r_casa', tipo:'res'}, {img:'museu', aud:'r_museu', tipo:'cul'},
      {img:'padaria', aud:'r_padaria', tipo:'com'}, {img:'predio', aud:'r_predio', tipo:'res'}, {img:'teatro', aud:'r_teatro', tipo:'cul'},
    ];
    // 4 prédios por cena: os 2 do tipo pedido e 1 de cada outro tipo. Com 6 lado a lado
    // cada um ficava com ~55px no celular — pequeno demais para o dedo.
    const rua = tipo => {
      const outros = ['com','res','cul'].filter(t=>t!==tipo).map(t=>pick(lugares.filter(l=>l.tipo===t)));
      return shuffle([...lugares.filter(l=>l.tipo===tipo), ...outros])
        .map((l,i)=>({...l, certo:l.tipo===tipo, x:1+i*24.6, y:36, w:24}));
    };
    return [
      {mode:'cena', q:'Toque nas <b>lojas</b>!', audio:['cn_q1'], expAud:'cn_exp1', fundo:'rua', objetos:rua('com')},

    ];

    {mode:'tracar', q:'Escreva a letra <b>E</b>', audio:['tr_qE'], expAud:'tr_expE', letra:'E', img:'escola'},
    {mode:'tracar', q:'Escreva a letra <b>B</b>', audio:['tr_qB'], expAud:'tr_expB', letra:'B', img:'bicicleta'},
  ];},
};
