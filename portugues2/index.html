<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📚 Português Divertido 📚</title>
<style>
  :root{
    --rosa:#ff6b9d; --roxo:#a06cd5; --azul:#4d96ff; --verde:#6bcB77;
    --amarelo:#ffd93d; --laranja:#ff924c; --vermelho:#ff5e5e; --ceu:#b8e3ff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    font-family:'Comic Sans MS','Baloo',"Trebuchet MS",sans-serif;
    background:linear-gradient(160deg,#c5f0d8 0%,#d7e6ff 50%,#ffe0f0 100%);
    color:#3a3a55; overflow-x:hidden; user-select:none;
    min-height:100%; touch-action:manipulation;
  }
  #app{max-width:760px; margin:0 auto; padding:14px; min-height:100vh;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; border-radius:22px; padding:8px 14px; margin-bottom:14px;
    box-shadow:0 6px 0 rgba(0,0,0,.08);
  }
  .topbar .home-btn{
    background:var(--azul); color:#fff; border:none; border-radius:16px;
    font-size:22px; padding:8px 14px; font-weight:bold; cursor:pointer; box-shadow:0 4px 0 #2f6fd0;
  }
  .topbar .home-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #2f6fd0;}
  .topbar .nav{display:flex; align-items:center; gap:8px;}
  .topbar .back-btn{
    background:var(--roxo); color:#fff; border:none; border-radius:16px;
    font-size:22px; padding:8px 14px; font-weight:bold; cursor:pointer;
    box-shadow:0 4px 0 #7d49b0; text-decoration:none; display:inline-block; line-height:1;
  }
  .topbar .back-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #7d49b0;}
  .stars{font-size:24px; font-weight:bold; color:var(--laranja); display:flex; align-items:center; gap:6px;}
  .stars .num{background:var(--amarelo); border-radius:14px; padding:2px 12px; box-shadow:0 3px 0 #d9a800;}

  .hero{
    text-align:center; background:#fff; border-radius:30px; padding:22px 18px;
    box-shadow:0 8px 0 rgba(0,0,0,.08); margin-bottom:18px;
  }
  .hero h1{font-size:32px; margin:6px 0; color:var(--roxo); line-height:1.2;}
  .hero p{font-size:18px; margin:4px 0; color:#666;}
  .mascote{font-size:78px; display:inline-block; animation:flutua 2.5s ease-in-out infinite;}
  @keyframes flutua{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-14px) rotate(3deg);}}

  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
  .card{
    border:none; border-radius:26px; padding:16px 10px; cursor:pointer;
    color:#fff; font-size:19px; font-weight:bold; text-align:center;
    box-shadow:0 7px 0 rgba(0,0,0,.18); transition:transform .08s;
    display:flex; flex-direction:column; align-items:center; gap:6px; line-height:1.15;
  }
  .card:active{transform:translateY(4px); box-shadow:0 3px 0 rgba(0,0,0,.18);}
  .card .ico{font-size:46px;}
  .c1{background:var(--rosa);} .c2{background:var(--azul);} .c3{background:var(--verde);}
  .c4{background:var(--laranja);} .c5{background:var(--roxo);} .c6{background:var(--vermelho);}
  .c7{background:#19c3b1;} .c8{background:#f76eb0;} .c9{background:#7c83ff;}

  .game{
    background:#fff; border-radius:30px; padding:18px; box-shadow:0 8px 0 rgba(0,0,0,.08);
    text-align:center;
  }
  .game-title{font-size:24px; color:var(--roxo); margin:0 0 4px;}
  .progress{font-size:16px; color:#999; margin-bottom:10px;}
  .question{
    font-size:23px; font-weight:bold; color:#3a3a55; margin:6px 0 14px; line-height:1.3;
    display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
  }
  .speak-btn{
    background:var(--amarelo); border:none; border-radius:50%; width:54px; height:54px;
    font-size:28px; cursor:pointer; box-shadow:0 4px 0 #d9a800; flex:0 0 auto;
  }
  .speak-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #d9a800;}
  .speak-btn.playing{animation:pulse .7s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}

  .stage{
    min-height:120px; display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:10px; margin:10px auto 18px; padding:16px;
    background:linear-gradient(160deg,#f0fff6,#eef5ff); border-radius:22px; border:4px dashed #cdeedd;
  }
  .obj{font-size:50px; animation:pop .35s ease;}
  @keyframes pop{0%{transform:scale(0);}70%{transform:scale(1.25);}100%{transform:scale(1);}}

  /* ilustrações SVG */
  .illo{display:inline-block; flex:0 0 auto; line-height:0; vertical-align:middle; animation:pop .4s ease;}
  .illo svg{display:block; width:100%; height:100%;}

  /* palavra em quadradinhos de letras */
  .wordtiles{display:flex; gap:6px; flex-wrap:wrap; justify-content:center;}
  .lettile{
    width:46px; height:54px; border:3px solid #a06cd5; border-radius:10px; background:#fff;
    display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:bold; color:#3a3a55;
  }
  .lettile.hl{background:#fff3b0; border-color:#ff924c; color:#e0651b;}
  .lettile.miss{background:#ffe3ec; border-color:#ff5e5e; color:#ff5e5e; font-size:34px;}

  /* montar sílabas */
  .slots{display:flex; gap:8px; justify-content:center; margin-top:10px;}
  .slot{
    min-width:64px; height:58px; border:3px dashed #4d96ff; border-radius:12px; background:#fff;
    display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:bold; color:#2f6fd0; padding:0 8px;
  }
  .slot.filled{border-style:solid; background:#e7f1ff;}
  .tile{
    border:none; border-radius:14px; padding:14px 18px; font-size:26px; font-weight:bold;
    background:var(--verde); color:#fff; box-shadow:0 5px 0 #3f9c4f; cursor:pointer; margin:5px;
  }
  .tile:active{transform:translateY(3px); box-shadow:0 2px 0 #3f9c4f;}
  .tile.used{opacity:.25; pointer-events:none;}
  .tile.shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(7px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}

  .options{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(120px,1fr));}
  .opt{
    border:none; border-radius:22px; padding:14px 8px; font-size:24px; font-weight:bold;
    cursor:pointer; background:var(--azul); color:#fff; box-shadow:0 6px 0 #2f6fd0;
    min-height:74px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    word-break:break-word; line-height:1.15;
  }
  .opt .cap{font-size:18px;}
  .opt-colors .opt{font-size:20px;}
  .opt:active{transform:translateY(3px); box-shadow:0 3px 0 #2f6fd0;}
  .opt.big{font-size:54px;}
  .opt.ok{background:var(--verde)!important; box-shadow:0 6px 0 #3f9c4f!important; animation:tada .5s;}
  .opt.no{background:#cfcfe0!important; box-shadow:0 6px 0 #a0a0c0!important; opacity:.7;}
  @keyframes tada{0%{transform:scale(1);}30%{transform:scale(1.18) rotate(-4deg);}60%{transform:scale(1.1) rotate(4deg);}100%{transform:scale(1);}}

  .opt-colors .opt:nth-child(1){background:var(--rosa); box-shadow:0 6px 0 #d44d7c;}
  .opt-colors .opt:nth-child(2){background:var(--verde); box-shadow:0 6px 0 #3f9c4f;}
  .opt-colors .opt:nth-child(3){background:var(--laranja); box-shadow:0 6px 0 #d96d2e;}
  .opt-colors .opt:nth-child(4){background:var(--roxo); box-shadow:0 6px 0 #7a4db0;}

  /* cartão de convite / bilhete */
  .paper{
    background:#fffdf5; border-radius:18px; padding:16px 18px; text-align:left;
    box-shadow:0 5px 0 rgba(0,0,0,.12); max-width:420px; margin:0 auto; line-height:1.5;
    font-size:18px; border:3px solid #ffe1b0; position:relative;
  }
  .paper .ttl{font-size:20px; font-weight:bold; color:var(--rosa); margin-bottom:8px; text-align:center; padding:0 34px;}
  .paper .row{display:flex; gap:8px; margin:3px 0;}
  .paper .row b{color:var(--roxo);}
  .paper.note{border-color:#cfe3ff; background:#f7fbff;}
  .paper .deco{position:absolute; top:-16px; right:-6px; width:50px; height:50px; line-height:0;}
  .paper .sign{text-align:right; font-style:italic; margin-top:8px; color:#666;}

  .feedback{font-size:26px; font-weight:bold; min-height:40px; margin-top:12px;}
  .feedback.good{color:var(--verde);} .feedback.bad{color:var(--laranja);}

  .next-btn{
    margin-top:14px; background:var(--verde); color:#fff; border:none; border-radius:22px;
    font-size:24px; font-weight:bold; padding:14px 34px; cursor:pointer; box-shadow:0 6px 0 #3f9c4f;
  }
  .next-btn:active{transform:translateY(3px); box-shadow:0 3px 0 #3f9c4f;}

  #splash{
    position:fixed; inset:0; background:linear-gradient(160deg,var(--roxo),var(--azul));
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; z-index:50; cursor:pointer; padding:20px;
  }
  #splash h1{font-size:34px; margin:10px;}
  #splash .big{font-size:100px; animation:flutua 2.5s infinite;}
  #splash .play{
    margin-top:24px; background:var(--amarelo); color:#5a4500; border:none; border-radius:30px;
    font-size:30px; font-weight:bold; padding:18px 44px; box-shadow:0 8px 0 #d9a800; cursor:pointer;
  }

  #confetti{position:fixed; inset:0; pointer-events:none; z-index:40;}
  .win{text-align:center; padding:20px;}
  .win .trophy{font-size:90px; animation:tada 1s;}

  @media(max-width:480px){
    .hero h1{font-size:26px;} .question{font-size:20px;} .card{font-size:17px;}
    .lettile{width:38px; height:46px; font-size:24px;}
  }
</style>
</head>
<body>

<div id="splash">
  <div class="big">🦉</div>
  <h1>Português<br>Divertido!</h1>
  <p style="font-size:20px;max-width:320px;">Vamos brincar com as letras e as palavras pra prova! 🎉<br>Toque no botão para começar.</p>
  <button class="play" id="startBtn">▶ COMEÇAR</button>
</div>

<canvas id="confetti"></canvas>
<div id="app"></div>

<script>
/* ============================================================
   PORTUGUÊS DIVERTIDO DO VITOR — 1º ano (livro Bernoulli, Cap. 2 e 3)
   Módulo 2 do projeto. Mesma estrutura do app de matemática:
   - narração por arquivos pré-gravados (pasta /audio) -> funciona
     em qualquer aparelho, online ou offline;
   - ilustrações vetoriais SVG (não emojis) embutidas no arquivo;
   - estrelas, confete, sons de efeito; tudo jogável sozinho.
   Conteúdos: letra/sílaba/palavra, rima, P e B, convite,

   ============================================================ */

/* ============================================================
   PLAYER DE ÁUDIO (clipes em sequência) — um único <audio>
   destravado no 1º toque (compatível com iPhone/iPad).
   ============================================================ */
const AUDIO_DIR='audio/', AUDIO_EXT='.mp3';
const player=new Audio();
player.preload='auto';
let playToken=0, audioOn=true;
function stopAudio(){ playToken++; try{player.pause();}catch(e){} setPlayingBadge(false); }
function playKeys(keys){
  if(!audioOn) return;
  stopAudio();
  const list=[].concat(...keys.map(k=>Array.isArray(k)?k:[k])).filter(Boolean);
  if(!list.length) return;
  const my=playToken; let i=0;
  setPlayingBadge(true);
  const next=()=>{
    if(my!==playToken) return;
    if(i>=list.length){ setPlayingBadge(false); return; }
    const key=list[i++];
    player.src=AUDIO_DIR+key+AUDIO_EXT;
    player.onended=next;
    player.onerror=()=>{ setTimeout(next,10); };
    const p=player.play();
    if(p&&p.catch) p.catch(()=>setTimeout(next,10));
  };
  next();
}
function setPlayingBadge(on){
  const b=document.getElementById('qspeak'); if(b) b.classList.toggle('playing',on);
}
function unlockAudio(){
  try{ player.muted=true; player.src=AUDIO_DIR+'greet'+AUDIO_EXT;
       const p=player.play();
       if(p&&p.then) p.then(()=>{player.pause();player.currentTime=0;player.muted=false;})
                      .catch(()=>{player.muted=false;});
       else {player.pause();player.muted=false;}
  }catch(e){ player.muted=false; }
}

/* ===== SONS DE EFEITO (Web Audio) ===== */
let actx=null;
function initAudio(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }
function tone(freq,start,dur,type='sine',vol=0.2){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
  const t=actx.currentTime+start;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.start(t); o.stop(t+dur);
}
function sndClick(){ initAudio(); tone(540,0,0.07,'triangle',0.14); }
function sndRight(){ initAudio(); [523,659,784,1047].forEach((f,i)=>tone(f,i*0.09,0.25,'triangle',0.18)); }
function sndWrong(){ initAudio(); tone(300,0,0.18,'sine',0.13); tone(220,0.12,0.25,'sine',0.13); }
function sndWin(){ initAudio(); [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*0.12,0.3,'triangle',0.2)); }

function rint(min,max){return Math.floor(Math.random()*(max-min+1))+min;}

function burst(){
  const cols=['#ff6b9d','#ffd93d','#6bcB77','#4d96ff','#a06cd5','#ff924c'];
  for(let i=0;i<70;i++){confs.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-0.5)*14,vy:Math.random()*-12-3,c:pick(cols),s:rint(7,14),r:Math.random()*6,vr:(Math.random()-.5)*.4});}

function loopConf(){
  cx.clearRect(0,0,cv.width,cv.height);
  confs.forEach(p=>{p.vy+=0.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s);cx.restore();});
  confs=confs.filter(p=>p.y<cv.height+30);
  requestAnimationFrame(loopConf);
}

function renderRound(){
  locked=false;
  const c=current, r=c.rounds[c.idx];
  if(r.mode==='build'){ return renderBuild(c,r); }
  gameFrame(c,r,`<div class="options ${r.colorOpts?'opt-colors':''}" id="opts"></div>`);
  const shown=shuffle(r.options);

  shown.forEach(o=>{

    b.onclick=()=>answer(b,o);

  });
  window._roundKeys=[].concat(r.audio||[], ['choose'], shown.map(o=>o.aud));
  setTimeout(()=>speakRound(),400);
}

function showNextButton(){
  document.querySelectorAll('.opt').forEach(b=>b.onclick=null);

  nb.textContent=last?'🏆 Terminar':'Próxima ➡';
  nb.onclick=()=>{sndClick();locked=false;if(last){winScreen();}else{current.idx++;renderRound();}};
  document.querySelector('.game').appendChild(nb);
}
function correctFlow(extraAudio){
  locked=true; sndRight(); burst(); addStar(1);
  const fb=document.getElementById('fb'); if(fb){fb.className='feedback good'; fb.textContent='⭐ Muito bem!';}
  playKeys(extraAudio.filter(Boolean));

}
function answer(btn,opt){
  if(locked) return;
  if(opt.correct){
    btn.classList.add('ok');
    document.querySelectorAll('.opt').forEach(b=>{if(b!==btn)b.classList.add('no');});
    correctFlow([opt.aud, pick(OK_KEYS), opt.expAud]);
  }else{
    btn.classList.add('no'); btn.onclick=null;
    sndWrong();
    const fb=document.getElementById('fb'); fb.className='feedback bad'; fb.textContent='🤔 Tenta de novo!';
    playKeys([opt.aud, pick(NO_KEYS)].filter(Boolean));
  }
}

function renderBuild(c,r){
  const slots=r.syl.map(()=>`<div class="slot"></div>`).join('');
  gameFrame(c,r,`
    <div class="slots" id="slots">${slots}</div>
    <div class="options" id="opts" style="margin-top:14px"></div>
  `);
  const opts=document.getElementById('opts');
  shuffle(r.syl.map((s,i)=>({s,i}))).forEach(t=>{
    const b=document.createElement('button');
    b.className='tile'; b.textContent=t.s;
    b.onclick=()=>tapTile(b,t.s,r);
    opts.appendChild(b);
  });
  window._roundKeys=[].concat(r.audio||[]);
  setTimeout(()=>speakRound(),400);
}
let buildPos=0;
function tapTile(btn,syl,r){
  if(locked) return;
  if(buildPos===0) buildPos=0;
  if(syl===r.syl[window._bp||0]){
    const bp=window._bp||0;
    const slot=document.querySelectorAll('#slots .slot')[bp];
    slot.textContent=syl; slot.classList.add('filled');
    btn.classList.add('used');
    sndClick();
    window._bp=bp+1;
    if(window._bp>=r.syl.length){ correctFlow([r.ak, pick(OK_KEYS)]); }
  }else{
    sndWrong();
    btn.classList.add('shake'); setTimeout(()=>btn.classList.remove('shake'),420);
    const fb=document.getElementById('fb'); fb.className='feedback bad'; fb.textContent='🤔 Esse não é o próximo!';
  }
}

  /* 2. ORDEM DO ABC */
  abc(){
    const POOL=['A','B','C','D','E','F','G','I','L','M','N','O','P','R','S','T','U','V'];
    const rounds=[];
    for(let i=0;i<6;i++){
      const set=shuffle(POOL).slice(0,3);
      const correct=[...set].sort();
      let wrong1=[...correct].reverse();
      let wrong2=shuffle(set); let guard=0;
      while((wrong2.join('')===correct.join('')||wrong2.join('')===wrong1.join(''))&&guard++<20) wrong2=shuffle(set);
      const stage=`<div class="wordtiles">${set.map(c=>`<span class="lettile">${c}</span>`).join('')}</div>`;
      const mk=arr=>({label:arr.join(' '), aud:arr.map(LETKEY), correct:arr.join('')===correct.join('')});
      rounds.push({ q:'Qual fila está na <b>ordem do ABC</b>? 🔤', audio:['q_abc'], stage, colorOpts:true,
        options:[mk(correct),mk(wrong1),mk(wrong2)] });
    }
    return rounds;
  },

  /* 3. CONTA SÍLABAS (palmas) */
  silaba(){
    const pool=WORDS.filter(w=>w.art);
    return shuffle(pool).slice(0,8).map(it=>{
      const n=it.syl.length;
      const split=it.syl.map(s=>`<span style="color:#a06cd5">${s}</span>`).join('<span style="color:#ff924c">·</span>');
      const stage=illo(it.art,90)+`<div class="wordtiles" style="font-size:30px;font-weight:bold;margin-top:8px">${split}</div><div style="font-size:30px;margin-top:4px">👏</div>`;
      const set=new Set([n]); while(set.size<4){set.add(rint(1,5));}
      const opts=shuffle([...set]).map(v=>({label:`<span style="font-size:40px">${v}</span>`,aud:'p'+v,correct:v===n,expAud:v===n?it.ak:null}));
      return { q:`Quantas palmas tem <b>${it.w}</b>? 👏`, audio:['q_silaba',it.ak], stage, options:opts };
    });
  },

  /* 4. JUNTA SÍLABAS (montar) */
  juntar(){
    const pool=WORDS.filter(w=>w.art && w.syl.length>=2 && w.syl.length<=4);
    return shuffle(pool).slice(0,6).map(it=>({
      mode:'build', q:`Monte a palavra <b>${it.w}</b>! 🧩`, audio:['q_juntar',it.ak],
      stage:illo(it.art,100), syl:it.syl, ak:it.ak
    }));
  },

  /* 5. RIMA */
  rima(){
    const groups={};
    WORDS.forEach(w=>{ (groups[w.rim]=groups[w.rim]||[]).push(w); });
    const rhymeKeys=Object.keys(groups).filter(k=>groups[k].length>=2);
    const rounds=[];
    for(let i=0;i<7;i++){
      const gk=pick(rhymeKeys);
      const two=shuffle(groups[gk]).slice(0,2);
      const target=two[0], partner=two[1];
      const distract=shuffle(WORDS.filter(w=>w.rim!==gk && w.art)).slice(0,2);
      const optWords=shuffle([partner,...distract]);
      const stage=`<div style="font-size:18px;color:#a06cd5;font-weight:bold">Rima com:</div>`+illo(target.art,86)+`<div style="font-size:22px;font-weight:bold">${target.w}</div>`;
      const opts=optWords.map(w=>({label:illo(w.art,56)+`<span class="cap">${w.w}</span>`, aud:w.ak, correct:w===partner, expAud:w===partner?'exp_rima':null}));
      rounds.push({ q:'Qual palavra <b>rima</b>? 🎵', audio:['q_rima',target.ak], stage, options:opts });
    }
    return rounds;
  },

  /* 6. P OU B */
  peb(){
    const pool=WORDS.filter(w=>w.ini==='P'||w.ini==='B');
    return shuffle(pool).slice(0,8).map(it=>{
      const rest=it.w.slice(1);
      const stage=illo(it.art,90)+`<div class="wordtiles" style="margin-top:10px"><span class="lettile miss">?</span>${rest.split('').map(c=>`<span class="lettile">${c}</span>`).join('')}</div>`;
      const opts=[
        {label:'B',big:true,aud:'l_b',correct:it.ini==='B',expAud:it.ini==='B'?'peb_b':null},
        {label:'P',big:true,aud:'l_p',correct:it.ini==='P',expAud:it.ini==='P'?'peb_p':null},
      ];
      return { q:'Começa com <b>P</b> ou com <b>B</b>?', audio:['q_peb',it.ak], stage, colorOpts:true, options:opts };
    });
  },

  /* 7. CONVITE */
  convite(){
    const rounds=[];
    shuffle(CONVITES.concat(shuffle(CONVITES).slice(0,3))).slice(0,7).forEach(cv=>{
      const card=`<div class="paper"><div class="deco">${ART(cv.art)}</div>
        <div class="ttl">${INV_TTL[cv.tipo]}</div>
        <div class="row"><b>📅 Dia:</b> ${LBL_D[cv.d]}</div>
        <div class="row"><b>⏰ Hora:</b> ${LBL_T[cv.t]}</div>
        <div class="row"><b>📍 Local:</b> ${LBL_L[cv.l]}</div></div>`;
      const kind=pick(['data','hora','local']);
      let q,qa,pool,lbls,correct;
      if(kind==='data'){q='Em que <b>dia</b> é a festa? 📅';qa='q_convite_data';pool=ALL_D;lbls=LBL_D;correct=cv.d;}
      else if(kind==='hora'){q='A que <b>horas</b> é? ⏰';qa='q_convite_hora';pool=ALL_T;lbls=LBL_T;correct=cv.t;}
      else{q='<b>Onde</b> vai ser? 📍';qa='q_convite_local';pool=ALL_L;lbls=LBL_L;correct=cv.l;}
      const others=shuffle(pool.filter(x=>x!==correct)).slice(0,2);
      const opts=shuffle([correct,...others]).map(k=>({label:lbls[k],aud:k,correct:k===correct}));
      rounds.push({ q, audio:[qa,cv.tipo,cv.d,cv.t,cv.l], stage:card, colorOpts:true, options:opts });
    });
    return rounds;
  },

  /* 8. BILHETE */
  bilhete(){
    const rounds=[];
    shuffle(BILHETES.concat(shuffle(BILHETES).slice(0,2))).slice(0,6).forEach(b=>{
      const card=`<div class="paper note"><div class="deco">${ART(b.deco)}</div>${b.linhas.map(l=>`<div>${l}</div>`).join('')}</div>`;
      const kind=pick(['quem','paraquem','obj']);
      let q,qa,correct,pool,lbls;
      if(kind==='quem'){q='Quem <b>escreveu</b>? ✍️';qa='q_bilhete_quem';correct=b.autor;pool=ALL_N;lbls=LBL_N;}
      else if(kind==='paraquem'){q='Para <b>quem</b> é? 💌';qa='q_bilhete_paraquem';correct=b.para;pool=ALL_N;lbls=LBL_N;}
      else{q='Para que <b>serve</b>? 🤔';qa='q_bilhete_obj';correct=b.obj;pool=ALL_OBJ;lbls=LBL_OBJ;}
      const others=shuffle(pool.filter(x=>x!==correct)).slice(0,2);
      const opts=shuffle([correct,...others]).map(k=>({label:lbls[k],aud:k,correct:k===correct}));
      rounds.push({ q, audio:[qa,b.read], stage:card, colorOpts:true, options:opts });
    });
    return rounds;
  },

  /* 9. LEGENDA */
  legenda(){
    return shuffle(LEGENDAS).slice(0,7).map(it=>{
      const stage=illo(it.art,120);
      const others=shuffle(LEGENDAS.filter(x=>x.cap!==it.cap)).slice(0,2);
      const opts=shuffle([it,...others]).map(o=>({label:`<span class="cap">${o.lbl}</span>`,aud:o.cap,correct:o.cap===it.cap}));
      return { q:'Qual <b>legenda</b> combina? 📸', audio:['q_legenda'], stage, colorOpts:true, options:opts };
    });
  },
};

/* ===== SPLASH -> INÍCIO ===== */
function enterApp(){
  initAudio();
  unlockAudio();
  document.getElementById('splash').style.display='none';
  goHome(true);
  setTimeout(()=>playKeys(['greet']),350);
}
document.getElementById('startBtn').addEventListener('click',enterApp);
document.getElementById('splash').addEventListener('click',e=>{ if(e.target.id!=='startBtn'){ enterApp(); } });

/* zera o ponteiro de montagem a cada rodada */
const _origRender=renderRound;
renderRound=function(){ window._bp=0; _origRender(); };
</script>
