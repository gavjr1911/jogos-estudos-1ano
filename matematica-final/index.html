<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Matemática — Avaliação Final</title>
<style>
  :root{
    --rosa:#ff6b9d; --roxo:#a06cd5; --azul:#4d96ff; --verde:#6bcB77;
    --amarelo:#ffd93d; --laranja:#ff924c; --vermelho:#ff5e5e; --ceu:#b8e3ff;
    --turquesa:#19c3b1; --magenta:#f76eb0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    font-family:'Comic Sans MS','Baloo',"Trebuchet MS",sans-serif;
    background:linear-gradient(160deg,#ffecd2 0%,#d4e7ff 50%,#d9ffd6 100%);
    color:#3a3a55; overflow-x:hidden; user-select:none;
    min-height:100%; touch-action:manipulation;
  }
  #app{max-width:760px; margin:0 auto; padding:14px; min-height:100vh;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; border-radius:22px; padding:8px 14px; margin-bottom:14px;
    box-shadow:0 6px 0 rgba(0,0,0,.08);
  }
  .topbar .home-btn{
    background:var(--azul); color:#fff; border:none; border-radius:16px;
    font-size:22px; padding:8px 14px; font-weight:bold; cursor:pointer; box-shadow:0 4px 0 #2f6fd0;
  }
  .topbar .home-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #2f6fd0;}
  .topbar .nav{display:flex; align-items:center; gap:8px;}
  .topbar .back-btn{
    background:var(--roxo); color:#fff; border:none; border-radius:16px;
    font-size:22px; padding:8px 14px; font-weight:bold; cursor:pointer;
    box-shadow:0 4px 0 #7d49b0; text-decoration:none; display:inline-block; line-height:1;
  }
  .topbar .back-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #7d49b0;}
  .stars{font-size:24px; font-weight:bold; color:var(--laranja); display:flex; align-items:center; gap:6px;}
  .stars .num{background:var(--amarelo); border-radius:14px; padding:2px 12px; box-shadow:0 3px 0 #d9a800;}

  .hero{
    text-align:center; background:#fff; border-radius:30px; padding:22px 18px;
    box-shadow:0 8px 0 rgba(0,0,0,.08); margin-bottom:18px;
  }
  .hero h1{font-size:30px; margin:6px 0; color:var(--verde); line-height:1.2;}
  .hero p{font-size:18px; margin:4px 0; color:#666;}
  .mascote{display:inline-block;}
  @keyframes flutua{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-14px) rotate(3deg);}}

  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
  .card{
    border:none; border-radius:26px; padding:16px 10px; cursor:pointer;
    color:#fff; font-size:19px; font-weight:bold; text-align:center;
    box-shadow:0 7px 0 rgba(0,0,0,.18); transition:transform .08s;
    display:flex; flex-direction:column; align-items:center; gap:6px; line-height:1.15;
  }
  .card:active{transform:translateY(4px); box-shadow:0 3px 0 rgba(0,0,0,.18);}
  .card .ico{font-size:44px;}
  .card .ico .fig{background:rgba(255,255,255,.88); border-radius:22px; padding:6px;}
  .c1{background:var(--rosa);} .c2{background:var(--azul);} .c3{background:var(--verde);}
  .c4{background:var(--laranja);} .c5{background:var(--roxo);} .c6{background:var(--vermelho);}
  .c7{background:var(--turquesa);} .c8{background:var(--magenta);}

  .game{
    background:#fff; border-radius:30px; padding:18px; box-shadow:0 8px 0 rgba(0,0,0,.08);
    text-align:center;
  }
  .game-title{font-size:24px; color:var(--verde); margin:0 0 4px;}
  .progress{font-size:16px; color:#999; margin-bottom:10px;}
  .question{
    font-size:22px; font-weight:bold; color:#3a3a55; margin:6px 0 14px; line-height:1.35;
    display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
  }
  .speak-btn{
    background:var(--amarelo); border:none; border-radius:50%; width:54px; height:54px;
    font-size:28px; cursor:pointer; box-shadow:0 4px 0 #d9a800; flex:0 0 auto;
  }
  .speak-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #d9a800;}
  .speak-btn.playing{animation:pulse .7s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}

  .stage{
    min-height:120px; display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:10px; margin:10px auto 18px; padding:16px;
    background:linear-gradient(160deg,#fff8ee,#eef7ff); border-radius:22px; border:4px dashed #f3d2a6;
    flex-direction:column;
  }
  .obj{font-size:74px; animation:pop .35s ease; line-height:1;}
  @keyframes pop{0%{transform:scale(0);}70%{transform:scale(1.25);}100%{transform:scale(1);}}
  .cardtxt{font-size:19px; font-weight:bold; color:#5a7a5f; margin-top:4px; line-height:1.3; max-width:430px;}

  .seqslots{display:flex; flex-direction:column; gap:8px; align-items:stretch; max-width:520px; margin:0 auto;}
  .seqslot{
    min-height:52px; border:4px dashed #bfe0c6; border-radius:16px; background:#f7fff9;
    display:flex; align-items:center; gap:10px; padding:8px 12px; font-size:16px; font-weight:bold; color:#8aa593;
  }
  .seqslot .nn{background:var(--verde); color:#fff; border-radius:50%; width:32px; height:32px; flex:0 0 auto;
               display:flex; align-items:center; justify-content:center; font-size:18px;}
  .seqslot.filled{border-style:solid; border-color:var(--verde); background:#eefaf0; color:#2c5c38;}
  .fichas{display:flex; flex-direction:column; gap:10px; margin-top:14px;}
  .ficha{
    border:none; border-radius:18px; padding:13px 14px; font-size:17px; font-weight:bold; text-align:left;
    background:var(--azul); color:#fff; box-shadow:0 5px 0 #2f6fd0; cursor:pointer; line-height:1.25;
  }
  .ficha:active{transform:translateY(3px); box-shadow:0 2px 0 #2f6fd0;}
  .ficha.used{background:#cfcfe0; box-shadow:0 5px 0 #a0a0c0; opacity:.55; cursor:default;}
  .ficha.shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}

  .options{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
  .opt{
    border:none; border-radius:22px; padding:16px 10px; font-size:23px; font-weight:bold;
    cursor:pointer; background:var(--azul); color:#fff; box-shadow:0 6px 0 #2f6fd0;
    min-height:80px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    overflow-wrap:break-word; line-height:1.15;
  }
  .opt .cap{font-size:17px; font-weight:bold;}
  .opt:active{transform:translateY(3px); box-shadow:0 3px 0 #2f6fd0;}
  .opt.big{font-size:40px;}
  .opt.ok{background:var(--verde)!important; box-shadow:0 6px 0 #3f9c4f!important; animation:tada .5s;}
  .opt.no{background:#cfcfe0!important; box-shadow:0 6px 0 #a0a0c0!important; opacity:.7;}
  @keyframes tada{0%{transform:scale(1);}30%{transform:scale(1.18) rotate(-4deg);}60%{transform:scale(1.1) rotate(4deg);}100%{transform:scale(1);}}

  .opt-colors .opt{font-size:19px;}
  .opt-colors .opt:nth-child(1){background:var(--rosa); box-shadow:0 6px 0 #d44d7c;}
  .opt-colors .opt:nth-child(2){background:var(--azul); box-shadow:0 6px 0 #2f6fd0;}
  .opt-colors .opt:nth-child(3){background:var(--laranja); box-shadow:0 6px 0 #d96d2e;}
  .opt-colors .opt:nth-child(4){background:var(--roxo); box-shadow:0 6px 0 #7a4db0;}

  .feedback{font-size:25px; font-weight:bold; min-height:40px; margin-top:12px;}
  .feedback.good{color:var(--verde);} .feedback.bad{color:var(--laranja);}

  .next-btn{
    margin-top:14px; background:var(--verde); color:#fff; border:none; border-radius:22px;
    font-size:24px; font-weight:bold; padding:14px 34px; cursor:pointer; box-shadow:0 6px 0 #3f9c4f;
  }
  .next-btn:active{transform:translateY(3px); box-shadow:0 3px 0 #3f9c4f;}

  #splash{
    position:fixed; inset:0; background:linear-gradient(160deg,#ff924c,#a06cd5);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; z-index:50; cursor:pointer; padding:20px;
  }
  #splash h1{font-size:34px; margin:10px;}
  #splash .play{
    margin-top:24px; background:var(--amarelo); color:#5a4500; border:none; border-radius:30px;
    font-size:30px; font-weight:bold; padding:18px 44px; box-shadow:0 8px 0 #d9a800; cursor:pointer;
  }
  #splash .caps{font-size:14px; text-transform:uppercase; letter-spacing:1px; opacity:.85; margin-top:8px;}

  #confetti{position:fixed; inset:0; pointer-events:none; z-index:40;}
  .win{text-align:center; padding:20px;}
  .win .trophy{font-size:90px; animation:tada 1s;}

  /* ---- deste módulo ---- */

  /* Dinheiro: o adesivo não tem número (o gerador de imagem erra números),
     então o valor de cada nota/moeda é escrito por cima, em HTML/CSS. */
  .cf-peca, .cf-peca-dentro{position:relative;}
  .cf-peca::after, .cf-peca-dentro::after{
    position:absolute; left:50%; bottom:4px; transform:translateX(-50%);
    background:#fff; color:#24324f; font:bold 20px/1 "Trebuchet MS",Arial,sans-serif;
    padding:4px 8px; border-radius:12px; border:3px solid #24324f; white-space:nowrap; pointer-events:none;
  }
  .cf-peca-dentro::after{font-size:12px; padding:2px 4px; border-width:2px; bottom:0;}
  .cf-peca:has(img[src$="/ced20.webp"])::after, .cf-peca-dentro:has(img[src$="/ced20.webp"])::after{content:"R$ 20";}
  .cf-peca:has(img[src$="/ced10.webp"])::after, .cf-peca-dentro:has(img[src$="/ced10.webp"])::after{content:"R$ 10";}
  .cf-peca:has(img[src$="/ced5.webp"])::after,  .cf-peca-dentro:has(img[src$="/ced5.webp"])::after{content:"R$ 5";}
  .cf-peca:has(img[src$="/ced2.webp"])::after,  .cf-peca-dentro:has(img[src$="/ced2.webp"])::after{content:"R$ 2";}
  .cf-peca:has(img[src$="/moeda1.webp"])::after,.cf-peca-dentro:has(img[src$="/moeda1.webp"])::after{content:"R$ 1";}

  /* Cantina: o valor a pagar não aparece — a criança soma os preços. */
  .game:has(.sem-meta) .cf-meta{display:none;}
  .lanches{display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap; width:100%;}
  .lanche{display:inline-flex; flex-direction:column; align-items:center; gap:2px;}
  .lanche .fig{width:84px; height:84px;}
  .lanche b, .preco{background:#fff7d1; border:3px solid #f0d67a; border-radius:12px; padding:2px 8px; font-size:20px;}
  .mais{font-size:34px; color:var(--laranja);}
  .pago{display:block; width:100%; font-size:19px; margin-top:4px;}

  /* Contorno: a figura se desenha e uma bolinha caminha pela borda. */
  .forma{max-width:100%; height:auto; overflow:visible;}
  .forma .traco{stroke-dasharray:100; stroke-dashoffset:100; animation:desenha 1.8s ease forwards;}
  @keyframes desenha{to{stroke-dashoffset:0;}}
  .forma text{font:bold 28px "Trebuchet MS",Arial,sans-serif; fill:#3a3a55; paint-order:stroke; stroke:#fff; stroke-width:6px;}
  .forma-nome{font-size:18px; color:#7a6a55; margin:0;}

  .numgrande{display:inline-block; font-size:40px; background:#eef5ff; border:4px solid #c9dcff; border-radius:18px; padding:0 14px; color:var(--roxo);}

  @media(max-width:480px){
    .hero h1{font-size:25px;} .question{font-size:19px;} .card{font-size:16px;}
    .obj{font-size:60px;} .cardtxt{font-size:17px;}
    .opt{font-size:20px;} .opt .cap{font-size:15px;} .ficha{font-size:15px;}
    .opt.big{font-size:36px;}
    .lanche .fig{width:72px; height:72px;}
  }
</style>

<script src="../motor/interacoes.js"></script>
</head>
<body>

<div id="splash">
  <div class="big"><img src="images/mascote.webp" alt="" style="width:170px;height:170px" class="flutua"></div>
  <h1>Matemática<br>Avaliação Final!</h1>
  <p style="font-size:19px;max-width:360px;">Dinheiro, medidas, formas e números.<br>Vamos brincar e revisar!</p>
  <div class="caps">Cap. 5 · 6 · 7 · 8</div>
  <button class="play" id="startBtn">▶ COMEÇAR</button>
</div>

<canvas id="confetti"></canvas>
<div id="app"></div>

<script>
/* ============================================================

   Cap. 5 Nosso dinheiro · Cap. 6 Medidas de comprimento
   Cap. 7 A matemática no supermercado
   Cap. 8 A cada medida um novo aprendizado

   Jogos com as mecânicas de motor/interacoes.js (cofre, ligar,
   classificar, memória, mascote, ordenar, cena) e um de pergunta
   e alternativa (contorno). Valores iguais aos da versão anterior
   do módulo: notas de 2, 5, 10 e 20 e moeda de 1 real; lanches da
   cantina de 1 a 9 reais e troco de 20; barras de 10 e cubinhos
   até 42; sequências de 1 em 1, 2 em 2, 5 em 5; vizinhos de 39,
   50 e 77.
   ============================================================ */

const App = document.getElementById('app');
let stars = parseInt(localStorage.getItem('vitor_matfinal_stars')||'0',10);

/* ============================================================
   VOCABULÁRIO DE VOZ (chave -> texto falado).

const VOICE = {

  /* ===== 1. NOSSO DINHEIRO (cofre) ===== */

  sg_q2:"Agora com mais cartas! Encontre cada objeto com o sólido parecido.",
  ob_lata:"a lata de óleo",

  sg_paralelepipedo:"o paralelepípedo",

/* ============================================================
   PLAYER DE ÁUDIO (clipes em sequência)
   ============================================================ */
const AUDIO_DIR='audio/', AUDIO_EXT='.mp3';
const player=new Audio();
player.preload='auto';
let playToken=0, audioOn=true;
function stopAudio(){ playToken++; try{player.pause();}catch(e){} setPlayingBadge(false); }
function playKeys(keys){
  if(!audioOn) return;
  stopAudio();
  const list=[].concat(...keys.map(k=>Array.isArray(k)?k:[k])).filter(Boolean);
  if(!list.length) return;
  const my=playToken; let i=0;
  setPlayingBadge(true);
  const next=()=>{
    if(my!==playToken) return;
    if(i>=list.length){ setPlayingBadge(false); return; }
    const key=list[i++];
    player.src=AUDIO_DIR+key+AUDIO_EXT;
    player.onended=next;
    player.onerror=()=>{ setTimeout(next,10); };
    const p=player.play();
    if(p&&p.catch) p.catch(()=>setTimeout(next,10));
  };
  next();
}
function setPlayingBadge(on){
  const b=document.getElementById('qspeak'); if(b) b.classList.toggle('playing',on);
}
function unlockAudio(depois){
  const pronto=()=>{ player.muted=false; if(depois){ const f=depois; depois=null; f(); } };
  try{ player.muted=true; player.src=AUDIO_DIR+'greet'+AUDIO_EXT;
       const p=player.play();
       if(p&&p.then) p.then(()=>{player.pause();player.currentTime=0;pronto();}).catch(pronto);
       else { player.pause(); pronto(); }
       setTimeout(pronto,1200);
  }catch(e){ pronto(); }
}

/* ===== SONS DE EFEITO (Web Audio) ===== */
let actx=null;
function initAudio(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }
function tone(freq,start,dur,type='sine',vol=0.2){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
  const t=actx.currentTime+start;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.start(t); o.stop(t+dur);
}

function rint(min,max){return Math.floor(Math.random()*(max-min+1))+min;}

function loopConf(){
  cx.clearRect(0,0,cv.width,cv.height);
  confs.forEach(p=>{p.vy+=0.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s);cx.restore();});
  confs=confs.filter(p=>p.y<cv.height+30);
  requestAnimationFrame(loopConf);
}

function renderRound(){
  locked=false;

  if(r.mode==='seq'){ return renderSeq(c,r); }

  if(locked) return;
  if(opt.correct){
    btn.classList.add('ok');
    document.querySelectorAll('.opt').forEach(b=>{if(b!==btn)b.classList.add('no');});
    correctFlow([opt.aud, pick(OK_KEYS), opt.expAud]);

    btn.classList.add('no'); btn.onclick=null;
    sndWrong();
    const fb=document.getElementById('fb'); fb.className='feedback bad'; fb.textContent='🤔 Tenta de novo!';
    playKeys([opt.aud, pick(NO_KEYS)].filter(Boolean));

function renderSeq(c,r){
  seqPos=0;
  const slots=r.itens.map((_,i)=>`<div class="seqslot" id="sl${i}"><span class="nn">${i+1}</span><span class="tx">...</span></div>`).join('');
  gameFrame(c,r,`

    <div class="fichas" id="fichas"></div>
  `);
  const box=document.getElementById('fichas');
  shuffle(r.itens.map((it,i)=>({it,i}))).forEach(t=>{
    const b=document.createElement('button');
    b.className='ficha'; b.textContent=t.it.txt;
    b.onclick=()=>tapFicha(b,t.i,r);
    box.appendChild(b);
  });
  window._roundKeys=[].concat(r.audio||[]);
  setTimeout(()=>speakRound(),400);
}
function tapFicha(btn,idx,r){
  if(locked) return;
  if(idx===seqPos){
    const sl=document.getElementById('sl'+seqPos);
    sl.querySelector('.tx').textContent=r.itens[idx].txt;
    sl.classList.add('filled');
    btn.classList.add('used'); btn.onclick=null;
    sndClick(); playKeys([r.itens[idx].aud]);
    seqPos++;
    if(seqPos>=r.itens.length){
      setTimeout(()=>correctFlow([pick(OK_KEYS), r.expAud]),600);
    }
  }else{
    sndWrong();
    btn.classList.add('shake'); setTimeout(()=>btn.classList.remove('shake'),420);
    const fb=document.getElementById('fb'); fb.className='feedback bad'; fb.textContent='🤔 Esse não é o próximo!';
    playKeys([r.itens[idx].aud, pick(NO_KEYS)]);
  }
}

/** Quadrado ou retângulo com a medida de cada lado; a figura se desenha e
    uma bolinha dá a volta pela borda, como o dedo contornando. */
function forma(a, b, cor){
  const u = 22, w = a*u, h = b*u, x = 40, y = 44, W = w+80, H = h+88;
  const d = `M${x} ${y} h${w} v${h} h${-w} Z`;
  return `<svg class="forma" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
    <path d="${d}" fill="${cor}22" stroke="${cor}" stroke-width="7" stroke-linejoin="round" class="traco" pathLength="100"/>
    <circle r="11" fill="#ff924c" stroke="#fff" stroke-width="3"><animateMotion dur="5s" begin="1.8s" repeatCount="indefinite" path="${d}"/></circle>
    <text x="${x+w/2}" y="${y-14}" text-anchor="middle">${a}</text>
    <text x="${x+w/2}" y="${y+h+36}" text-anchor="middle">${a}</text>
    <text x="${x-18}" y="${y+h/2+10}" text-anchor="middle">${b}</text>
    <text x="${x+w+18}" y="${y+h/2+10}" text-anchor="middle">${b}</text>
  </svg>`;
}
const num = n => ({img:'num'+n, aud:'n'+n});

/* ============================================================
   CONSTRUTORES DE RODADAS — 3 por jogo, do mais fácil ao mais difícil.
   ============================================================ */
const BUILDERS={
  /* 1. NOSSO DINHEIRO — juntar o valor com notas e moedas */
  dinheiro(){ return [
    {mode:'cofre', q:'Coloque <b>R$ 17</b> no cofrinho!', audio:['d_q1'], expAud:'d_exp1',
     alvo:17, prefixo:'R$', alvoImg:'cofrinho', pecas:notas(10,5,1)},
    {mode:'cofre', q:'Troca: <b>R$ 20</b> sem usar a nota de 20!', audio:['d_q2'], expAud:'d_exp2',
     alvo:20, prefixo:'R$', alvoImg:'cofrinho', pecas:notas(10,5,2,1)},
    {mode:'cofre', q:'Coloque <b>R$ 25</b> no cofrinho!', audio:['d_q3'], expAud:'d_exp3',
     alvo:25, prefixo:'R$', alvoImg:'cofrinho', pecas:notas(20,10,5,2,1)},
  ];},

  /* 2. NA CANTINA — pagar dois lanches somando os preços; depois, o troco */
  cantina(){ return [
    {mode:'cofre', q:lanches([['suco',3],['maca',2]]), audio:['ct_q1'], expAud:'ct_exp1',
     alvo:5, prefixo:'R$', pecas:notas(5,2,1)},
    {mode:'cofre', q:lanches([['sanduiche',9],['suco',3]]), audio:['ct_q2'], expAud:'ct_exp2',
     alvo:12, prefixo:'R$', pecas:notas(10,5,2,1)},
    {mode:'cofre', q:lanches([['pipoca',3],['bolo',6]], '<span class="pago">Pagou com <span class="preco">R$ 20</span>. Qual é o troco?</span>'),
     audio:['ct_q3'], expAud:'ct_exp3', alvo:11, prefixo:'R$', pecas:notas(10,5,2,1)},
  ];},

  /* 3. MEDIR — instrumento ↔ o que mede; mais ou menos de 1 metro */
  instrumentos(){
    const I = {regua:{img:'regua',aud:'in_regua'}, fita:{img:'fita',aud:'in_fita'},
               trena:{img:'trena',aud:'in_trena'}, balanca:{img:'balanca',aud:'in_balanca'}};
    return [
      {mode:'ligar', q:'Ligue cada instrumento ao que ele mede', audio:['im_q1'], expAud:'im_exp1', pares:[
        {a:I.regua, b:{img:'lapis', aud:'ob_lapis'}},
        {a:I.fita,  b:{img:'cintura', aud:'ob_cintura'}},
        {a:I.trena, b:{img:'porta', aud:'ob_porta'}},
      ]},
      {mode:'ligar', q:'Agora são quatro!', audio:['im_q2'], expAud:'im_exp2', pares:[
        {a:I.regua,   b:{img:'caderno', aud:'ob_caderno'}},
        {a:I.fita,    b:{img:'cintura', aud:'ob_cintura'}},
        {a:I.trena,   b:{img:'parede', aud:'ob_parede'}},
        {a:I.balanca, b:{img:'arroz', aud:'ob_arroz'}},
      ]},
      {mode:'classificar', q:'Menos ou mais de <b>1 metro</b>?', audio:['im_q3'], expAud:'im_exp3',
       grupos:[{id:'menos', img:'g_menos', aud:'me_menos'}, {id:'mais', img:'g_mais', aud:'me_mais'}],
       itens:[
         {img:'borracha', aud:'ob_borracha', grupo:'menos'}, {img:'caderno', aud:'ob_caderno', grupo:'menos'},
         {img:'caneta', aud:'ob_caneta', grupo:'menos'}, {img:'porta', aud:'ob_porta2', grupo:'mais'},
         {img:'quadro', aud:'ob_quadro', grupo:'mais'}, {img:'geladeira', aud:'ob_geladeira', grupo:'mais'},
       ]},
    ];
  },

  /* 4. CONTORNO — somar todos os lados (pergunta e alternativa, com a figura desenhada) */
  contorno(){
    const F = {
      q5:  {a:5,  b:5, cor:'#3466a5', nome:'Quadrado',  aud:'co_quad', total:20, erradas:[10,15,25]},
      r84: {a:8,  b:4, cor:'#d96d2e', nome:'Retângulo', aud:'co_ret',  total:24, erradas:[12,20,32]},
      r103:{a:10, b:3, cor:'#3f9c4f', nome:'Retângulo', aud:'co_ret',  total:26, erradas:[13,23,30]},
      q7:  {a:7,  b:7, cor:'#7a4db0', nome:'Quadrado',  aud:'co_quad', total:28, erradas:[14,21,35]},
    };
    const rodada = f => ({
      q:'Qual é o <b>contorno</b>? Some todos os lados.', audio:['co_q', f.aud],
      stage: forma(f.a, f.b, f.cor) + `<p class="forma-nome">${f.nome}</p>`,
      options: shuffle([f.total, ...f.erradas]).map(v => ({label:String(v), aud:'n'+v, big:true,
        correct: v===f.total, expAud: v===f.total ? 'co_exp'+f.total : undefined})),
    });
    return [rodada(F.q5), rodada(pick([F.r84, F.r103])), rodada(F.q7)];
  },

  /* 5. BARRAS E CUBINHOS — montar o número com dezenas e unidades */
  composicao(){
    const pecas = [{img:'barra', aud:'pc_barra', valor:10}, {img:'cubinho', aud:'pc_cubo', valor:1}];
    const rodada = n => ({mode:'cofre', q:`Monte o número <b>${n}</b>`, audio:['cp_monte','n'+n,'cp_dica'],
      expAud:'cp_exp'+n, alvo:n, pecas});
    return [rodada(14), rodada(pick([20,27])), rodada(pick([35,42]))];
  },

  /* 6. SÓLIDOS — objeto ↔ sólido parecido; o que rola para todos os lados */
  solidos(){
    const P = {
      lata:  {a:{img:'lata', aud:'ob_lata'},    b:{img:'cilindro', aud:'sg_cilindro'}},
      bola:  {a:{img:'bola', aud:'ob_bola'},    b:{img:'esfera', aud:'sg_esfera'}},
      leite: {a:{img:'leite', aud:'ob_leite'},  b:{img:'paralelepipedo', aud:'sg_paralelepipedo'}},
      chapeu:{a:{img:'chapeu', aud:'ob_chapeu'},b:{img:'cone', aud:'sg_cone'}},
      dado:  {a:{img:'dado', aud:'ob_dado'},    b:{img:'cubo', aud:'sg_cubo'}},
    };
    return [
      {mode:'memoria', q:'Ache o objeto e o sólido parecido!', audio:['sg_q1'], expAud:'sg_exp1',
       pares:[P.lata, P.bola, P.leite]},
      {mode:'memoria', q:'Agora com mais cartas!', audio:['sg_q2'], expAud:'sg_exp2',
       pares:[P.lata, P.bola, P.leite, P.chapeu, P.dado]},
      {mode:'mascote', q:'Dê ao Bolota o que <b>rola para todos os lados</b>!', audio:['sg_q3'], expAud:'sg_exp3',
       mascote:'mascote', itens:[
         {img:'esfera', aud:'ro_esfera', certo:true}, {img:'bola', aud:'ro_bola', certo:true},
         {img:'cilindro', aud:'ro_cilindro', certo:false}, {img:'lata', aud:'ro_lata', certo:false},
         {img:'cubo', aud:'ro_cubo', certo:false}, {img:'leite', aud:'ro_leite', certo:false},
       ]},
    ];
  },

  /* 7. SEQUÊNCIAS — pôr em ordem; antecessor e sucessor */
  sequencias(){
    const seq2 = [2,4,6,8,10], dec = [20,19,18,17,16], seq5 = [10,15,20,25,30];
    const meio = pick([
      {q:'Do <b>maior</b> para o <b>menor</b>!', audio:['sq_q2a'], expAud:'sq_exp2a', itens:dec.map(num)},
      {q:'De <b>5 em 5</b>, do menor para o maior!', audio:['sq_q2b'], expAud:'sq_exp2b', itens:seq5.map(num)},
    ]);
    const n = pick([39, 50, 77]);
    const vizinhos = {39:[38,40,37,41,49], 50:[49,51,48,52,60], 77:[76,78,75,79,87]}[n];
    return [
      {mode:'ordenar', q:'De <b>2 em 2</b>, do menor para o maior!', audio:['sq_q1'], expAud:'sq_exp1', itens:seq2.map(num)},
      {mode:'ordenar', ...meio},
      {mode:'mascote', q:`Os vizinhos do <span class="numgrande">${n}</span>`, audio:['sq_viz','n'+n,'sq_viz2'],
       expAud:'sq_exp'+n, mascote:'mascote',
       itens:vizinhos.map((v,i) => ({...num(v), certo:i<2}))},
    ];
  },

  /* 8. MASSA E CAPACIDADE — ler a balança; quilograma ou litro */
  massa(){
    // A balança do cenário pende para a esquerda: o pacote do prato esquerdo é o mais pesado.
    // A cor de cada lado é sorteada para a criança olhar a balança, não decorar a cor.
    const PRATO_BAIXO = {x:14.5, y:24, w:24}, PRATO_ALTO = {x:60, y:3, w:24};
    const pac = c => ({img:'pacote_'+c, aud:'pk_'+c});
    const [pesado, leve] = shuffle(['vermelho','azul']);
    const [pesado2, leve2] = shuffle(['vermelho','azul']);
    return [
      {mode:'cena', q:'Toque no pacote <b>mais pesado</b>!', audio:['mc_q1'], expAud:'mc_exp1', fundo:'balanca_cena',
       objetos:[{...pac(pesado), certo:true, ...PRATO_BAIXO}, {...pac(leve), certo:false, ...PRATO_ALTO}]},
      {mode:'cena', q:'Toque no pacote <b>mais leve</b>!', audio:['mc_q2'], expAud:'mc_exp2', fundo:'balanca_cena',
       objetos:[{...pac(pesado2), certo:false, ...PRATO_BAIXO}, {...pac(leve2), certo:true, ...PRATO_ALTO}]},
      {mode:'classificar', q:'Quilograma ou litro?', audio:['mc_q3'], expAud:'mc_exp3',
       grupos:[{id:'kg', img:'balanca', aud:'g_kg'}, {id:'l', img:'jarra', aud:'g_litro'}],
       itens:[
         {img:'arroz', aud:'ob_arroz', grupo:'kg'}, {img:'feijao', aud:'mc_feijao', grupo:'kg'},
         {img:'melancia', aud:'mc_melancia', grupo:'kg'}, {img:'agua', aud:'mc_agua', grupo:'l'},
         {img:'leite', aud:'ob_leite', grupo:'l'}, {img:'garrafa_suco', aud:'mc_suco', grupo:'l'},
       ]},
    ];
  },
};

  unlockAudio(()=>goHome());
  document.getElementById('splash').style.display='none';
});
</script>
