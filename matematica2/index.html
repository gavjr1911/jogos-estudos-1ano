<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎲 Matemática Divertida 2 🎲</title>
<style>
  :root{
    --rosa:#ff6b9d; --roxo:#a06cd5; --azul:#4d96ff; --verde:#6bcB77;
    --amarelo:#ffd93d; --laranja:#ff924c; --vermelho:#ff5e5e; --ceu:#b8e3ff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    font-family:'Comic Sans MS','Baloo',"Trebuchet MS",sans-serif;
    background:linear-gradient(160deg,#ffe9c7 0%,#d7e6ff 50%,#d8ffe3 100%);
    color:#3a3a55; overflow-x:hidden; user-select:none;
    min-height:100%; touch-action:manipulation;
  }
  #app{max-width:760px; margin:0 auto; padding:14px; min-height:100vh;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; border-radius:22px; padding:8px 14px; margin-bottom:14px;
    box-shadow:0 6px 0 rgba(0,0,0,.08);
  }
  .topbar .home-btn{
    background:var(--azul); color:#fff; border:none; border-radius:16px;
    font-size:22px; padding:8px 14px; font-weight:bold; cursor:pointer; box-shadow:0 4px 0 #2f6fd0;
  }
  .topbar .home-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #2f6fd0;}
  .topbar .nav{display:flex; align-items:center; gap:8px;}
  .topbar .back-btn{
    background:var(--roxo); color:#fff; border:none; border-radius:16px;
    font-size:22px; padding:8px 14px; font-weight:bold; cursor:pointer;
    box-shadow:0 4px 0 #7d49b0; text-decoration:none; display:inline-block; line-height:1;
  }
  .topbar .back-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #7d49b0;}
  .stars{font-size:24px; font-weight:bold; color:var(--laranja); display:flex; align-items:center; gap:6px;}
  .stars .num{background:var(--amarelo); border-radius:14px; padding:2px 12px; box-shadow:0 3px 0 #d9a800;}

  .hero{
    text-align:center; background:#fff; border-radius:30px; padding:22px 18px;
    box-shadow:0 8px 0 rgba(0,0,0,.08); margin-bottom:18px;
  }
  .hero h1{font-size:32px; margin:6px 0; color:var(--laranja); line-height:1.2;}
  .hero p{font-size:18px; margin:4px 0; color:#666;}
  .mascote{font-size:78px; display:inline-block; animation:flutua 2.5s ease-in-out infinite;}
  @keyframes flutua{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-14px) rotate(3deg);}}

  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
  .card{
    border:none; border-radius:26px; padding:16px 10px; cursor:pointer;
    color:#fff; font-size:19px; font-weight:bold; text-align:center;
    box-shadow:0 7px 0 rgba(0,0,0,.18); transition:transform .08s;
    display:flex; flex-direction:column; align-items:center; gap:6px; line-height:1.15;
  }
  .card:active{transform:translateY(4px); box-shadow:0 3px 0 rgba(0,0,0,.18);}
  .card .ico{font-size:46px;}
  .c1{background:var(--rosa);} .c2{background:var(--azul);} .c3{background:var(--verde);}
  .c4{background:var(--laranja);} .c5{background:var(--roxo);} .c6{background:var(--vermelho);}
  .c7{background:#19c3b1;} .c8{background:#f76eb0;} .c9{background:#7c83ff;}

  .game{
    background:#fff; border-radius:30px; padding:18px; box-shadow:0 8px 0 rgba(0,0,0,.08);
    text-align:center;
  }
  .game-title{font-size:24px; color:var(--laranja); margin:0 0 4px;}
  .progress{font-size:16px; color:#999; margin-bottom:10px;}
  .question{
    font-size:23px; font-weight:bold; color:#3a3a55; margin:6px 0 14px; line-height:1.3;
    display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
  }
  .speak-btn{
    background:var(--amarelo); border:none; border-radius:50%; width:54px; height:54px;
    font-size:28px; cursor:pointer; box-shadow:0 4px 0 #d9a800; flex:0 0 auto;
  }
  .speak-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #d9a800;}
  .speak-btn.playing{animation:pulse .7s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}

  .stage{
    min-height:120px; display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:10px; margin:10px auto 18px; padding:16px;
    background:linear-gradient(160deg,#fff8ec,#eef5ff); border-radius:22px; border:4px dashed #f3d9a8;
    flex-direction:column;
  }
  .obj{font-size:80px; animation:pop .35s ease; line-height:1;}
  @keyframes pop{0%{transform:scale(0);}70%{transform:scale(1.25);}100%{transform:scale(1);}}
  .stage .cardtxt{font-size:20px; font-weight:bold; color:#2f6fd0; margin-top:4px; line-height:1.3;}
  .stage .quote{font-size:21px; font-weight:bold; color:#a06cd5; font-style:italic; max-width:420px;}

  /* ---- palitos de picolé ---- */
  .sticks{display:flex; flex-wrap:wrap; gap:7px; justify-content:center; align-items:flex-end; max-width:430px;}
  .stick{width:15px; height:62px; border-radius:9px; box-shadow:0 3px 0 rgba(0,0,0,.12); animation:pop .35s ease;}
  .st-bege{background:linear-gradient(180deg,#ffe0a8,#f0b96a);}
  .st-verde{background:linear-gradient(180deg,#a8e88a,#67bd45);}
  .st-vermelho{background:linear-gradient(180deg,#ff9a9a,#e35555);}
  .st-off{opacity:.28; filter:grayscale(1);}
  .plus{font-size:40px; font-weight:bold; color:var(--laranja); align-self:center;}
  .grupo{display:flex; gap:16px; align-items:center; justify-content:center; flex-wrap:wrap;}
  .caixa{border:4px solid #ffc46b; border-radius:16px; padding:10px 12px; background:#fffdf6;}

  /* ---- bolinhas / agrupamento ---- */
  .dots{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; max-width:440px;}
  .pack{display:flex; gap:4px; padding:6px 8px; border:3px dashed #7bb8ff; border-radius:40px; background:#f3f8ff;}
  .dot{width:24px; height:24px; border-radius:50%; box-shadow:0 2px 0 rgba(0,0,0,.15); animation:pop .3s ease;}

  /* ---- ábaco ---- */
  .abaco{display:flex; flex-direction:column; align-items:center;}
  .hastes{display:flex; gap:34px; align-items:flex-end;}
  .haste{display:flex; flex-direction:column-reverse; align-items:center; justify-content:flex-start;
         width:40px; min-height:150px; border-left:5px solid #d8a05a; border-right:5px solid #d8a05a;
         border-radius:8px 8px 0 0; background:#fffaf0; padding-bottom:2px; gap:2px;}
  .bead{width:30px; height:14px; border-radius:50%; box-shadow:0 2px 0 rgba(0,0,0,.15); animation:pop .3s ease;}
  .bd-d{background:linear-gradient(180deg,#8fd4ff,#3f9bdd);} .bd-u{background:linear-gradient(180deg,#b6f0a0,#5cb741);}
  .base{display:flex; gap:34px; background:linear-gradient(180deg,#f5c877,#d19a45); border-radius:10px;
        padding:6px 0; margin-top:4px; box-shadow:0 4px 0 #b07c2e;}
  .base span{width:40px; text-align:center; font-size:24px; font-weight:bold; color:#5a3d10;}

  /* ---- gráfico de colunas (com malha, como no livro) ---- */
  .chartwrap{display:flex; gap:8px; align-items:flex-end; justify-content:center; overflow-x:auto; max-width:100%;}
  .yaxis{display:flex; flex-direction:column-reverse; justify-content:flex-start; gap:0;}
  .yaxis .yl{height:20px; font-size:12px; font-weight:bold; color:#7a7a95; display:flex; align-items:center; justify-content:flex-end; width:26px;}
  .chart{display:flex; gap:10px; align-items:flex-end; justify-content:center;}
  .bar{display:flex; flex-direction:column; align-items:center; gap:3px; width:64px;}
  .bar .col{display:flex; flex-direction:column-reverse; gap:0;}
  .bar .cell{width:34px; height:20px; border:1px solid #bcd8e6; background:#7fd3d0; animation:pop .3s ease;}
  .bar .lbl{font-size:24px; line-height:1;}
  .bar .nm{font-size:12px; font-weight:bold; color:#3a3a55; text-align:center; line-height:1.1;}
  .escala{font-size:14px; font-weight:bold; color:#d96d2e; margin-top:4px;}

  /* ---- tabela ---- */
  .tabela{border-collapse:collapse; font-size:18px; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 3px 0 rgba(0,0,0,.1);}
  .tabela th{background:#7fd3d0; color:#fff; padding:6px 14px; font-size:16px;}
  .tabela td{border:1px solid #d8e6ee; padding:6px 14px; text-align:center; font-weight:bold;}
  .tabela td.eq{color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.25);}

  .options{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(130px,1fr));}
  .opt{
    border:none; border-radius:22px; padding:16px 10px; font-size:24px; font-weight:bold;
    cursor:pointer; background:var(--azul); color:#fff; box-shadow:0 6px 0 #2f6fd0;
    min-height:80px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    word-break:break-word; line-height:1.15;
  }
  .opt .cap{font-size:18px;}
  .opt-colors .opt{font-size:20px;}
  .opt:active{transform:translateY(3px); box-shadow:0 3px 0 #2f6fd0;}
  .opt.big{font-size:44px;}
  .opt.ok{background:var(--verde)!important; box-shadow:0 6px 0 #3f9c4f!important; animation:tada .5s;}
  .opt.no{background:#cfcfe0!important; box-shadow:0 6px 0 #a0a0c0!important; opacity:.7;}
  @keyframes tada{0%{transform:scale(1);}30%{transform:scale(1.18) rotate(-4deg);}60%{transform:scale(1.1) rotate(4deg);}100%{transform:scale(1);}}

  .opt-colors .opt:nth-child(1){background:var(--rosa); box-shadow:0 6px 0 #d44d7c;}
  .opt-colors .opt:nth-child(2){background:var(--verde); box-shadow:0 6px 0 #3f9c4f;}
  .opt-colors .opt:nth-child(3){background:var(--laranja); box-shadow:0 6px 0 #d96d2e;}
  .opt-colors .opt:nth-child(4){background:var(--roxo); box-shadow:0 6px 0 #7a4db0;}

  .feedback{font-size:26px; font-weight:bold; min-height:40px; margin-top:12px;}
  .feedback.good{color:var(--verde);} .feedback.bad{color:var(--laranja);}

  .next-btn{
    margin-top:14px; background:var(--verde); color:#fff; border:none; border-radius:22px;
    font-size:24px; font-weight:bold; padding:14px 34px; cursor:pointer; box-shadow:0 6px 0 #3f9c4f;
  }
  .next-btn:active{transform:translateY(3px); box-shadow:0 3px 0 #3f9c4f;}

  #splash{
    position:fixed; inset:0; background:linear-gradient(160deg,var(--laranja),var(--azul));
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; z-index:50; cursor:pointer; padding:20px;
  }
  #splash h1{font-size:34px; margin:10px;}
  #splash .big{font-size:100px; animation:flutua 2.5s infinite;}
  #splash .play{
    margin-top:24px; background:var(--amarelo); color:#5a4500; border:none; border-radius:30px;
    font-size:30px; font-weight:bold; padding:18px 44px; box-shadow:0 8px 0 #d9a800; cursor:pointer;
  }

  #confetti{position:fixed; inset:0; pointer-events:none; z-index:40;}
  .win{text-align:center; padding:20px;}
  .win .trophy{font-size:90px; animation:tada 1s;}

  @media(max-width:480px){
    .hero h1{font-size:26px;} .question{font-size:20px;} .card{font-size:17px;}
    .obj{font-size:66px;} .stick{width:12px; height:52px;} .dot{width:20px;height:20px;}
    .bar{width:56px;} .bar .col{width:32px;}
  }
</style>
</head>
<body>

<div id="splash">
  <div class="big">🎲</div>
  <h1>Matemática<br>Divertida 2!</h1>
  <p style="font-size:20px;max-width:340px;">Vamos juntar, tirar, agrupar e ler gráficos para a prova! 🎉<br>Toque no botão para começar.</p>
  <button class="play" id="startBtn">▶ COMEÇAR</button>
</div>

<canvas id="confetti"></canvas>
<div id="app"></div>

<script>

   - narração por arquivos pré-gravados (pasta /audio) -> funciona
     em qualquer aparelho, online ou offline;
   - estrelas, confete, sons de efeito; tudo jogável sozinho.
   Conteúdos: ideias da ADIÇÃO (juntar e acrescentar); ideias da

/* ============================================================
   PLAYER DE ÁUDIO (clipes em sequência) — um único <audio>
   destravado no 1º toque (compatível com iPhone/iPad).
   ============================================================ */
const AUDIO_DIR='audio/', AUDIO_EXT='.mp3';
const player=new Audio();
player.preload='auto';
let playToken=0, audioOn=true;
function stopAudio(){ playToken++; try{player.pause();}catch(e){} setPlayingBadge(false); }
function playKeys(keys){
  if(!audioOn) return;
  stopAudio();
  const list=[].concat(...keys.map(k=>Array.isArray(k)?k:[k])).filter(Boolean);
  if(!list.length) return;
  const my=playToken; let i=0;
  setPlayingBadge(true);
  const next=()=>{
    if(my!==playToken) return;
    if(i>=list.length){ setPlayingBadge(false); return; }
    const key=list[i++];
    player.src=AUDIO_DIR+key+AUDIO_EXT;
    player.onended=next;
    player.onerror=()=>{ setTimeout(next,10); };
    const p=player.play();
    if(p&&p.catch) p.catch(()=>setTimeout(next,10));
  };
  next();
}
function setPlayingBadge(on){
  const b=document.getElementById('qspeak'); if(b) b.classList.toggle('playing',on);
}
function unlockAudio(){
  try{ player.muted=true; player.src=AUDIO_DIR+'greet'+AUDIO_EXT;
       const p=player.play();
       if(p&&p.then) p.then(()=>{player.pause();player.currentTime=0;player.muted=false;})
                      .catch(()=>{player.muted=false;});
       else {player.pause();player.muted=false;}
  }catch(e){ player.muted=false; }
}

/* ===== SONS DE EFEITO (Web Audio) ===== */
let actx=null;
function initAudio(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }
function tone(freq,start,dur,type='sine',vol=0.2){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
  const t=actx.currentTime+start;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.start(t); o.stop(t+dur);
}

function rint(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}

  confs=confs.filter(p=>p.y<cv.height+30);

}

/* gráfico de colunas com MALHA: cada quadradinho vale `escala` (1 ou 2),
   como no livro. O valor NÃO aparece escrito — a criança conta os quadradinhos. */
function chart(dados, escala){
  escala=escala||1;
  const max=Math.max(...dados.map(d=>d.v));
  const linhas=Math.ceil(max/escala);
  let eixo='';
  for(let i=1;i<=linhas;i++) eixo+='<div class="yl">'+(i*escala)+'</div>';
  const cols=dados.map(d=>{
    let cells='';
    for(let i=0;i<Math.round(d.v/escala);i++) cells+='<div class="cell"></div>';
    return '<div class="bar"><div class="col">'+cells+'</div><div class="lbl">'+d.e+'</div><div class="nm">'+d.nome+'</div></div>';
  }).join('');
  return '<div class="chartwrap"><div class="yaxis">'+eixo+'</div><div class="chart">'+cols+'</div></div>'+
         (escala>1?'<div class="escala">🔎 cada quadradinho vale '+escala+'</div>':'');
}
function tabela(titulo, cabecalho, linhas){
  return '<table class="tabela"><tr><th colspan="2">'+titulo+'</th></tr>'+
    '<tr><th>'+cabecalho[0]+'</th><th>'+cabecalho[1]+'</th></tr>'+
    linhas.map(l=>'<tr><td class="eq" style="background:'+l.cor+'">'+l.nome+'</td><td>'+l.v+'</td></tr>').join('')+
    '</table>';
}

/* opções numéricas: a resposta certa + distratores.
   step: distância dos distratores (5 para contagem de 5 em 5)
   extras: distratores específicos (ex.: número com os algarismos trocados) */
function numOpts(correct, o){
  o=o||{};
  const qtd=o.qtd||4, step=o.step||1;
  const set=new Set([correct]);
  (o.extras||[]).forEach(v=>{ if(v>=0&&v<=40&&set.size<qtd) set.add(v); });
  let d=1;
  while(set.size<qtd && d<=12){
    [correct-d*step, correct+d*step].forEach(c=>{ if(set.size<qtd && c>=0 && c<=40) set.add(c); });
    d++;
  }
  return shuffle([...set]).map(v=>({
    label:String(v), big:true, aud:numKey(v), correct:v===correct,
    expAud: (v===correct && o.expAud) ? o.expAud : null
  }));
}
/* opções a partir de um mapa de rótulos */
function mkOpts(correct, all, lblMap, extra){
  return shuffle(all).map(k=>{
    const o={label:lblMap[k], aud:k, correct:k===correct};
    if(extra) Object.assign(o, extra(k));
    return o;
  });
}
/* CONCORDÂNCIA: "duas crianças" (feminino) e "um palito" (singular).
   UN mapeia o substantivo no plural -> singular + gênero. */
const UN={
  s_palitos:{s:'s_palito',  fem:false},
  s_criancas:{s:'s_crianca', fem:true},
  s_gols:{s:'s_gol',        fem:false},
  s_pompons:{s:'s_pompom',  fem:false},
  s_objetos:{s:'s_objeto',  fem:false},
};
/* número concordando com o gênero do substantivo que vem depois */
function numFem(v){ return v===1?'f1':(v===2?'f2':numKey(v)); }
function numFor(v,un){ return (UN[un]&&UN[un].fem)?numFem(v):numKey(v); }
/* substantivo no singular quando a quantidade é 1 */
function unFor(v,un){ return v===1?UN[un].s:un; }
/* sentença numérica falada depois do acerto (como no livro:
   "4 palitos mais 6 palitos é igual a 10 palitos") */
function sentAdd(a,b,t,un){ return [numFor(a,un),unFor(a,un),'s_mais',numFor(b,un),unFor(b,un),'s_igual',numFor(t,un),unFor(t,un)]; }
function sentSub(a,b,t,un){ return [numFor(a,un),unFor(a,un),'s_menos',numFor(b,un),unFor(b,un),'s_igual',numFor(t,un),unFor(t,un)]; }
/* monta a partida: garante que as perguntas conceituais apareçam */
function mix(numericas, conceituais, total){
  total=total||7;
  const c=shuffle(conceituais).slice(0,Math.min(conceituais.length,total-1));
  return shuffle(shuffle(numericas).slice(0,total-c.length).concat(c));
}

        audio:['tb_coluna'], stage:TAB_COLECOES, colorOpts:true,
        options:mkOpts('li_coluna',['li_coluna','li_linha','li_grafico'],{
          li_coluna:'⬇️<span class="cap">A coluna</span>', li_linha:'➡️<span class="cap">A linha</span>', li_grafico:'📊<span class="cap">O gráfico</span>'}) },
    ];
    return mix(nums,shuffle(conc).slice(0,2));
  },

  /* 8. CERTEZA OU IMPOSSÍVEL? (probabilidade) */
  chances(){
    return shuffle(CHANCES).slice(0,7).map(it=>({
      q:it.txt+'<br><span style="color:#ff924c">Isso acontece <b>com certeza</b>, <b>é possível</b> ou <b>é impossível</b>?</span> 🤔',
      audio:[it.k,'pr_q'],
      stage:emo(it.e,74),
      colorOpts:true,
      options:mkOpts(it.r,['ce_certeza','ce_possivel','ce_impossivel'],CE_LBL,
        k=>({expAud: k===it.r?CE_EXP[k]:null}))
    }));
  },
};

/* ===== SPLASH -> INÍCIO ===== */
function enterApp(){
  initAudio();
  unlockAudio();
  document.getElementById('splash').style.display='none';
  goHome(true);
  setTimeout(()=>playKeys(['greet']),350);
}
document.getElementById('startBtn').addEventListener('click',enterApp);
document.getElementById('splash').addEventListener('click',e=>{ if(e.target.id!=='startBtn'){ enterApp(); } });
</script>
