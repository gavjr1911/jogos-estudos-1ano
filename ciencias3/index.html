<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ciências Novembro</title>
<style>
  :root{
    --rosa:#ff6b9d; --roxo:#a06cd5; --azul:#4d96ff; --verde:#6bcB77;
    --amarelo:#ffd93d; --laranja:#ff924c; --vermelho:#ff5e5e; --ceu:#b8e3ff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    font-family:'Comic Sans MS','Baloo',"Trebuchet MS",sans-serif;
    background:linear-gradient(160deg,#e8fbe9 0%,#dff3ff 50%,#f3ecff 100%);
    color:#3a3a55; overflow-x:hidden; user-select:none;
    min-height:100%; touch-action:manipulation;
  }
  #app{max-width:760px; margin:0 auto; padding:14px; min-height:100vh;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; border-radius:22px; padding:8px 14px; margin-bottom:14px;
    box-shadow:0 6px 0 rgba(0,0,0,.08);
  }
  .topbar .home-btn{
    background:var(--azul); color:#fff; border:none; border-radius:16px;
    font-size:22px; padding:8px 14px; font-weight:bold; cursor:pointer; box-shadow:0 4px 0 #2f6fd0;
  }
  .topbar .home-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #2f6fd0;}
  .topbar .nav{display:flex; align-items:center; gap:8px;}
  .topbar .back-btn{
    background:var(--roxo); color:#fff; border:none; border-radius:16px;
    font-size:22px; padding:8px 14px; font-weight:bold; cursor:pointer;
    box-shadow:0 4px 0 #7d49b0; text-decoration:none; display:inline-block; line-height:1;
  }
  .topbar .back-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #7d49b0;}
  .stars{font-size:24px; font-weight:bold; color:var(--laranja); display:flex; align-items:center; gap:6px;}
  .stars .num{background:var(--amarelo); border-radius:14px; padding:2px 12px; box-shadow:0 3px 0 #d9a800;}

  .hero{
    text-align:center; background:#fff; border-radius:30px; padding:22px 18px;
    box-shadow:0 8px 0 rgba(0,0,0,.08); margin-bottom:18px;
  }
  .hero h1{font-size:32px; margin:6px 0; color:var(--verde); line-height:1.2;}
  .hero p{font-size:18px; margin:4px 0; color:#666;}
  .mascote{font-size:78px; display:inline-block; animation:flutua 2.5s ease-in-out infinite;}
  @keyframes flutua{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-14px) rotate(3deg);}}

  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
  .card{
    border:none; border-radius:26px; padding:16px 10px; cursor:pointer;
    color:#fff; font-size:19px; font-weight:bold; text-align:center;
    box-shadow:0 7px 0 rgba(0,0,0,.18); transition:transform .08s;
    display:flex; flex-direction:column; align-items:center; gap:6px; line-height:1.15;
  }
  .card:active{transform:translateY(4px); box-shadow:0 3px 0 rgba(0,0,0,.18);}
  .card .ico{font-size:44px;}
  .c1{background:var(--laranja);} .c2{background:var(--azul);} .c3{background:var(--roxo);}
  .c4{background:var(--rosa);} .c5{background:var(--verde);} .c6{background:#19c3b1;}
  .c7{background:#b07d4b;} .c8{background:#3aa7e8;}

  .game{
    background:#fff; border-radius:30px; padding:18px; box-shadow:0 8px 0 rgba(0,0,0,.08);
    text-align:center;
  }
  .game-title{font-size:24px; color:var(--verde); margin:0 0 4px;}
  .progress{font-size:16px; color:#999; margin-bottom:10px;}
  .question{
    font-size:22px; font-weight:bold; color:#3a3a55; margin:6px 0 14px; line-height:1.35;
    display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
  }
  .speak-btn{
    background:var(--amarelo); border:none; border-radius:50%; width:54px; height:54px;
    font-size:28px; cursor:pointer; box-shadow:0 4px 0 #d9a800; flex:0 0 auto;
  }
  .speak-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #d9a800;}
  .speak-btn.playing{animation:pulse .7s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}

  .stage{
    min-height:120px; display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:10px; margin:10px auto 18px; padding:16px;
    background:linear-gradient(160deg,#f3fff5,#eef7ff); border-radius:22px; border:4px dashed #bfe6c6;
    flex-direction:column;
  }
  .obj{font-size:74px; animation:pop .35s ease; line-height:1;}
  @keyframes pop{0%{transform:scale(0);}70%{transform:scale(1.25);}100%{transform:scale(1);}}
  .cardtxt{font-size:19px; font-weight:bold; color:#5a7a5f; margin-top:4px; line-height:1.3; max-width:430px;}

  .seqslots{display:flex; flex-direction:column; gap:8px; align-items:stretch; max-width:520px; margin:0 auto;}
  .seqslot{
    min-height:52px; border:4px dashed #bfe0c6; border-radius:16px; background:#f7fff9;
    display:flex; align-items:center; gap:10px; padding:8px 12px; font-size:16px; font-weight:bold; color:#8aa593;
  }
  .seqslot .nn{background:var(--verde); color:#fff; border-radius:50%; width:32px; height:32px; flex:0 0 auto;
               display:flex; align-items:center; justify-content:center; font-size:18px;}
  .seqslot.filled{border-style:solid; border-color:var(--verde); background:#eefaf0; color:#2c5c38;}
  .fichas{display:flex; flex-direction:column; gap:10px; margin-top:14px;}
  .ficha{
    border:none; border-radius:18px; padding:13px 14px; font-size:17px; font-weight:bold; text-align:left;
    background:var(--azul); color:#fff; box-shadow:0 5px 0 #2f6fd0; cursor:pointer; line-height:1.25;
  }
  .ficha:active{transform:translateY(3px); box-shadow:0 2px 0 #2f6fd0;}
  .ficha.used{background:#cfcfe0; box-shadow:0 5px 0 #a0a0c0; opacity:.55; cursor:default;}
  .ficha.shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}

  .options{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
  .opt{
    border:none; border-radius:22px; padding:16px 10px; font-size:23px; font-weight:bold;
    cursor:pointer; background:var(--azul); color:#fff; box-shadow:0 6px 0 #2f6fd0;
    min-height:80px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    overflow-wrap:break-word; line-height:1.15;
  }
  .opt .cap{font-size:17px; font-weight:bold;}
  .opt:active{transform:translateY(3px); box-shadow:0 3px 0 #2f6fd0;}
  .opt.big{font-size:40px;}
  .opt.ok{background:var(--verde)!important; box-shadow:0 6px 0 #3f9c4f!important; animation:tada .5s;}
  .opt.no{background:#cfcfe0!important; box-shadow:0 6px 0 #a0a0c0!important; opacity:.7;}
  @keyframes tada{0%{transform:scale(1);}30%{transform:scale(1.18) rotate(-4deg);}60%{transform:scale(1.1) rotate(4deg);}100%{transform:scale(1);}}

  .opt-colors .opt{font-size:19px;}
  .opt-colors .opt:nth-child(1){background:var(--rosa); box-shadow:0 6px 0 #d44d7c;}
  .opt-colors .opt:nth-child(2){background:var(--azul); box-shadow:0 6px 0 #2f6fd0;}
  .opt-colors .opt:nth-child(3){background:var(--laranja); box-shadow:0 6px 0 #d96d2e;}
  .opt-colors .opt:nth-child(4){background:var(--roxo); box-shadow:0 6px 0 #7a4db0;}

  .feedback{font-size:25px; font-weight:bold; min-height:40px; margin-top:12px;}
  .feedback.good{color:var(--verde);} .feedback.bad{color:var(--laranja);}

  .next-btn{
    margin-top:14px; background:var(--verde); color:#fff; border:none; border-radius:22px;
    font-size:24px; font-weight:bold; padding:14px 34px; cursor:pointer; box-shadow:0 6px 0 #3f9c4f;
  }
  .next-btn:active{transform:translateY(3px); box-shadow:0 3px 0 #3f9c4f;}

  #splash{
    position:fixed; inset:0; background:linear-gradient(160deg,#4fb477,#3aa7e8);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; z-index:50; cursor:pointer; padding:20px;
  }
  #splash h1{font-size:34px; margin:10px;}
  #splash .big{font-size:100px; animation:flutua 2.5s infinite;}
  #splash .play{
    margin-top:24px; background:var(--amarelo); color:#5a4500; border:none; border-radius:30px;
    font-size:30px; font-weight:bold; padding:18px 44px; box-shadow:0 8px 0 #d9a800; cursor:pointer;
  }

  #confetti{position:fixed; inset:0; pointer-events:none; z-index:40;}
  .win{text-align:center; padding:20px;}
  .win .trophy{font-size:90px; animation:tada 1s;}

  @media(max-width:480px){
    .hero h1{font-size:26px;} .question{font-size:19px;} .card{font-size:16px;}
    .obj{font-size:60px;} .cardtxt{font-size:17px;}
    .opt{font-size:20px;} .opt .cap{font-size:15px;} .ficha{font-size:15px;}
  }

  /* Pergunta e alternativa com ilustração (jogo "Escola Para Quê?") */
  .options.fig-opts{grid-template-columns:1fr; max-width:520px; margin:0 auto;}
  .opt.fig-opt{
    flex-direction:row; justify-content:flex-start; gap:14px; text-align:left;
    background:#fff; color:#3a3a55; border:4px solid #e3eaf7; box-shadow:0 6px 0 #d9e3f5;
    padding:8px 14px; min-height:110px;
  }
  .opt.fig-opt:active{box-shadow:0 3px 0 #d9e3f5;}
  .opt.fig-opt .fig{width:92px; height:92px; flex:0 0 92px;}
  .opt.fig-opt .cap{font-size:19px; line-height:1.25;}
  .opt.fig-opt.ok{color:#fff; border-color:#3f9c4f;}
  .opt.fig-opt.no{border-color:#a0a0c0;}
  /* Alvos de no mínimo 70px também nos botões de ouvir e de avançar. */
  .speak-btn{width:70px; height:70px; font-size:34px;}
  .next-btn{min-height:70px;}
  /* Ordenar: as cenas de rua têm detalhes (chão, luz, carros); 104px em vez de 86px. */
  .game .or-vaga{width:104px; height:104px;}
  #orItens .adesivo{width:104px; height:104px;}
  @media(max-width:480px){ .opt.fig-opt .cap{font-size:17px;} .opt.fig-opt .fig{width:84px;height:84px;flex-basis:84px;} }
</style>
<link rel="stylesheet" href="../motor/interacoes.css">
<script src="../motor/interacoes.js"></script>
</head>
<body>

<div id="splash">
  <div class="big"><img src="images/mascote.webp" alt="" style="width:170px;height:170px" class="flutua"></div>
  <h1>Ciências Novembro!</h1>
  <p style="font-size:20px;max-width:380px;">Ruas, escola e o caminho até a escola!<br>Toque no botão para começar.</p>
  <button class="play" id="startBtn">▶ COMEÇAR</button>
</div>

<canvas id="confetti"></canvas>
<div id="app"></div>

<script>
/* ============================================================
   CIÊNCIAS NOVEMBRO — 1º ano (Bernoulli, Capítulo 5)
   Módulo 10 do projeto. Refeito com o motor de interações
   (motor/interacoes.js): arrastar, ligar, estourar, procurar...
   Conteúdos: DA SUA CASA ATÉ A ESCOLA — ruas antigamente e hoje,
   espaços públicos e privados, meios de transporte e poluição,
   funções das ruas, fontes históricas, profissionais da escola,
   materiais escolares antigos e atuais, para que serve a escola.

   Jogos (todos com 3 rodadas, da mais fácil para a mais difícil):
     ruas          ordenar      antigo → hoje (veículos, chão, a rua inteira)
     espacos       classificar  público × privado
     transporte    baloes       jeitos de ir à escola; o que polui
     funcoes       cena         comercial, residencial, cultural
     fontes        mascote      a Coruja Detetive pede pistas do passado
     profissionais ligar        pessoa ↔ o que faz na escola
     materiais     memoria      material de antigamente ↔ o de hoje
     escola        options      pergunta com ilustração nas opções
   ============================================================ */

const App = document.getElementById('app');
let stars = parseInt(localStorage.getItem('vitor_ci3_stars')||'0',10);

/* ============================================================
   VOCABULÁRIO DE VOZ (chave -> texto falado).
   ============================================================ */
const VOICE = {
  /* navegação e feedback */
  greet:"Oi! Eu sou a Coruja Sabida! Vamos aprender sobre as ruas, a escola e o caminho de casa até a escola. Escolha uma brincadeira!",
  test:"Olá! Você está me ouvindo? Vamos aprender sobre ruas, escola e transporte!",
  win:"Parabéns! Você conseguiu! Que orgulho de você!",
  choose:"As respostas são:",
  ok1:"Muito bem!", ok2:"Isso aí!", ok3:"Você acertou!",
  ok4:"Boa demais!", ok5:"Mandou bem!", ok6:"Perfeito!",
  no1:"Quase! Tenta outra.", no2:"Hmm, tenta de novo.", no3:"Não foi essa, tenta outra.",
  figurinha:"Você ganhou uma figurinha nova para o seu álbum!",
  album:"Este é o seu álbum de figurinhas! Termine os jogos para completar.",

  /* ===== 1. RUAS: ANTES E HOJE (ordenar) ===== */
  ru_q1:"Coloque em ordem: primeiro o mais antigo, depois o de hoje! Arraste cada figura para o número certo. Como as pessoas andavam pelas ruas?",
  ru_carroca:"A carroça puxada por cavalo, de antigamente",
  ru_carro:"O carro de hoje",
  ru_exp1:"Antigamente muita gente andava de carroça. Hoje as ruas têm carros e ônibus. Para conhecer as ruas da cidade, podemos passear por elas e observar.",
  ru_q2:"Agora o chão da rua! Coloque em ordem, do mais antigo para o de hoje.",
  ru_terra:"A rua de terra",
  ru_pedras:"A rua de pedras",
  ru_asfalto:"A rua de asfalto",
  ru_exp2:"Antigamente as ruas eram de terra ou de pedras. Hoje elas são asfaltadas, com um chão mais liso para os carros passarem.",
  ru_q3:"Agora a rua inteira! Olhe o chão, a luz e os carros, e coloque em ordem, do mais antigo para o de hoje.",
  ru_c1:"Uma rua de terra, escura, com carroça",
  ru_c2:"Uma rua de pedras, com lampião e carro antigo",
  ru_c3:"Uma rua de asfalto, iluminada, com carros de hoje",
  ru_exp3:"Com o tempo mudaram o chão, a luz e os veículos das ruas. Algumas ruas guardam traços do passado: são ruas históricas, que contam a história do lugar e fazem parte do patrimônio cultural da cidade.",

  /* ===== 2. PÚBLICO OU PRIVADO? (classificar) ===== */
  ep_q1:"Arraste cada lugar para o grupo certo! O portão aberto é para os lugares abertos a todas as pessoas. A casa com cadeado é para os lugares que pertencem a alguém.",
  ep_pub:"Espaço público: aberto para todas as pessoas.",
  ep_pri:"Espaço privado: pertence a alguém.",
  l_praca:"A praça",
  l_parquinho:"O parquinho da cidade",
  l_mercado:"O mercado municipal",
  l_rua:"A rua",
  l_shopping:"O shopping",
  l_cinema:"O cinema",
  l_quarto:"O quarto de alguém",
  l_escritorio:"O escritório de uma empresa",
  ep_exp1:"A praça e o parquinho são públicos: qualquer pessoa pode usar. O shopping e o quarto são privados: pertencem a alguém.",
  ep_q2:"Mais lugares! Público ou privado? Arraste cada um para o grupo certo.",
  ep_exp2:"O mercado municipal e a rua são públicos, são de todos da cidade. O cinema e o escritório são privados: eles têm dono.",
  ep_q3:"Agora são muitos lugares! Separe todos: público ou privado.",
  ep_exp3:"Os espaços públicos são de todos. Por isso, neles precisamos seguir regras de boa convivência.",

  /* ===== 3. COMO VAMOS À ESCOLA? (balões) ===== */
  tr_q1:"Estoure os balões dos jeitos de ir à escola!",
  t_carro:"O carro",
  t_onibus:"O ônibus escolar",
  t_bicicleta:"A bicicleta",
  t_ape:"A pé",
  t_barco:"O barco",
  t_foguete:"O foguete",
  t_submarino:"O submarino",
  tr_exp1:"Cada criança vai à escola de um jeito: de carro, de ônibus escolar, de bicicleta, a pé e até de barco. Cada lugar tem uma realidade diferente.",
  tr_q2:"Agora estoure só os jeitos de ir à escola que não poluem o ar!",
  tr_exp2:"Ir a pé e de bicicleta não polui o ar, e ainda faz bem para o corpo.",
  tr_q3:"Agora é o contrário! Estoure só os que soltam fumaça e poluem o ar.",

  r_predio:"Um prédio de apartamentos",
  r_museu:"Um museu",
  r_teatro:"Um teatro",
  fn_exp1:"As ruas ligam os lugares da cidade. Lojas e padarias mostram que a rua tem função comercial: é lugar de comprar e vender.",
  fn_exp2:"Casas e prédios mostram que a rua tem função residencial: é onde as pessoas moram. As ruas não são todas iguais, cada uma tem algo diferente.",
  fn_exp3:"Museu e teatro mostram a função cultural. E tem rua que vira lazer: o Minhocão, em São Paulo, nos fins de semana fica só para as pessoas passearem.",

  /* ===== 5. CORUJA DETETIVE: FONTES HISTÓRICAS (mascote) ===== */
  fo_q1:"Eu sou a Coruja Detetive! Quero descobrir como era a nossa rua antigamente. Arraste até mim o que ajuda a conhecer o passado!",

  fo_exp3:"Fotos, mapas, textos e a conversa com moradores antigos são fontes históricas. Os moradores contam o que viveram. Até o nome de uma rua pode contar a história do lugar.",

  /* ===== 6. QUEM TRABALHA NA ESCOLA? (ligar) ===== */
  pr_q1:"Puxe uma linha de cada pessoa até o que ela faz na escola!",
  pr_q2:"Agora são quatro pessoas! Ligue cada uma ao seu trabalho na escola.",
  pr_q3:"Agora são cinco! Ligue cada pessoa ao que ela faz na escola.",
  p_diretora:"A diretora",
  p_auxiliar:"O auxiliar de limpeza",
  p_porteiro:"O porteiro",
  p_cozinheira:"A cozinheira",
  p_professor:"O professor",
  f_escola:"Organiza e cuida de toda a escola",
  f_vassoura:"Cuida da limpeza da escola",
  f_portao:"Cuida da entrada da escola",
  f_panela:"Prepara a comida da escola",
  f_sala:"Ensina as matérias na sala de aula",
  pr_exp1:"O auxiliar de limpeza deixa a escola limpa, o porteiro cuida da entrada e a cozinheira prepara a comida. Cada um faz a escola funcionar bem.",
  pr_exp2:"A diretora organiza e cuida de toda a escola, e o professor ensina as matérias na sala de aula.",
  pr_exp3:"Todas essas pessoas juntas formam a comunidade escolar. Cada uma é importante para a escola funcionar.",

  ma_lousa:"A lousa de pedra, onde as crianças escreviam antigamente",
  ma_caderno:"O caderno, onde escrevemos hoje",
  ma_goma:"A goma árabe, a cola de antigamente",
  ma_cola:"A cola de hoje",
  ma_bolsa:"A bolsa de couro de antigamente",
  ma_mochila:"A mochila de hoje",

  es_aprender:"Aprender e fazer amigos",

/* ============================================================
   PLAYER DE ÁUDIO (clipes em sequência)
   ============================================================ */
const AUDIO_DIR='audio/', AUDIO_EXT='.mp3';
const player=new Audio();
player.preload='auto';
let playToken=0, audioOn=true;
function stopAudio(){ playToken++; try{player.pause();}catch(e){} setPlayingBadge(false); }
function playKeys(keys){
  if(!audioOn) return;
  stopAudio();
  const list=[].concat(...keys.map(k=>Array.isArray(k)?k:[k])).filter(Boolean);
  if(!list.length) return;
  const my=playToken; let i=0;
  setPlayingBadge(true);
  const next=()=>{
    if(my!==playToken) return;
    if(i>=list.length){ setPlayingBadge(false); return; }
    const key=list[i++];
    player.src=AUDIO_DIR+key+AUDIO_EXT;
    player.onended=next;
    player.onerror=()=>{ setTimeout(next,10); };
    const p=player.play();
    if(p&&p.catch) p.catch(()=>setTimeout(next,10));
  };
  next();
}
function setPlayingBadge(on){
  const b=document.getElementById('qspeak'); if(b) b.classList.toggle('playing',on);
}
function unlockAudio(depois){
  const pronto=()=>{ player.muted=false; if(depois){ const f=depois; depois=null; f(); } };
  try{ player.muted=true; player.src=AUDIO_DIR+'greet'+AUDIO_EXT;
       const p=player.play();
       if(p&&p.then) p.then(()=>{player.pause();player.currentTime=0;pronto();}).catch(pronto);
       else { player.pause(); pronto(); }
       setTimeout(pronto,1200);
  }catch(e){ pronto(); }
}

/* ===== SONS DE EFEITO (Web Audio) ===== */
let actx=null;
function initAudio(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }
function tone(freq,start,dur,type='sine',vol=0.2){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
  const t=actx.currentTime+start;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.start(t); o.stop(t+dur);
}

function sndRight(){ initAudio(); [523,659,784,1047].forEach((f,i)=>tone(f,i*0.09,0.25,'triangle',0.18)); }
function sndWrong(){ initAudio(); tone(300,0,0.18,'sine',0.13); tone(220,0.12,0.25,'sine',0.13); }
function sndWin(){ initAudio(); [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*0.12,0.3,'triangle',0.2)); }

/* ===== UTILIDADES ===== */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rint(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function mix(){ return shuffle([].concat(...arguments)); }

const cv=document.getElementById('confetti'), cx=cv.getContext('2d');
let confs=[];
function resizeCv(){cv.width=innerWidth;cv.height=innerHeight;}
addEventListener('resize',resizeCv); resizeCv();
function burst(){
  const cols=['#ff6b9d','#ffd93d','#6bcB77','#4d96ff','#a06cd5','#ff924c'];
  for(let i=0;i<70;i++){confs.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-0.5)*14,vy:Math.random()*-12-3,c:pick(cols),s:rint(7,14),r:Math.random()*6,vr:(Math.random()-.5)*.4});}
}
function loopConf(){
  cx.clearRect(0,0,cv.width,cv.height);
  confs.forEach(p=>{p.vy+=0.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s);cx.restore();});
  confs=confs.filter(p=>p.y<cv.height+30);
  requestAnimationFrame(loopConf);
}

let current=null, locked=false;
function startGame(id){
  const rounds=BUILDERS[id]();

  renderRound();
}
function gameFrame(c,r,bodyHtml){
  shell(`
    <div class="game">
      <h2 class="game-title">${GAMES.find(g=>g.id===c.id).ico} ${c.title}</h2>
      <div class="progress">Pergunta ${c.idx+1} de ${c.rounds.length}</div>

      </div>

      <div class="feedback" id="fb"></div>
    </div>
  `);
}
function renderRound(){
  locked=false;
  const c=current, r=c.rounds[c.idx];
  if(window.MODOS && MODOS[r.mode]) return MODOS[r.mode](c,r);
  gameFrame(c,r,`<div class="options ${r.figOpts?'fig-opts':''}" id="opts"></div>`);
  const shown=shuffle(r.options);
  const opts=document.getElementById('opts');
  shown.forEach(o=>{
    const b=document.createElement('button');
    b.className='opt'+(r.figOpts?' fig-opt':'');
    b.innerHTML=o.label;
    b.onclick=()=>answer(b,o);
    opts.appendChild(b);
  });
  window._roundKeys=[].concat(r.audio||[], ['choose'], shown.map(o=>o.aud));
  setTimeout(()=>speakRound(),400);
}
function speakRound(){ playKeys(window._roundKeys||[]); }

function showNextButton(){
  document.querySelectorAll('.opt').forEach(b=>b.onclick=null);
  const nb=document.createElement('button');
  nb.className='next-btn';
  const last=current.idx>=current.rounds.length-1;
  nb.textContent=last?'🏆 Terminar':'Próxima ➡';
  nb.onclick=()=>{
    nb.onclick=null;
    sndClick();
    if(last){ winScreen(); return; }
    current.idx++; renderRound();
    locked=true; setTimeout(()=>{locked=false;},350);
  };
  document.querySelector('.game').appendChild(nb);
}
function correctFlow(extraAudio){
  locked=true; sndRight(); burst(); addStar(1);
  const fb=document.getElementById('fb'); if(fb){fb.className='feedback good'; fb.textContent='⭐ Muito bem!';}
  playKeys(extraAudio.filter(Boolean));
  showNextButton();
}
function answer(btn,opt){
  if(locked) return;
  if(opt.correct){
    btn.classList.add('ok');
    document.querySelectorAll('.opt').forEach(b=>{if(b!==btn)b.classList.add('no');});
    correctFlow([opt.aud, pick(OK_KEYS), opt.expAud]);
  }else{
    btn.classList.add('no'); btn.onclick=null;
    sndWrong();
    const fb=document.getElementById('fb'); fb.className='feedback bad'; fb.textContent='🤔 Tenta de novo!';
    playKeys([opt.aud, pick(NO_KEYS)].filter(Boolean));
  }
}

    const rua = tipo => {
      const outros = ['com','res','cul'].filter(t=>t!==tipo).map(t=>pick(lugares.filter(l=>l.tipo===t)));
      return shuffle([...lugares.filter(l=>l.tipo===tipo), ...outros])
        .map((l,i)=>({img:l.img, aud:l.aud, certo:l.tipo===tipo, x:1+i*24.6, y:36, w:24}));
    };
    return [
      {mode:'cena', q:'Toque nas <b>lojas</b>!', audio:['fn_q1'], expAud:'fn_exp1', fundo:'rua', objetos:rua('com')},
      {mode:'cena', q:'Toque onde as pessoas <b>moram</b>!', audio:['fn_q2'], expAud:'fn_exp2', fundo:'rua', objetos:rua('res')},
      {mode:'cena', q:'Toque nos lugares de <b>arte e história</b>!', audio:['fn_q3'], expAud:'fn_exp3', fundo:'rua', objetos:rua('cul')},
    ];
  },

  /* 5. CORUJA DETETIVE — dar à coruja as fontes históricas */
  fontes(){
    const F={
      foto:{img:'foto_antiga', aud:'fo_foto', certo:true}, mapa:{img:'mapa_antigo', aud:'fo_mapa', certo:true},
      livro:{img:'livro_antigo', aud:'fo_livro', certo:true}, vovo:{img:'vovo', aud:'fo_vovo', certo:true},
      cristal:{img:'bola_cristal', aud:'fo_cristal', certo:false}, bola:{img:'bola', aud:'fo_bola', certo:false},
      bolo:{img:'bolo', aud:'fo_bolo', certo:false},
    };
    const m='coruja_detetive';
    return [
      {mode:'mascote', q:'Dê à Coruja Detetive uma <b>pista do passado</b>!', audio:['fo_q1'], expAud:'fo_exp1', mascote:m,
       itens:[F.foto, F.bola, F.bolo]},
      {mode:'mascote', q:'Mais pistas do <b>passado</b>!', audio:['fo_q2'], expAud:'fo_exp2', mascote:m,
       itens:[F.foto, F.mapa, F.cristal, F.bola, F.bolo]},
      {mode:'mascote', q:'Todas as <b>fontes históricas</b>!', audio:['fo_q3'], expAud:'fo_exp3', mascote:m,
       itens:Object.values(F)},
    ];
  },

  /* 6. QUEM TRABALHA NA ESCOLA? — ligar pessoa ↔ trabalho */
  profissionais(){
    const P={
      diretora:{a:{img:'diretora',aud:'p_diretora'}, b:{img:'escola',aud:'f_escola'}},
      auxiliar:{a:{img:'auxiliar',aud:'p_auxiliar'}, b:{img:'vassoura',aud:'f_vassoura'}},
      porteiro:{a:{img:'porteiro',aud:'p_porteiro'}, b:{img:'portao',aud:'f_portao'}},
      cozinheira:{a:{img:'cozinheira',aud:'p_cozinheira'}, b:{img:'panela',aud:'f_panela'}},
      professor:{a:{img:'professor',aud:'p_professor'}, b:{img:'sala_aula',aud:'f_sala'}},
    };
    return [
      {mode:'ligar', q:'Ligue cada pessoa ao que ela faz', audio:['pr_q1'], expAud:'pr_exp1', pares:[P.auxiliar, P.porteiro, P.cozinheira]},
      {mode:'ligar', q:'Agora são <b>quatro</b>!', audio:['pr_q2'], expAud:'pr_exp2', pares:[P.diretora, P.professor, P.auxiliar, P.cozinheira]},
      {mode:'ligar', q:'Agora são <b>cinco</b>!', audio:['pr_q3'], expAud:'pr_exp3', pares:Object.values(P)},
    ];
  },

  /* 7. MATERIAL DE ANTIGAMENTE — memória: o antigo e o de hoje que serve para o mesmo */
  materiais(){
    const M={
      lousa:{a:{img:'lousa',aud:'ma_lousa'}, b:{img:'caderno',aud:'ma_caderno'}},
      goma:{a:{img:'goma',aud:'ma_goma'}, b:{img:'cola',aud:'ma_cola'}},
      bolsa:{a:{img:'bolsa_couro',aud:'ma_bolsa'}, b:{img:'mochila',aud:'ma_mochila'}},
      cartilha:{a:{img:'cartilha',aud:'ma_cartilha'}, b:{img:'livro_hoje',aud:'ma_livro'}},
    };
    return [
      {mode:'memoria', q:'Ache os pares: <b>antigamente</b> e <b>hoje</b>', audio:['ma_q1'], expAud:'ma_exp1', pares:[M.lousa, M.goma]},
      {mode:'memoria', q:'Agora são <b>três</b> pares!', audio:['ma_q2'], expAud:'ma_exp2', pares:[M.lousa, M.goma, M.bolsa]},
      {mode:'memoria', q:'Agora são <b>quatro</b> pares!', audio:['ma_q3'], expAud:'ma_exp3', pares:Object.values(M)},
    ];
  },

  /* 8. ESCOLA PARA QUÊ? — pergunta com ilustração em cada opção */
  escola(){ return [
    {q:'Para que serve a <b>escola</b>?', audio:['es_q1'], figOpts:true,
     options:[figOpt('es_aprender',true,'es_exp1'), figOpt('es_dormir'), figOpt('es_esconder')]},
    {q:'Antes de existir escola, como as crianças <b>aprendiam</b>?', audio:['es_q2'], figOpts:true,
     options:[figOpt('es_observar',true,'es_exp2'), figOpt('es_maquina'), figOpt('es_sozinha')]},
    {q:'A escola ajuda a gente a pensar no quê?', audio:['es_q3'], figOpts:true,
     options:[figOpt('es_sonhos',true,'es_exp3'), figOpt('es_almoco'), figOpt('es_tv')]},
  ];},
};

/* ===== INICIAR ===== */
document.getElementById('startBtn').addEventListener('click',()=>{
  initAudio();
  unlockAudio(()=>goHome());
  document.getElementById('splash').style.display='none';
});
</script>
</body>
