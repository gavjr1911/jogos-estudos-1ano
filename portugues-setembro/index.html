<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📚 Português de Setembro 📚</title>
<style>
  :root{
    --rosa:#ff6b9d; --roxo:#a06cd5; --azul:#4d96ff; --verde:#6bcB77;
    --amarelo:#ffd93d; --laranja:#ff924c; --vermelho:#ff5e5e; --ceu:#b8e3ff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    font-family:'Comic Sans MS','Baloo',"Trebuchet MS",sans-serif;
    background:linear-gradient(160deg,#ffe9f3 0%,#e6e2ff 50%,#dff3ff 100%);
    color:#3a3a55; overflow-x:hidden; user-select:none;
    min-height:100%; touch-action:manipulation;
  }
  #app{max-width:760px; margin:0 auto; padding:14px; min-height:100vh;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; border-radius:22px; padding:8px 14px; margin-bottom:14px;
    box-shadow:0 6px 0 rgba(0,0,0,.08);
  }
  .topbar .home-btn{
    background:var(--azul); color:#fff; border:none; border-radius:16px;
    font-size:22px; padding:8px 14px; font-weight:bold; cursor:pointer; box-shadow:0 4px 0 #2f6fd0;
  }
  .topbar .home-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #2f6fd0;}
  .topbar .nav{display:flex; align-items:center; gap:8px;}
  .topbar .back-btn{
    background:var(--roxo); color:#fff; border:none; border-radius:16px;
    font-size:22px; padding:8px 14px; font-weight:bold; cursor:pointer;
    box-shadow:0 4px 0 #7d49b0; text-decoration:none; display:inline-block; line-height:1;
  }
  .topbar .back-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #7d49b0;}
  .stars{font-size:24px; font-weight:bold; color:var(--laranja); display:flex; align-items:center; gap:6px;}
  .stars .num{background:var(--amarelo); border-radius:14px; padding:2px 12px; box-shadow:0 3px 0 #d9a800;}

  .hero{
    text-align:center; background:#fff; border-radius:30px; padding:22px 18px;
    box-shadow:0 8px 0 rgba(0,0,0,.08); margin-bottom:18px;
  }
  .hero h1{font-size:32px; margin:6px 0; color:var(--roxo); line-height:1.2;}
  .hero p{font-size:18px; margin:4px 0; color:#666;}
  .mascote{font-size:78px; display:inline-block; animation:flutua 2.5s ease-in-out infinite;}
  @keyframes flutua{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-14px) rotate(3deg);}}

  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
  .card{
    border:none; border-radius:26px; padding:16px 10px; cursor:pointer;
    color:#fff; font-size:19px; font-weight:bold; text-align:center;
    box-shadow:0 7px 0 rgba(0,0,0,.18); transition:transform .08s;
    display:flex; flex-direction:column; align-items:center; gap:6px; line-height:1.15;
  }
  .card:active{transform:translateY(4px); box-shadow:0 3px 0 rgba(0,0,0,.18);}
  .card .ico{font-size:44px;}
  .c1{background:var(--rosa);} .c2{background:var(--azul);} .c3{background:var(--verde);}
  .c4{background:var(--laranja);} .c5{background:var(--roxo);} .c6{background:var(--vermelho);}
  .c7{background:#19c3b1;} .c8{background:#f76eb0;} .c9{background:#7c83ff;}

  .game{
    background:#fff; border-radius:30px; padding:18px; box-shadow:0 8px 0 rgba(0,0,0,.08);
    text-align:center;
  }
  .game-title{font-size:24px; color:var(--roxo); margin:0 0 4px;}
  .progress{font-size:16px; color:#999; margin-bottom:10px;}
  .question{
    font-size:22px; font-weight:bold; color:#3a3a55; margin:6px 0 14px; line-height:1.35;
    display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
  }
  .speak-btn{
    background:var(--amarelo); border:none; border-radius:50%; width:54px; height:54px;
    font-size:28px; cursor:pointer; box-shadow:0 4px 0 #d9a800; flex:0 0 auto;
  }
  .speak-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #d9a800;}
  .speak-btn.playing{animation:pulse .7s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}

  .stage{
    min-height:120px; display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:10px; margin:10px auto 18px; padding:16px;
    background:linear-gradient(160deg,#fff7fd,#eef5ff); border-radius:22px; border:4px dashed #e3cdf5;
    flex-direction:column;
  }
  .obj{font-size:74px; animation:pop .35s ease; line-height:1;}
  @keyframes pop{0%{transform:scale(0);}70%{transform:scale(1.25);}100%{transform:scale(1);}}

  /* ilustrações SVG */
  .illo{display:inline-block; flex:0 0 auto; line-height:0; vertical-align:middle; animation:pop .4s ease;}
  .illo svg{display:block; width:100%; height:100%;}
  .illorow{display:flex; gap:10px; justify-content:center; align-items:center; flex-wrap:nowrap;}
  .illocol{display:flex; flex-direction:column; align-items:center; gap:6px; flex:0 1 auto; min-width:0;}
  .illocol .wordtiles{flex-wrap:nowrap;}
  .illorow .seta{font-size:30px; flex:0 0 auto;}

  /* palavra em quadradinhos de letras */
  .wordtiles{display:flex; gap:5px; flex-wrap:wrap; justify-content:center; align-items:center;}
  .lettile{
    min-width:42px; height:52px; padding:0 4px; border:3px solid var(--roxo); border-radius:10px; background:#fff;
    display:flex; align-items:center; justify-content:center; font-size:29px; font-weight:bold; color:#3a3a55;
  }
  .lettile.hl{background:#fff3b0; border-color:var(--laranja); color:#e0651b;}
  .lettile.miss{background:#ffe3ec; border-color:var(--vermelho); color:var(--vermelho); font-size:32px;}
  .lettile.gap{background:#ffe3ec; border-color:var(--vermelho); color:var(--vermelho); min-width:64px; font-size:30px;}

  /* frase com lacuna */
  .frase{font-size:22px; font-weight:bold; color:#2f6fd0; line-height:1.5; max-width:460px;}
  .frase .lac{display:inline-block; min-width:96px; border-bottom:5px solid var(--vermelho); color:var(--vermelho);}

  /* capa de livro */
  .capa{
    width:230px; border-radius:12px; padding:12px 10px; border:6px solid #f3c34a;
    box-shadow:0 8px 0 rgba(0,0,0,.18); display:flex; flex-direction:column; gap:6px; align-items:center;
  }
  .capa .cp-tit{font-size:23px; font-weight:bold; line-height:1.1; text-align:center;}
  .capa .cp-lin{font-size:11px; font-weight:bold; text-align:center; line-height:1.25;}
  .capa .cp-art{width:112px; height:112px; background:rgba(255,255,255,.55); border-radius:10px;}
  .capa .cp-ed{font-size:10px; font-weight:bold; background:#fff; color:#5a4500; border-radius:6px; padding:3px 8px;}

  /* fichas de sequência (montar a ordem) */
  .seqslots{display:flex; flex-direction:column; gap:8px; align-items:stretch; max-width:520px; margin:0 auto;}
  .seqslot{
    min-height:52px; border:4px dashed #cbb6e6; border-radius:16px; background:#faf6ff;
    display:flex; align-items:center; gap:10px; padding:8px 12px; font-size:16px; font-weight:bold; color:#8a7aa5;
  }
  .seqslot .nn{background:var(--roxo); color:#fff; border-radius:50%; width:32px; height:32px; flex:0 0 auto;
               display:flex; align-items:center; justify-content:center; font-size:18px;}
  .seqslot.filled{border-style:solid; border-color:var(--verde); background:#eefaf0; color:#2c5c38;}
  .fichas{display:flex; flex-direction:column; gap:10px; margin-top:14px;}
  .ficha{
    border:none; border-radius:18px; padding:13px 14px; font-size:17px; font-weight:bold; text-align:left;
    background:var(--azul); color:#fff; box-shadow:0 5px 0 #2f6fd0; cursor:pointer; line-height:1.25;
  }
  .ficha:active{transform:translateY(3px); box-shadow:0 2px 0 #2f6fd0;}
  .ficha.used{background:#cfcfe0; box-shadow:0 5px 0 #a0a0c0; opacity:.55; cursor:default;}
  .ficha.shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}

  .options{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(130px,1fr));}
  .opt{
    border:none; border-radius:22px; padding:16px 10px; font-size:23px; font-weight:bold;
    cursor:pointer; background:var(--azul); color:#fff; box-shadow:0 6px 0 #2f6fd0;
    min-height:80px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    overflow-wrap:break-word; line-height:1.15;
  }
  .opt .cap{font-size:17px;}
  .opt-colors .opt{font-size:19px;}
  .opt:active{transform:translateY(3px); box-shadow:0 3px 0 #2f6fd0;}
  .opt.big{font-size:40px;}
  .opt.ok{background:var(--verde)!important; box-shadow:0 6px 0 #3f9c4f!important; animation:tada .5s;}
  .opt.no{background:#cfcfe0!important; box-shadow:0 6px 0 #a0a0c0!important; opacity:.7;}
  @keyframes tada{0%{transform:scale(1);}30%{transform:scale(1.18) rotate(-4deg);}60%{transform:scale(1.1) rotate(4deg);}100%{transform:scale(1);}}

  .opt-colors .opt:nth-child(1){background:var(--rosa); box-shadow:0 6px 0 #d44d7c;}
  .opt-colors .opt:nth-child(2){background:var(--verde); box-shadow:0 6px 0 #3f9c4f;}
  .opt-colors .opt:nth-child(3){background:var(--laranja); box-shadow:0 6px 0 #d96d2e;}
  .opt-colors .opt:nth-child(4){background:var(--roxo); box-shadow:0 6px 0 #7a4db0;}

  .feedback{font-size:25px; font-weight:bold; min-height:40px; margin-top:12px;}
  .feedback.good{color:var(--verde);} .feedback.bad{color:var(--laranja);}

  .next-btn{
    margin-top:14px; background:var(--verde); color:#fff; border:none; border-radius:22px;
    font-size:24px; font-weight:bold; padding:14px 34px; cursor:pointer; box-shadow:0 6px 0 #3f9c4f;
  }
  .next-btn:active{transform:translateY(3px); box-shadow:0 3px 0 #3f9c4f;}

  #splash{
    position:fixed; inset:0; background:linear-gradient(160deg,var(--roxo),var(--rosa));
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; z-index:50; cursor:pointer; padding:20px;
  }
  #splash h1{font-size:34px; margin:10px;}
  #splash .big{font-size:100px; animation:flutua 2.5s infinite;}
  #splash .play{
    margin-top:24px; background:var(--amarelo); color:#5a4500; border:none; border-radius:30px;
    font-size:30px; font-weight:bold; padding:18px 44px; box-shadow:0 8px 0 #d9a800; cursor:pointer;
  }

  #confetti{position:fixed; inset:0; pointer-events:none; z-index:40;}
  .win{text-align:center; padding:20px;}
  .win .trophy{font-size:90px; animation:tada 1s;}

  @media(max-width:480px){
    .hero h1{font-size:26px;} .question{font-size:19px;} .card{font-size:16px;}
    .obj{font-size:60px;} .lettile{min-width:34px; height:44px; font-size:23px;}
    .frase{font-size:19px;} .capa{width:196px;} .ficha{font-size:15px;}
    .illocol .lettile{min-width:24px; height:36px; font-size:17px; border-width:2px;}
    .illorow{gap:6px;} .illorow .seta{font-size:22px;}
  }
</style>
</head>
<body>

<div id="splash">
  <div class="big">📚</div>
  <h1>Português<br>de Setembro!</h1>
  <p style="font-size:20px;max-width:360px;">Vamos brincar com os contos, as capas de livro e os encontros consonantais! 🎉<br>Toque no botão para começar.</p>
  <button class="play" id="startBtn">▶ COMEÇAR</button>
</div>

<canvas id="confetti"></canvas>
<div id="app"></div>

<script>
/* ============================================================
   PORTUGUÊS DE SETEMBRO — 1º ano (Bernoulli, Capítulo 4)
   Módulo 7 do projeto. Mesma estrutura dos outros apps:
   - narração por arquivos pré-gravados (pasta /audio) -> funciona
     em qualquer aparelho, online ou offline;
   - ilustrações em SVG desenhadas à mão (nada de imagem externa);
   - estrelas, confete, sons de efeito; tudo jogável sozinho.
   Conteúdos: ENCONTRO CONSONANTAL (com R e com L), formar palavras
   novas acrescentando R e L, pares mínimos em frases, separar em
   sílabas, o gênero CAPA DE LIVRO (título, autor, ilustrador,
   editora), o gênero CONTO e suas partes (introdução,
   desenvolvimento, conclusão) e a compreensão dos contos
   Cachinhos Dourados, Os Três Porquinhos e O Soldadinho de Chumbo.
   ============================================================ */

const App = document.getElementById('app');
let stars = parseInt(localStorage.getItem('vitor_port_set_stars')||'0',10);

/* ============================================================
   VOCABULÁRIO DE VOZ (chave -> texto falado).
   Fonte da verdade para o gerar-audios.py (gera audio/<chave>.mp3).

  /* ---------- PALAVRAS ---------- */
  w_grama:"grama", w_bravo:"bravo", w_brinco:"brinco", w_prato:"prato",

  x_palca:"palca", x_pacla:"pacla", x_folco:"folco", x_foclo:"foclo",
  x_felcha:"felcha", x_fechla:"fechla", x_calro:"calro", x_cralo:"cralo",

  x_pulma:"pulma", x_pumla:"pumla",
  x_pornta:"pornta", x_floersta:"floersta", x_patra:"patra",

  /* ---------- 1. ENCONTRO CONSONANTAL ---------- */
  e_oque:"O que é um encontro consonantal?",
  eo_duas:"são duas consoantes juntinhas na mesma palavra",
  eo_vogais:"são duas vogais juntinhas", eo_uma:"é uma letra sozinha",

  /* nomes dos encontros */

  /* ---------- 6. CONTA SÍLABAS ---------- */

  cpo_mostrar:"para mostrar do que o livro fala e chamar a atenção do leitor",
  cpo_sentar:"para a gente sentar em cima", cpo_comer:"para guardar comida",
  cp_titulo:"Olhe a capa. O TÍTULO é o nome do livro e vem escrito em letras bem grandes. Qual é o título deste livro?",

  cp_quem_escreve:"Como se chama a pessoa que ESCREVEU a história do livro?",
  cp_quem_desenha:"Como se chama a pessoa que fez os DESENHOS do livro?",

  pa_editora:"a editora", pa_leitor:"o leitor", pa_preco:"o preço",
  cp_aventura:"Olhe estas duas capas. Qual delas parece contar uma história de aventura no espaço?",

  nm_luana:"Luana Chinaglia", nm_lua:"Editora Lua",
  tt_soldadinho:"O Soldadinho de Chumbo", tt_porquinhos:"Os Três Porquinhos",
  tt_cachinhos:"Cachinhos Dourados", tt_cinderela:"A Cinderela das Bonecas",
  tt_estela:"Estela Estrela",

  /* ---------- 8. OS CONTOS ---------- */

/* ============================================================
   PLAYER DE ÁUDIO (clipes em sequência) — um único <audio>
   destravado no 1º toque (compatível com iPhone/iPad).
   ============================================================ */
const AUDIO_DIR='audio/', AUDIO_EXT='.mp3';
const player=new Audio();
player.preload='auto';
let playToken=0, audioOn=true;
function stopAudio(){ playToken++; try{player.pause();}catch(e){} setPlayingBadge(false); }
function playKeys(keys){
  if(!audioOn) return;
  stopAudio();
  const list=[].concat(...keys.map(k=>Array.isArray(k)?k:[k])).filter(Boolean);
  if(!list.length) return;
  const my=playToken; let i=0;
  setPlayingBadge(true);
  const next=()=>{
    if(my!==playToken) return;
    if(i>=list.length){ setPlayingBadge(false); return; }
    const key=list[i++];
    player.src=AUDIO_DIR+key+AUDIO_EXT;
    player.onended=next;
    player.onerror=()=>{ setTimeout(next,10); };
    const p=player.play();
    if(p&&p.catch) p.catch(()=>setTimeout(next,10));
  };
  next();
}
function setPlayingBadge(on){
  const b=document.getElementById('qspeak'); if(b) b.classList.toggle('playing',on);
}
function unlockAudio(){
  try{ player.muted=true; player.src=AUDIO_DIR+'greet'+AUDIO_EXT;
       const p=player.play();
       if(p&&p.then) p.then(()=>{player.pause();player.currentTime=0;player.muted=false;})
                      .catch(()=>{player.muted=false;});
       else {player.pause();player.muted=false;}
  }catch(e){ player.muted=false; }
}

/* ===== SONS DE EFEITO (Web Audio) ===== */
let actx=null;
function initAudio(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }
function tone(freq,start,dur,type='sine',vol=0.2){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
  const t=actx.currentTime+start;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.start(t); o.stop(t+dur);
}

function sndRight(){ initAudio(); [523,659,784,1047].forEach((f,i)=>tone(f,i*0.09,0.25,'triangle',0.18)); }
function sndWrong(){ initAudio(); tone(300,0,0.18,'sine',0.13); tone(220,0.12,0.25,'sine',0.13); }
function sndWin(){ initAudio(); [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*0.12,0.3,'triangle',0.2)); }

/* ===== UTILIDADES ===== */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rint(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function mix(){ return shuffle([].concat(...arguments)); }
const OK_KEYS=['ok1','ok2','ok3','ok4','ok5','ok6'], NO_KEYS=['no1','no2','no3'];
function emo(e,size){ return '<span class="obj" style="font-size:'+(size||74)+'px">'+e+'</span>'; }

/* desenha uma ilustração SVG pelo nome (art_<nome>) */
function illo(nome,size){
  const fn=window['art_'+nome];

  size=size||110;
  return '<span class="illo" style="width:'+size+'px;height:'+size+'px">'+fn()+'</span>';
}
/* palavra em quadradinhos de letras; hl = pedaço a destacar */
function tiles(palavra,hl){
  return '<div class="wordtiles">'+palavra.split('').map((ch,i)=>{
    const dentro = hl!==undefined && i>=hl[0] && i<hl[1];
    return '<span class="lettile'+(dentro?' hl':'')+'">'+ch+'</span>';
  }).join('')+'</div>';
}
/* palavra com uma lacuna no lugar do encontro consonantal */
function tilesGap(pre,rest){
  const a=pre.split('').map(c=>'<span class="lettile">'+c+'</span>').join('');
  const b=rest.split('').map(c=>'<span class="lettile">'+c+'</span>').join('');
  return '<div class="wordtiles">'+a+'<span class="lettile gap">?</span>'+b+'</div>';
}

function burst(){
  const cols=['#ff6b9d','#ffd93d','#6bcB77','#4d96ff','#a06cd5','#ff924c'];
  for(let i=0;i<70;i++){confs.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-0.5)*14,vy:Math.random()*-12-3,c:pick(cols),s:rint(7,14),r:Math.random()*6,vr:(Math.random()-.5)*.4});}

function loopConf(){
  cx.clearRect(0,0,cv.width,cv.height);
  confs.forEach(p=>{p.vy+=0.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s);cx.restore();});
  confs=confs.filter(p=>p.y<cv.height+30);
  requestAnimationFrame(loopConf);
}

function renderSeq(c,r){
  seqPos=0;
  const slots=r.itens.map((_,i)=>`<div class="seqslot" id="sl${i}"><span class="nn">${i+1}</span><span class="tx">...</span></div>`).join('');
  gameFrame(c,r,`

  `);
  const box=document.getElementById('fichas');
  shuffle(r.itens.map((it,i)=>({it,i}))).forEach(t=>{
    const b=document.createElement('button');
    b.className='ficha'; b.textContent=t.it.txt;
    b.onclick=()=>tapFicha(b,t.i,r);
    box.appendChild(b);
  });
  window._roundKeys=[].concat(r.audio||[]);
  setTimeout(()=>speakRound(),400);

function tapFicha(btn,idx,r){
  if(locked) return;
  if(idx===seqPos){
    const sl=document.getElementById('sl'+seqPos);
    sl.querySelector('.tx').textContent=r.itens[idx].txt;
    sl.classList.add('filled');
    btn.classList.add('used'); btn.onclick=null;
    sndClick(); playKeys([r.itens[idx].aud]);
    seqPos++;
    if(seqPos>=r.itens.length){
      setTimeout(()=>correctFlow([pick(OK_KEYS), r.expAud]),600);
    }
  }else{
    sndWrong();
    btn.classList.add('shake'); setTimeout(()=>btn.classList.remove('shake'),420);
    const fb=document.getElementById('fb'); fb.className='feedback bad'; fb.textContent='🤔 Esse não é o próximo!';
    playKeys([r.itens[idx].aud, pick(NO_KEYS)]);
  }
}

function mkOpts(correct, all, lblMap, extra){
  return shuffle(all).map(k=>{

  });
}

/* ---- os encontros consonantais estudados ---- */
const ENC_R=['BR','CR','DR','FR','GR','PR','TR','VR'];
const ENC_L=['BL','CL','FL','GL','PL'];
const ENC_KEY={BR:'d_br',CR:'d_cr',DR:'d_dr',FR:'d_fr',GR:'d_gr',PR:'d_pr',TR:'d_tr',VR:'d_vr',
               BL:'d_bl',CL:'d_cl',FL:'d_fl',GL:'d_gl',PL:'d_pl'};
function encOpt(e,correct){ return {label:e, big:true, aud:ENC_KEY[e], correct:!!correct}; }
/* 4 opções: a certa + 3 da MESMA família (com R ou com L) */
function encOpts(correct){
  const fam = ENC_R.indexOf(correct)>=0 ? ENC_R : ENC_L;
  const outros = shuffle(fam.filter(e=>e!==correct)).slice(0,3);
  return shuffle([correct,...outros]).map(e=>encOpt(e,e===correct));
}

/* opções para uma pergunta de capa: o valor certo + valores do MESMO campo
   das outras capas (assim as alternativas são sempre plausíveis) */
function capaOpts(alvo, campo, audCampo){
  const certos={label:alvo[campo], aud:alvo[audCampo], correct:true};
  const outros=shuffle(CAPAS.filter(c=>c!==alvo)).slice(0,2)
    .map(c=>({label:c[campo], aud:c[audCampo], correct:false}));
  return shuffle([certos,...outros]);
}

/* ============================================================
   CONSTRUTORES DAS RODADAS (um por mini-game)
   Regra de ouro: a pergunta NUNCA mostra nem fala a resposta.
   ============================================================ */
const BUILDERS={

  /* 1. ENCONTRO CONSONANTAL — reconhecer e identificar */
  encontro(){
    const rounds=[];
    /* (a) qual palavra TEM encontro consonantal */
    shuffle(WORDS).slice(0,3).forEach(it=>{
      const distr=shuffle(NOENC).slice(0,2);
      rounds.push({
        q:'Qual destas palavras tem <b>encontro consonantal</b> (duas consoantes juntinhas)? 🔤',
        audio:['e_qual'], stage:emo('🔤',64), colorOpts:true,
        options:shuffle([wordOpt(it,true),...distr.map(d=>wordOpt(d,false))])
      });
    });
    /* (b) qual palavra NÃO tem */
    shuffle(NOENC).slice(0,2).forEach(it=>{
      const distr=shuffle(WORDS).slice(0,2);
      rounds.push({
        q:'Qual destas palavras <b>NÃO</b> tem encontro consonantal? 🚫',
        audio:['e_naotem'], stage:emo('🚫🔤',56), colorOpts:true,
        options:shuffle([wordOpt(it,true),...distr.map(d=>wordOpt(d,false))])
      });
    });
    /* (c) qual é o encontro que está dentro da palavra (sem destacar!) */
    shuffle(WORDS).slice(0,3).forEach(it=>{
      rounds.push({
        q:'Olhe a palavra. Qual é o <b>encontro consonantal</b> que está dentro dela? 🔍',
        audio:['e_dentro',it.ak],
        stage:(it.art?illo(it.art,96):'')+tiles(it.w),
        options:encOpts(it.enc)
      });
    });
    /* (d) conceito */
    const conc=[
      {q:'O que é um <b>encontro consonantal</b>? 🤔', audio:['e_oque'], stage:emo('🤔🔤',56), colorOpts:true,
       options:mkOpts('eo_duas',['eo_duas','eo_vogais','eo_uma'],{
         eo_duas:'🔠<span class="cap">Duas consoantes juntinhas</span>',
         eo_vogais:'🅰️<span class="cap">Duas vogais juntinhas</span>',
         eo_uma:'1️⃣<span class="cap">Uma letra sozinha</span>'})},
      {q:'Em <b>BR, CR, DR, FR, GR, PR, TR</b> e <b>VR</b>, qual é sempre a <b>segunda</b> letra? ✏️',
       audio:['e_letra_r'], stage:'<div class="wordtiles"><span class="lettile">B</span><span class="lettile hl">?</span><span class="lettile">C</span><span class="lettile hl">?</span><span class="lettile">P</span><span class="lettile hl">?</span></div>', colorOpts:true,
       options:mkOpts('le_r',['le_r','le_l','le_s','le_m'],{le_r:'R',le_l:'L',le_s:'S',le_m:'M'},k=>({big:true}))},
      {q:'Em <b>BL, CL, FL, GL</b> e <b>PL</b>, qual é sempre a <b>segunda</b> letra? ✏️',
       audio:['e_letra_l'], stage:'<div class="wordtiles"><span class="lettile">B</span><span class="lettile hl">?</span><span class="lettile">F</span><span class="lettile hl">?</span><span class="lettile">G</span><span class="lettile hl">?</span></div>', colorOpts:true,
       options:mkOpts('le_l',['le_l','le_r','le_s','le_m'],{le_l:'L',le_r:'R',le_s:'S',le_m:'M'},k=>({big:true}))},
    ];
    return mix(rounds, shuffle(conc).slice(0,2));
  },

  /* 2. PÕE O R! */
  poer(){ return buildAdd(ADD_R,'r_q','r_q2','r_modelo','r_exp','R'); },
  /* 3. PÕE O L! */
  poel(){ return buildAdd(ADD_L,'l_q','l_q2','l_modelo','l_exp','L'); },

  /* 4. COMPLETE A PALAVRA — qual encontro consonantal falta */
  completa(){
    const pool=WORDS.filter(w=>!w.amb && w.art);
    return shuffle(pool).slice(0,8).map(it=>({
      q:'Olhe o desenho e <b>complete</b> a palavra. Qual pedacinho está faltando? ✍️',
      audio:['c_q',it.ak],
      stage:illo(it.art,110)+tilesGap(it.pre,it.rest),
      options:encOpts(it.enc).map(o=>Object.assign(o,{expAud:o.correct?'c_exp':null}))
    }));
  },

  /* 5. FRASE CERTA — par mínimo dentro de uma frase dos contos */
  frase(){
    return shuffle(FRASES).slice(0,7).map(it=>({
      q:'Complete a frase com a palavra certa: 📝',
      audio:['f_q',it.aud],
      stage:(it.art?illo(it.art,110):emo(it.emo||'❓',66))+
            '<div class="frase">'+it.txt+' <span class="lac">?</span></div>',
      options:shuffle([
        {label:it.ok,   aud:it.okAud,   correct:true},
        {label:it.bad,  aud:it.badAud,  correct:false},
        {label:it.bad2, aud:it.bad2Aud, correct:false}
      ])
    }));
  },

  /* 6. CONTA SÍLABAS — a palavra NÃO aparece separada (a criança separa) */
  silabas(){
    const pool=WORDS.filter(w=>w.art).concat(NOENC.filter(w=>w.art));
    return shuffle(pool).slice(0,8).map(it=>{
      const set=new Set([it.syl]);
      while(set.size<4) set.add(rint(1,5));
      return {
        q:'Bata palmas e conte os pedacinhos de <b>'+it.w+'</b> 👏',
        audio:['q_silaba',it.ak],
        stage:illo(it.art,110)+tiles(it.w)+'<div style="font-size:32px;margin-top:6px">👏</div>',
        options:shuffle([...set]).map(v=>({
          label:'<span style="font-size:40px">'+v+'</span>', aud:'p'+v, correct:v===it.syl
        }))
      };
    });
  },

  /* 7. CAPA DE LIVRO — título, autor, ilustrador, editora */
  capa(){
    const campos=[
      {q:'Olhe a capa. Qual é o <b>TÍTULO</b> deste livro? (é o nome da história, em letras bem grandes) 📕',
       a:'cp_titulo', c:'tit', ca:'titA'},
      {q:'Olhe a capa. Quem <b>escreveu</b> este livro (o autor ou a autora)? ✍️',
       a:'cp_autor', c:'aut', ca:'autA'},
      {q:'Olhe a capa. Quem <b>ILUSTROU</b> este livro? (é quem fez os desenhos) 🎨',
       a:'cp_ilustrador', c:'ilu', ca:'iluA'},
      {q:'Olhe a capa. Qual é a <b>EDITORA</b> deste livro? (é a empresa que produziu o livro) 🏭',
       a:'cp_editora', c:'edi', ca:'ediA'},
    ];
    const rounds=[];
    const ordemCampos=shuffle(campos);
    shuffle(CAPAS).slice(0,4).forEach((cp,i)=>{
      const campo=ordemCampos[i%ordemCampos.length];
      rounds.push({ q:campo.q, audio:[campo.a], stage:capaHtml(cp), colorOpts:true,
                    options:capaOpts(cp,campo.c,campo.ca) });
    });
    const conc=[
      {q:'Para que serve a <b>capa</b> de um livro? 📗', audio:['cp_oque'], stage:illo('livro',110), colorOpts:true,
       options:mkOpts('cpo_mostrar',['cpo_mostrar','cpo_sentar','cpo_comer'],{
         cpo_mostrar:'👀<span class="cap">Mostrar do que o livro fala e chamar a atenção</span>',
         cpo_sentar:'🪑<span class="cap">Servir de banquinho</span>',
         cpo_comer:'🍎<span class="cap">Guardar comida</span>'})},
      {q:'Nas capas, qual informação aparece com <b>letras maiores</b>, bem em destaque? 🔠',
       audio:['cp_maior'], stage:capaHtml(CAPAS[0]), colorOpts:true,
       options:mkOpts('pa_titulo',['pa_titulo','pa_autor','pa_editora'],{
         pa_titulo:'📕<span class="cap">O título</span>', pa_autor:'✍️<span class="cap">O autor</span>',
         pa_editora:'🏭<span class="cap">A editora</span>'})},
      {q:'Como se chama a pessoa que <b>escreveu</b> a história? ✍️', audio:['cp_quem_escreve'],
       stage:emo('✍️📖',56), colorOpts:true,
       options:mkOpts('pa_autor',['pa_autor','pa_ilustrador','pa_leitor'],{
         pa_autor:'✍️<span class="cap">O autor</span>', pa_ilustrador:'🎨<span class="cap">O ilustrador</span>',
         pa_leitor:'👦<span class="cap">O leitor</span>'})},
      {q:'Como se chama a pessoa que fez os <b>desenhos</b> do livro? 🎨', audio:['cp_quem_desenha'],
       stage:emo('🎨🖍️',56), colorOpts:true,
       options:mkOpts('pa_ilustrador',['pa_ilustrador','pa_autor','pa_editora'],{
         pa_ilustrador:'🎨<span class="cap">O ilustrador</span>', pa_autor:'✍️<span class="cap">O autor</span>',
         pa_editora:'🏭<span class="cap">A editora</span>'})},
      {q:'Antes de abrir o livro, o que a capa ajuda a gente a descobrir? 🔍', audio:['cp_antes'],
       stage:illo('livro',110), colorOpts:true,
       options:mkOpts('cpa_historia',['cpa_historia','cpa_final','cpa_nada'],{
         cpa_historia:'💡<span class="cap">Uma ideia da história que vai ser contada</span>',
         cpa_final:'🔚<span class="cap">O final inteirinho</span>',
         cpa_nada:'🚫<span class="cap">Nada</span>'})},
    ];
    return mix(rounds, shuffle(conc).slice(0,3));
  },

  /* 8. OS CONTOS — compreensão de Cachinhos, Porquinhos e Soldadinho */
  contos(){
    const CACHINHOS=[
      {q:'Na história de <b>Cachinhos Dourados</b>, onde ficava a casa dos três ursos? 🏡',
       audio:['ca_local'], stage:emo('🐻🏡',56), colorOpts:true,

  /* 9. ORDEM DA HISTÓRIA — partes do conto + montar a sequência */
  ordem(){
    const seq=pick(SEQS);
    const tit=pick(TITULOS);
    const rounds=[
      {mode:'seq', q:'Toque nos acontecimentos de <b>'+seq.nome+'</b> na <b>ordem certa</b>. 🧩',
       audio:['ct_ordem'], stage:illo(seq.art,110), itens:seq.itens, expAud:'ct_ordem_ok'},
      {mode:'seq', q:'Estas palavras estão embaralhadas. Toque nelas em ordem e monte o <b>título</b>! 🔀',
       audio:['or_q'], stage:illo(tit.art,110), itens:tit.itens, expAud:null},
    ];
    const conc=[
      {q:'O que é um <b>CONTO</b>? 📖', audio:['ct_oque'], stage:illo('livro',110), colorOpts:true,
       options:mkOpts('co_pequena',['co_pequena','co_receita','co_musica'],{
         co_pequena:'📖<span class="cap">História pequena, com início, meio e fim</span>',
         co_receita:'🍰<span class="cap">Uma lista de ingredientes</span>',
         co_musica:'🎵<span class="cap">Uma música para cantar</span>'})},
      {q:'Os contos têm <b>três partes</b>. Quais são elas? 1️⃣2️⃣3️⃣', audio:['ct_partes'],
       stage:emo('📖1️⃣2️⃣3️⃣',48), colorOpts:true,
       options:mkOpts('pt_tres',['pt_tres','pt_letras','pt_capa'],{
         pt_tres:'✅<span class="cap">Introdução, desenvolvimento e conclusão</span>',
         pt_letras:'🔤<span class="cap">Vogais, consoantes e sílabas</span>',
         pt_capa:'📕<span class="cap">Capa, meio e fundo</span>'})},
      {q:'Como se chama a parte do conto em que aparecem os <b>personagens</b> e o <b>lugar</b>? 🚪',
       audio:['ct_intro'], stage:emo('🚪📖',56), colorOpts:true,
       options:mkOpts('na_intro',['na_intro','na_desen','na_conclu'],PARTE_LBL)},
      {q:'Como se chama a parte do <b>meio</b>, em que a história se desenrola? 🌀',
       audio:['ct_desen'], stage:emo('🌀📖',56), colorOpts:true,
       options:mkOpts('na_desen',['na_intro','na_desen','na_conclu'],PARTE_LBL)},
      {q:'Como se chama a parte <b>final</b>, em que a história termina? 🏁',
       audio:['ct_conclu'], stage:emo('🏁📖',56), colorOpts:true,
       options:mkOpts('na_conclu',['na_intro','na_desen','na_conclu'],PARTE_LBL)},
    ];
    return mix(rounds, shuffle(conc).slice(0,4));
  },
};

/* construtor comum dos jogos "Põe o R" e "Põe o L" */
function buildAdd(lista, qArt, qSemArt, modeloAud, expAud, letra){
  return shuffle(lista).slice(0,7).map((it,ix)=>{
    const primeira = ix===0;
    const alvo = it.art ? illo(it.art,92) : '<span class="obj" style="font-size:52px">❓</span>';
    const base = (it.bArt?illo(it.bArt,72):'')+tiles(it.base);
    return {
      q:'Acrescente a letra <b>'+letra+'</b> em <b>'+it.base+'</b>. Qual palavra ficou certa? ➕',
      audio:(primeira?[modeloAud]:[]).concat([it.art?qArt:qSemArt, it.bAud]),
      stage:'<div class="illorow"><div class="illocol">'+base+'</div>'+
            '<span class="seta">➡️</span>'+
            '<div class="illocol">'+alvo+'</div></div>',
      options:shuffle([
        {label:it.ok, aud:it.okAud, correct:true, expAud:expAud},
        ...it.wrong.map(w=>({label:w[0], aud:w[1], correct:false}))
      ])
    };
  });
}

function enterApp(){
  initAudio();
  unlockAudio();
  document.getElementById('splash').style.display='none';
  goHome(true);
  setTimeout(()=>playKeys(['greet']),350);
}
document.getElementById('startBtn').addEventListener('click',enterApp);
document.getElementById('splash').addEventListener('click',e=>{ if(e.target.id!=='startBtn'){ enterApp(); } });
